l_english:
 # Cyber Kings experimental (2026-11-13): space-lane travel flavor events (events/ck_exp_lane_events.txt)
 ck_lane.0001.t:0 "Aurora Storm"
 ck_lane.0001.desc:0 "The lane ahead has caught fire. Curtains of green and violet light pour across the viewports, and the ship's lamps flicker in time with them. The Guild pilot says the storm will burn itself out in a week or two, but that the lane itself is still there, somewhere inside the light."
 ck_lane.0001.a:0 "We wait. The void is patient, and so am I."
 ck_lane.0001.b:0 "Take us through it."
 ck_lane.0001.b.success:0 "The ship comes out the other side, its hull singing, and the crew talk of nothing else."
 ck_lane.0001.b.failure:0 "The ship loses the lane in the glare and drifts for days before the pilot finds it again."
 ck_lane.0002.t:0 "The Guild's Toll"
 ck_lane.0002.desc:0 "A Spacer Guild station hangs at the narrows of the lane, its beacons blinking across the dark. The station master hails us politely: no ship passes without paying the Guild its due, and rulers are no exception."
 ck_lane.0002.a:0 "Pay the toll."
 ck_lane.0002.b:0 "Remind the station master who keeps the Guild in business."
 ck_lane.0002.c:0 "I will not be robbed. We wait for a free passage."
 ck_lane.0003.t:0 "Derelict in the Lane"
 ck_lane.0003.desc:0 "A dark hull drifts at the edge of the lane, older than any ship the Guild flies. Its crew are still aboard, frozen at their posts, and its holds are still sealed."
 ck_lane.0003.a:0 "Open the holds. The dead have no use for cargo."
 ck_lane.0003.b:0 "Give them the rites they never received."
 ck_lane.0003.c:0 "Leave it. Some things are better left to the void."
 ck_lane.0004.t:0 "The Mare Incognitum"
 ck_lane.0004.desc:0 "Beyond the glowing edge of the lane lies the $game_concept_mare_incognitum$: no stars, no light, nothing at all. The crew will not look at it. I find I cannot look away."
 ck_lane.0004.a:0 "I will learn what I can from it."
 ck_lane.0004.b:0 "Close the shutters. I would rather pray."
 ck_lane.0004.c:0 "Close the shutters. I would rather sleep."
