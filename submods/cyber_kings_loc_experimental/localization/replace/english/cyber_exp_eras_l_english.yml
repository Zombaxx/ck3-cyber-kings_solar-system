l_english:
 # Cyber Kings experimental (2026-11-12): culture era names for a post-collapse solar system. Mechanics unchanged.
 culture_era_tribal:0 "Age of Ruin"
 culture_era_tribal_desc:0 "The Age of Ruin follows the fall of the old interplanetary civilization, before codified laws and an institutionalized government return to a [culture|E]. Rulers with [tribal_government|E] and [nomadic_government|E] can only make use of Age of Ruin [innovations|E]."
 culture_era_early_medieval:0 "Age of Recovery"
 culture_era_early_medieval_desc:0 "The Age of Recovery sees the emergence of professional administrators and a number of important [innovations|E], as a [culture|E] climbs out of the dark centuries after the Collapse."
 culture_era_high_medieval:0 "Age of Reclamation"
 culture_era_high_medieval_desc:0 "The Age of Reclamation is a time of great technological and administrative progress. Towns grow into cities and the burgher class rises, lost knowledge is recovered from the ruins of the ancients, and the space lanes grow busy again - even as the aristocracy reigns supreme."
 culture_era_late_medieval:0 "Age of Ascendancy"
 culture_era_late_medieval_desc:0 "The Age of Ascendancy marks the zenith of the new feudal worlds. Bureaucrats, artisans, merchants and money lenders are starting to encroach on the power of the old privileged classes, except for the monarchs themselves."
