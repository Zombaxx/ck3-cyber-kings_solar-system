 ck_martian_cycle_sub_region_ck_mars_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The red world, terraformed long ago, from the poles to the Valles Marineris.#!"
 ck_martian_cycle_participant_group_ck_mars_hegemon: "Martian Hegemon"
 ck_martian_cycle_participant_group_ck_mars_hegemon_desc: "The holder of [GetTitleByKey('h_mars').GetName]."
