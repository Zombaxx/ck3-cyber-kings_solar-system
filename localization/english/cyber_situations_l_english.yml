 # --- Restore the Martian Hegemony ---
 ck_restore_martian_hegemony_decision: "Restore the Martian Hegemony"
 ck_restore_martian_hegemony_decision_zeus: "Restore the Throne of Zeus"
 ck_restore_martian_hegemony_decision_desc: "Half of Mars already answers to us. The time has come to end the age of anarchy and raise the Martian hegemony once more, as it was in the days of Zeus."
 ck_restore_martian_hegemony_decision_tooltip: "Reunite Mars under one throne."
 ck_restore_martian_hegemony_decision_confirm: "Raise the hegemony"
 ck_restore_martian_hegemony_decision_effect_tt: "You become the holder of [GetTitleByKey('h_mars').GetName]. Every Martian empire whose hegemony has no holder, every Martian empire you hold, and every Martian empire at least half inside your realm becomes de jure part of it.\nThe [situation|E] $situation_type_ck_martian_cycle$ enters #V $ck_mars_stability$#!.\nIf you follow the Olympic faith you restore the Throne of Zeus and gain #V $ck_throne_of_zeus_modifier$#!."
 ck_restore_martian_hegemony_req: "Your realm holds at least #V $VALUE|0$#! counties on Mars: half of them"
 ck_throne_of_zeus_modifier: "Throne of Zeus"
 ck_throne_of_zeus_modifier_desc: "This ruler has restored the throne from which Zeus once ruled all of Mars."
 ck_situations.0001.t: "The Martian Hegemony Restored"
 ck_situations.0001.t_zeus: "The Throne of Zeus Restored"
 ck_situations.0001.desc: "The age of anarchy is over. From pole to pole, Mars answers to a single throne again, and the lords who fought us now kneel."
 ck_situations.0001.desc_zeus: "For the first time since Zeus himself, an Olympian sits on the throne of all Mars. The gods of Olympus are honoured from pole to pole, and the lords who fought us now kneel."
 ck_situations.0001.a: "Mars is one again."
 ck_situations.0002.t: "The Martian Hegemony Restored"
 ck_situations.0002.desc: "[ck_heg_founder.GetTitledFirstName] has reunited Mars and restored its hegemony. The red world will no longer be divided against itself."
 ck_situations.0002.a: "The balance of the worlds has shifted."

 # --- The European Question ---
 situation_ck_european_question: "$situation_type_ck_european_question$"
 situation_ck_european_question_desc: "$situation_type_ck_european_question_desc$"
 situation_type_ck_european_question: "The European Question"
 situation_type_ck_european_question_desc: "Europe has never stayed still for long. Its peoples make peace and bind themselves together, grow strong and reach out to conquer and colonise, turn on one another as rival powers, and tear themselves apart in great wars, until exhaustion brings them back to the table.\n\nThe European Union is only the latest attempt to hold the continent together, and the Hegemon of Eurasia watches it closely."
 ck_european_question_sub_region_ck_europe: "Europe"
 ck_european_question_sub_region_ck_europe_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The lands of the European Union, from Iceland and Britain to Greece and the eastern marches.#!"
 ck_european_question_participant_group_ck_eu_president: "President of the Union"
 ck_european_question_participant_group_ck_eu_president_desc: "The holder of [GetTitleByKey('e_european_union').GetName]."
 ck_european_question_ck_eu_president: "$situation_type_ck_european_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_european_question_participant_group_ck_eu_eurasian: "Eurasian-aligned"
 ck_european_question_participant_group_ck_eu_eurasian_desc: "The Hegemon of Eurasia, and European [rulers|E] who are his [tributaries|E], [vassals|E] or [allies|E]."
 ck_european_question_ck_eu_eurasian: "$situation_type_ck_european_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_european_question_participant_group_ck_eu_sovereigntists: "Sovereigntists"
 ck_european_question_participant_group_ck_eu_sovereigntists_desc: "Independent European [rulers|E] of [duchy|E] rank or higher, and members of independence or liberty [factions|E]."
 ck_european_question_ck_eu_sovereigntists: "$situation_type_ck_european_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_european_question_participant_group_ck_eu_integrationists: "Integrationists"
 ck_european_question_participant_group_ck_eu_integrationists_desc: "Loyal members of the European Union."
 ck_european_question_ck_eu_integrationists: "$situation_type_ck_european_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_european_question_participant_group_ck_eu_unaffiliated: "Unaffiliated"
 ck_european_question_participant_group_ck_eu_unaffiliated_desc: "Every other [ruler|E] in Europe."
 ck_european_question_ck_eu_unaffiliated: "$situation_type_ck_european_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_eu_concert: "Concert of Europe"
 ck_eu_concert_desc: "After the last great war, Europe settles its quarrels at the conference table. Wars are rare and trade flourishes."
 ck_eu_concert_effects: "Concert of Europe Effects"
 ck_eu_concert_effects_concept: "[situation|E]"
 ck_eu_integration: "Integration"
 ck_eu_integration_desc: "The Union draws its members closer: common laws, common armies, common taxes. Loyal members prosper; those who cherish their independence chafe."
 ck_eu_integration_effects: "Integration Effects"
 ck_eu_integration_effects_concept: "[situation|E]"
 ck_eu_expansion: "Age of Empire"
 ck_eu_expansion_desc: "United and strong, Europe looks outward again. Its fleets cross the space lanes in search of conquests and colonies."
 ck_eu_expansion_effects: "Age of Empire Effects"
 ck_eu_expansion_effects_concept: "[situation|E]"
 ck_eu_rivalry: "Great-Power Rivalry"
 ck_eu_rivalry_desc: "Europe divides into rival blocs. Arms races, alliances and old grudges make every crisis a spark."
 ck_eu_rivalry_effects: "Great-Power Rivalry Effects"
 ck_eu_rivalry_effects_concept: "[situation|E]"
 ck_eu_great_war: "Great War"
 ck_eu_great_war_desc: "Europe tears itself apart. Every realm mobilises, borders burn, and the Union itself may not survive."
 ck_eu_great_war_effects: "Great War Effects"
 ck_eu_great_war_effects_concept: "[situation|E]"
 # --- The European Question: breakup and confederation (2026-11-17 19:30) ---
 ck_eu_dissolution: "Dissolution"
 ck_eu_dissolution_desc: "The Union is coming apart. Members walk out one by one, and if too little of Europe is left inside it, the Union itself will be dissolved. A strong president may yet hold it together."
 ck_eu_dissolution_effects: "Dissolution Effects"
 ck_eu_dissolution_effects_concept: "[situation|E]"
 ck_eu_confederacy: "Confederation"
 ck_eu_confederacy_desc: "Europe's sovereign states have bound themselves together in a confederation of equals. They keep their independence but defend one another against outside foes. If the confederation grows and stands firm, its members may one day agree to a full union."
 ck_eu_confederacy_effects: "Confederation Effects"
 ck_eu_confederacy_effects_concept: "[situation|E]"
 ck_catalyst_eu_member_left: "A member leaves the European Union or the European Confederation"
 ck_catalyst_eu_member_left_desc: "A member leaves the European Union or the European Confederation."
 ck_catalyst_eu_confederation_joined: "A [ruler|E] joins the European Confederation"
 ck_catalyst_eu_confederation_joined_desc: "A [ruler|E] joins the European Confederation."
 ck_catalyst_eu_confederation_defended: "A member of the European Confederation beats off an attacker from outside Europe"
 ck_catalyst_eu_confederation_defended_desc: "A member of the European Confederation beats off an attacker from outside Europe."
 ck_european_confederation: "European Confederation"
 ck_european_confederation_name: "European Confederation"
 ck_found_european_confederation_decision: "Found the European Confederation"
 ck_found_european_confederation_decision_desc: "The Union is gone, and Europe is a patchwork of sovereign states again. Bound together as equals, we could still stand against the powers beyond Europe."
 ck_found_european_confederation_decision_tooltip: "Bind the sovereign states of Europe together in a confederation of equals."
 ck_found_european_confederation_decision_confirm: "Found the confederation"
 ck_found_european_confederation_decision_effect_tt: "Your house founds the #V European Confederation#!. Every other independent European [ruler|E] of [duchy|E] rank or higher who is not aligned with Eurasia is invited to join. Members join each other's defensive [wars|E] against [rulers|E] from outside Europe.\nThe [situation|E] $situation_type_ck_european_question$ enters #V $ck_eu_confederacy$#!."
 ck_refound_european_union_decision: "Re-found the European Union"
 ck_refound_european_union_decision_desc: "Charlemagne did it, and so did Napoleon and the founders of the Union. Europe needs a single crown again, and no one is better placed to wear it than us."
 ck_refound_european_union_decision_tooltip: "Recreate the European Union under your rule."
 ck_refound_european_union_decision_confirm: "Re-found the Union"
 ck_refound_european_union_decision_effect_tt: "You become the holder of [GetTitleByKey('e_european_union').GetName].\nThe [situation|E] $situation_type_ck_european_question$ enters #V $ck_eu_integration$#!."
 ck_refound_european_union_req: "Your realm holds at least #V $VALUE|0$#! counties of the European Union's lands"
 ck_situations.0102.t: "The European Confederation"
 ck_situations.0102.desc: "[ck_eu_confed_founder.GetTitledFirstName] has founded a European Confederation and invites us to join. We would keep our sovereignty, but we would be bound to defend our fellow members against any power from beyond Europe, and they us."
 ck_situations.0102.a: "We will stand together."
 ck_situations.0102.b: "We stand alone."
 ck_situations.0103.t: "From Confederation to Union"
 ck_situations.0103.desc: "The European Confederation has stood together through war and peace, and its members have grown used to acting as one. Many now ask whether the time has come for a true union, with a single crown at its head. As leader of the Confederation, that crown is ours to claim."
 ck_situations.0103.a: "Proclaim the European Union."
 ck_situations.0103.a.tt: "You become the holder of [GetTitleByKey('e_european_union').GetName], and every member of the Confederation is asked to enter the Union."
 ck_situations.0103.b: "Europe is not ready."
 ck_situations.0104.t: "A New Union"
 ck_situations.0104.desc: "[ck_eu_union_founder.GetTitledFirstName] has proclaimed a new European Union and asks the members of the Confederation to enter it, as vassals of a single crown."
 ck_situations.0104.a: "We enter the Union."
 ck_situations.0104.b: "We keep our sovereignty, and leave the Confederation."
 ck_situations.0110.t: "Leaving the Union"
 ck_situations.0110.desc: "The European Union is coming apart, and [ck_eu_president.GetTitledFirstName] can no longer hold it together. Others are walking out. We could do the same, peacefully, while the door is still open."
 ck_situations.0110.a: "We leave the Union."
 ck_situations.0110.b: "We stay."
 ck_situations.0120.t: "The Union Dissolved"
 ck_situations.0120.desc: "So few members remain that the European Union no longer means anything. [ck_eu_president.GetTitledFirstName] has given up the title, and the Union is dissolved. Europe is a continent of separate states again."
 ck_situations.0120.a: "So ends the Union."
 # --- The European Question: Imperium (2026-11-17 19:40) ---
 ck_eu_imperium: "Imperium"
 ck_eu_imperium_desc: "The Parliament is dissolved and the Union has become an empire in all but name, or in name too. No member may walk out of it any more; only rebellion or a lost war can break it apart.\n\nA Union held by a European hegemon is the heart of a world empire. While the Hegemon of Terra holds the Union, Europe is locked in the Imperium."
 ck_eu_imperium_effects: "Imperium Effects"
 ck_eu_imperium_effects_concept: "[situation|E]"
 ck_proclaim_european_imperium_decision: "Proclaim the European Imperium"
 ck_proclaim_european_imperium_decision_desc: "The Parliament talks while we rule. With the crown's authority complete and half of Europe in our hands, we can send the deputies home and govern the Union as the empire it has become, as Napoleon did."
 ck_proclaim_european_imperium_decision_tooltip: "Dissolve the European Parliament and rule the Union as an empire."
 ck_proclaim_european_imperium_decision_confirm: "Dissolve the Parliament"
 ck_proclaim_european_imperium_decision_effect_tt: "The European Parliament is dissolved: your [vassals|E] lose their council rights.\nThe [situation|E] $situation_type_ck_european_question$ enters #V $ck_eu_imperium$#!: no member can leave the Union peacefully while it lasts, and only rebellion, war between your great vassals or a lost war can end it."
 ck_proclaim_european_imperium_req: "Your realm holds at least #V $VALUE|0$#! counties of the European Union's lands"
 ck_proclaim_european_imperium_era: "The Union is in #V $ck_eu_integration$#!, the #V $ck_eu_expansion$#! or a #V $ck_eu_great_war$#!, or you have the highest [prestige_level|E]"
 ck_situations.0130.t: "The European Imperium"
 ck_situations.0130.desc: "[ck_eu_president.GetTitledFirstName] has dissolved the European Parliament and rules the Union alone. What was a union of nations is now an empire, and there is no longer any lawful way out of it."
 ck_situations.0130.a: "Long live the Emperor."
 # --- The European Question: outside rule (2026-11-17 20:10) ---
 ck_eu_foreign_dominion: "Foreign Dominion"
 ck_eu_foreign_dominion_desc: "Europe is ruled from outside: its Union is held by a foreign power, its ruler bows to one, or a single outsider holds half of the continent. Those who serve the occupier prosper; those who resist dream of liberation. If the occupier's grip loosens, Europe is free again; if it lasts fifty years, Europe is absorbed into the occupier's empire."
 ck_eu_foreign_dominion_effects: "Foreign Dominion Effects"
 ck_eu_foreign_dominion_effects_concept: "[situation|E]"
