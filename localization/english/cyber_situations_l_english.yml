# Cyber Kings (2026-11-17): The Martian Cycle and The European Question (_dev/DLC_ADAPTATION.md section 7).

 # --- The Martian Cycle ---
 situation_ck_martian_cycle: "$situation_type_ck_martian_cycle$"
 situation_ck_martian_cycle_desc: "$situation_type_ck_martian_cycle_desc$"
 situation_type_ck_martian_cycle: "The Martian Cycle"
 situation_type_ck_martian_cycle_desc: "Zeus once ruled all of Mars from Olympus, and his empire fell apart after him. Since then the red world has been broken and remade again and again: great houses fight their way up, one of them restores the Martian hegemony, and in time it decays and Mars falls back into anarchy.\n\nWhoever holds half of Mars can restore the hegemony. A ruler of the Olympic faith restores the Throne of Zeus itself."
