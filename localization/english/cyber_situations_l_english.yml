 ck_martian_cycle_participant_group_ck_mars_olympians: "Olympian Restorers"
 ck_martian_cycle_participant_group_ck_mars_olympians_desc: "[rulers|E] of the Olympic faith, of [duchy|E] rank or higher, with their [capital|E] on Mars: the heirs of Zeus, who would rebuild his throne."
 ck_martian_cycle_ck_mars_olympians: "$situation_type_ck_martian_cycle$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_martian_cycle_participant_group_ck_mars_great_houses: "Great Houses"
 ck_martian_cycle_participant_group_ck_mars_great_houses_desc: "Other [rulers|E] of [kingdom|E] rank or higher with their [capital|E] on Mars."
 ck_martian_cycle_ck_mars_great_houses: "$situation_type_ck_martian_cycle$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_martian_cycle_participant_group_ck_mars_lords: "Martian Lords"
 ck_martian_cycle_participant_group_ck_mars_lords_desc: "Every other [ruler|E] with land on Mars."
 ck_martian_cycle_ck_mars_lords: "$situation_type_ck_martian_cycle$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_mars_anarchy: "Anarchy"
 ck_mars_anarchy_desc: "Mars has no master. Lords and great houses carve the world up among themselves, and every border is a battlefield."
 ck_mars_anarchy_effects: "Anarchy Effects"
 ck_mars_anarchy_effects_concept: "[situation|E]"
 ck_mars_unification: "Unification"
 ck_mars_unification_desc: "One or more great powers are gathering Mars under their banners. Their rivals must submit or be crushed."
 ck_mars_unification_effects: "Unification Effects"
 ck_mars_unification_effects_concept: "[situation|E]"
 ck_mars_stability: "Imperial Stability"
 ck_mars_stability_desc: "The Martian hegemony stands. Its ruler commands the loyalty of the red world, and its roads and canals prosper."
 ck_mars_stability_effects: "Imperial Stability Effects"
 ck_mars_stability_effects_concept: "[situation|E]"
 ck_mars_decline: "Decline"
 ck_mars_decline_desc: "The Martian hegemony is weakening. Its vassals grow restless and its enemies smell blood. A strong ruler may yet restore it; otherwise Mars will fall back into anarchy."
 ck_mars_decline_effects: "Decline Effects"
 ck_mars_decline_effects_concept: "[situation|E]"

