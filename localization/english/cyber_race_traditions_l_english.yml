 # Cyber Kings (2026-11-13): race traditions (common/culture/traditions/cyber_kings_race_traditions.txt)
 tradition_ck_antecessor_name:0 "Antecessor Blood"
 tradition_ck_antecessor_desc:0 "This culture descends from the Antecessors, one of the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_ergaster_name:0 "Ergaster Blood"
 tradition_ck_ergaster_desc:0 "This culture descends from the Ergaster, one of the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_archon_name:0 "Archon Blood"
 tradition_ck_archon_desc:0 "This culture descends from the Archons, one of the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_aeon_name:0 "Aeon Blood"
 tradition_ck_aeon_desc:0 "This culture descends from the Aeons, one of the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_neanderthal_name:0 "Neanderthal Blood"
 tradition_ck_neanderthal_desc:0 "This culture descends from the Neanderthals, one of the Proto peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_jotnar_name:0 "Jotnar Blood"
 tradition_ck_jotnar_desc:0 "This culture descends from the Jotnar, one of the Proto peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_cathrian_name:0 "Cathrian Blood"
 tradition_ck_cathrian_desc:0 "This culture descends from the Cathrians, one of the Cathrian peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_mau_khet_name:0 "Mau'Khet Blood"
 tradition_ck_mau_khet_desc:0 "This culture descends from the Mau'Khet, one of the Cathrian peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_thark_name:0 "Thark Blood"
 tradition_ck_thark_desc:0 "This culture descends from the Thark, one of the Denisovan peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_torquas_name:0 "Torquas Blood"
 tradition_ck_torquas_desc:0 "This culture descends from the Torquas, one of the Denisovan peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_phaeter_name:0 "Phaetēr Blood"
 tradition_ck_phaeter_desc:0 "This culture descends from a clone line of Dyēus Phaetēr, the Sky Father and first lord of Ganymede, one of the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_elohim_name:0 "Elohim Blood"
 tradition_ck_elohim_desc:0 "This culture descends from the Elohim, the shared lineage of the Archons and the Aeons, among the Archaic peoples. Hybrid cultures can carry this lineage on."
 tradition_ck_archaic_name:0 "Archaic Blood"
 tradition_ck_archaic_desc:0 "This culture descends from the Archaic lineage shared by the Antecessors and the Ergaster. Hybrid cultures can carry this lineage on."
 tradition_ck_celestial_name:0 "Celestial Blood"
 tradition_ck_celestial_desc:0 "This culture descends from the Celestials, the Cywizard court of the Ancient Cyborg, whose clone line is older than the Yellow Emperor. Hybrid cultures can carry this lineage on."
 tradition_ck_spacer_heritage_name:0 "Spacer Heritage"
 tradition_ck_spacer_heritage_desc:0 "This culture was born aboard the generation ships of the Great Voyage, above all the Aurora, and still lives by the ways of the fleet. Hybrid cultures can carry this heritage on."
 tradition_ck_tau_ceti_name:0 "Tau Ceti"
 tradition_ck_tau_ceti_desc:0 "This culture's roots lie in Tau Ceti, the neighbouring star whose ancient empire sent the Great Voyage to Sol. Hybrid cultures can carry this heritage on."
