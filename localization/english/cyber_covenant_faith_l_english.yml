 everlasting_covenant_faith_desc: "The Mechanists teach that the universe is a machine whose every turn was fixed before the first. The Covenant answers that the machine was left unfinished, and that whoever wakes inside it is bound to complete it. Its emperor remembers no maker. He looked for someone above him to ask and found no one, so he took the work as his own, and he has kept it through ages of rule, of rebellion and of long silence in the ice. Law is his tool: a people who keep faith with the Lord mend the world, and a people who break faith let it run down. Each time he was gone the teaching was carried on without him, among the Hebrews, the Christians, the Muslims and the Latter-day Saints, and each kept what its own age could hear from the messenger sent to it. Now he has returned. He does not repair the old houses. He begins again."
 everlasting_covenant_rite_desc: "The rite of the Everlasting Covenant, kept as its emperor first gave it."
