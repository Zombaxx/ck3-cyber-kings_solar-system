 situation_type_ck_corporate_wars: "Charter and Crown"
 situation_type_ck_corporate_wars_desc: "Across the solar system the great trade hubs - the ports of Earth and the capitals of the other worlds - are fought over by two kinds of power. The megacorporations want free charters, low taxes and cities that answer to their boards; the crowned sovereigns want to tax, regulate and own them. Every ruler who holds a trade hub must choose a side, or try to stay out of it."
 ck_corporate_wars_sub_region_ck_trade_hubs: "The Trade Hubs"
 ck_corporate_wars_sub_region_ck_trade_hubs_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The great ports and capitals where the solar system trades.#!"
 ck_corporate_wars_participant_group_ck_cc_corporate_leader: "Corporate Leader"
 ck_corporate_wars_participant_group_ck_cc_corporate_leader_desc: "The richest corporation of the solar system leads the corporate side."
 ck_corporate_wars_ck_cc_corporate_leader: "$situation_type_ck_corporate_wars$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_corporate_wars_participant_group_ck_cc_sovereign_leader: "Sovereign Leader"
 ck_corporate_wars_participant_group_ck_cc_sovereign_leader_desc: "The greatest independent crowned ruler leads the sovereign side."
 ck_corporate_wars_ck_cc_sovereign_leader: "$situation_type_ck_corporate_wars$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_corporate_wars_participant_group_ck_cc_corporate: "Corporations"
 ck_corporate_wars_participant_group_ck_cc_corporate_desc: "City republics, and every ruler who has declared for the corporations."
