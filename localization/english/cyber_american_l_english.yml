# Cyber Kings (2026-11-17): The American Question (_dev/DLC_ADAPTATION.md section 18).
 situation_ck_american_question: "$situation_type_ck_american_question$"
 situation_ck_american_question_desc: "$situation_type_ck_american_question_desc$"
 situation_type_ck_american_question: "The American Question"
 situation_type_ck_american_question_desc: "The United States is one people split into rival regions: the blue coasts and cities, the red South and interior, and the swing states between them. Unlike the European Union, no state may leave in peace: secession means civil war. The Union moves through the cycles of its history - eras of good feelings, awakenings, gilded ages, depressions, reform and crisis - and may yet break apart, fall to corporations, or become an empire that conquers the Americas."
 ck_american_question_sub_region_ck_america: "The United States"
 ck_american_question_sub_region_ck_america_desc: "$SITUATION_SUB_REGION_TOOLTIP_DESC$\n\n#weak The lands of the de jure United States.#!"
 ck_american_question_participant_group_ck_us_president: "President"
 ck_american_question_participant_group_ck_us_president_desc: "The holder of [GetTitleByKey('e_united_states').GetName]."
 ck_american_question_ck_us_president: "$situation_type_ck_american_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_american_question_participant_group_ck_us_corporate: "Corporate Free Cities"
 ck_american_question_participant_group_ck_us_corporate_desc: "Republics with their [capital|E] in the United States: cities that bought their way out of the Union."
 ck_american_question_ck_us_corporate: "$situation_type_ck_american_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_american_question_participant_group_ck_us_blue: "Blue Bloc"
 ck_american_question_participant_group_ck_us_blue_desc: "[rulers|E] of the blue American cultures (Equitable, Xenophilic, City Keepers or Philosopher traditions): the coasts and the great cities."
 ck_american_question_ck_us_blue: "$situation_type_ck_american_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_american_question_participant_group_ck_us_red: "Red Bloc"
 ck_american_question_participant_group_ck_us_red_desc: "[rulers|E] of the red American cultures (Staunch Traditionalists, Reverence for Veterans or Strong Kinship traditions): the South and the interior."
 ck_american_question_ck_us_red: "$situation_type_ck_american_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_american_question_participant_group_ck_us_swing: "Swing States"
 ck_american_question_participant_group_ck_us_swing_desc: "Every other [ruler|E] in the United States: the Midwest, the Southwest and everyone outside the two blocs."
 ck_american_question_ck_us_swing: "$situation_type_ck_american_question$ #weak ($PARTICIPANT_GROUP$)#!"
 ck_us_status_quo: "Dubious Status Quo"
 ck_us_status_quo_desc: "The Union holds, but only just. Gridlock rules Washington and every election could tip the country one way or the other."
 ck_us_status_quo_effects: "Dubious Status Quo Effects"
 ck_us_status_quo_effects_concept: "[situation|E]"
 ck_us_good_feelings: "Era of Good Feelings"
 ck_us_good_feelings_desc: "After the crisis comes consensus. The parties agree on more than they admit, and the Union builds and prospers."
 ck_us_good_feelings_effects: "Era of Good Feelings Effects"
 ck_us_good_feelings_effects_concept: "[situation|E]"
 ck_us_great_awakening: "Great Awakening"
 ck_us_great_awakening_desc: "A wave of revival and reform sweeps the country. Preachers, prophets and activists question everything the Union stands for."
 ck_us_great_awakening_effects: "Great Awakening Effects"
 ck_us_great_awakening_effects_concept: "[situation|E]"
 ck_us_gilded_age: "Gilded Age"
 ck_us_gilded_age_desc: "Fortunes are made overnight. Robber barons and megacorporations grow richer than states, and the cities glitter over their slums."
 ck_us_gilded_age_effects: "Gilded Age Effects"
 ck_us_gilded_age_effects_concept: "[situation|E]"
 ck_us_great_depression: "Great Depression"
 ck_us_great_depression_desc: "The boom has collapsed. Banks fail, factories close, and desperate people listen to radicals and strongmen."
 ck_us_great_depression_effects: "Great Depression Effects"
 ck_us_great_depression_effects_concept: "[situation|E]"
 ck_us_reform_era: "Reform Era"
 ck_us_reform_era_desc: "The federal government reins in the trusts and builds a safety net. Progressives and New Dealers remake the Union."
 ck_us_reform_era_effects: "Reform Era Effects"
 ck_us_reform_era_effects_concept: "[situation|E]"
 ck_us_american_century: "American Century"
 ck_us_american_century_desc: "The Union is a superpower. Its fleets and armies reach across the worlds, and its allies look to it for leadership."
 ck_us_american_century_effects: "American Century Effects"
 ck_us_american_century_effects_concept: "[situation|E]"
 ck_us_polarization: "Polarization"
 ck_us_polarization_desc: "The red and blue blocs no longer trust each other. Every election is a crisis, and talk of separation grows louder."
 ck_us_polarization_effects: "Polarization Effects"
 ck_us_polarization_effects_concept: "[situation|E]"
 ck_us_secession_crisis: "Secession Crisis"
 ck_us_secession_crisis_desc: "A bloc talks openly of leaving the Union. Conventions gather, militias drill, and the president must decide how far to go to hold the country together."
 ck_us_secession_crisis_effects: "Secession Crisis Effects"
 ck_us_secession_crisis_effects_concept: "[situation|E]"
 ck_us_civil_war: "Civil War"
 ck_us_civil_war_desc: "The Union is at war with itself. If the president wins, Reconstruction follows; if the secessionists win, the Union breaks apart."
 ck_us_civil_war_effects: "Civil War Effects"
 ck_us_civil_war_effects_concept: "[situation|E]"
 ck_us_reconstruction: "Reconstruction"
 ck_us_reconstruction_desc: "The victors remake the defeated regions. A strong president may turn the emergency into permanent power."
 ck_us_reconstruction_effects: "Reconstruction Effects"
 ck_us_reconstruction_effects_concept: "[situation|E]"
 ck_us_balkanization: "Balkanization"
 ck_us_balkanization_desc: "The Union has broken apart into bloc states, corporate cities and free kingdoms. Whoever gathers half of it again can restore the Union."
 ck_us_balkanization_effects: "Balkanization Effects"
 ck_us_balkanization_effects_concept: "[situation|E]"
 ck_us_corporate_secession: "Corporate Secession"
 ck_us_corporate_secession_desc: "The richest cities have bought their way out of the Union and govern themselves as corporate free cities."
 ck_us_corporate_secession_effects: "Corporate Secession Effects"
 ck_us_corporate_secession_effects_concept: "[situation|E]"
 ck_us_imperial_presidency: "Imperial Presidency"
 ck_us_imperial_presidency_desc: "Congress is suspended and the president rules by decree. No state may leave, and the Union looks outward for conquests."
 ck_us_imperial_presidency_effects: "Imperial Presidency Effects"
 ck_us_imperial_presidency_effects_concept: "[situation|E]"
 ck_us_manifest_destiny: "Manifest Destiny"
 ck_us_manifest_destiny_desc: "The Union believes it is destined to rule the Americas. Its armies march to forge a Hegemony of the Americas that can rival Eurasia."
 ck_us_manifest_destiny_effects: "Manifest Destiny Effects"
 ck_us_manifest_destiny_effects_concept: "[situation|E]"
 ck_us_progressive_commonwealth: "Progressive Commonwealth"
 ck_us_progressive_commonwealth_desc: "A rare peaceful, egalitarian federation: power is shared, wars are shunned, and prosperity spreads."
 ck_us_progressive_commonwealth_effects: "Progressive Commonwealth Effects"
 ck_us_progressive_commonwealth_effects_concept: "[situation|E]"
 ck_us_foreign_dominion: "Foreign Dominion"
 ck_us_foreign_dominion_desc: "The Union is ruled from outside America. Its people resent their foreign masters."
 ck_us_foreign_dominion_effects: "Foreign Dominion Effects"
 ck_us_foreign_dominion_effects_concept: "[situation|E]"
 ck_catalyst_us_passing_years: "Passing Years"
 ck_catalyst_us_passing_years_desc: "Every year moves the Union along its cycle."
 ck_catalyst_us_polarizing_election: "Polarizing Election"
 ck_catalyst_us_polarizing_election_desc: "An election held with polarization at 60 or more."
 ck_catalyst_us_consensus_election: "Consensus Election"
 ck_catalyst_us_consensus_election_desc: "An election held with polarization at 30 or less."
 ck_catalyst_us_internal_war: "War Between States"
 ck_catalyst_us_internal_war_desc: "Two rulers inside the Union went to war with each other."
 ck_catalyst_us_separatist_movement: "Separatist Movement"
 ck_catalyst_us_separatist_movement_desc: "An independence faction targets the president."
