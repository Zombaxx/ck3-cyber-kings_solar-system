 ck_manifest_destiny_county_cb: "Manifest Destiny (County)"
 ck_manifest_destiny_county_cb_desc: "During Manifest Destiny, the President of the United States may seize lands of the Americas."
 ck_manifest_destiny_duchy_cb: "Manifest Destiny (Duchy)"
 ck_manifest_destiny_duchy_cb_desc: "During Manifest Destiny, the President of the United States may seize lands of the Americas."
 ck_us_divided_government_modifier: "Divided Government"
 ck_us_divided_government_modifier_desc: "A polarizing election left this president facing a hostile country."
 ck_us_national_mandate_modifier: "National Mandate"
 ck_us_national_mandate_modifier_desc: "A consensus election gave this president a broad mandate."
 ck_american.0001.t: "Election Day"
 ck_american.0001.desc_divided: "The votes are counted and the country is split down the middle. Half the Union calls the result stolen, and the other half calls the losers traitors."
 ck_american.0001.desc_mandate: "The votes are counted and the country has spoken with one voice. For once, the Union stands together behind its president."
 ck_american.0001.desc_close: "The votes are counted. The result is close, the losers grumble, and the Union carries on as before."
 ck_american.0001.a: "Four more years."
 ck_american.0010.t: "A Corporate Charter"
 ck_american.0010.desc: "The boards of the great corporations in my city offer a deal: incorporate the city, buy out our obligations to [ck_us_president.GetShortUIName], and govern ourselves as a free city. The money would be enormous."
 ck_american.0010.a: "Incorporate. We are a free city now."
 ck_american.0010.b: "We remain part of the Union."
 ck_american.0011.t: "A City Breaks Away"
 ck_american.0011.desc: "[ck_us_free_city.GetShortUIName] has incorporated their city and declared it a corporate free city, outside the Union. The charter fees have been paid into the treasury."
 ck_american.0011.a: "Take the money."
 ck_american.0011.b: "This is treason. We will take it back."
 ck_american.0020.t: "A Secession Convention"
 ck_american.0020.desc: "Delegates from across our region are calling for a convention to discuss leaving the Union of [ck_us_president.GetShortUIName]. They want me to lead it."
 ck_american.0020.a: "Call the convention."
 ck_american.0020.b: "Not yet."
 ck_american.0030.t: "The Imperial Presidency"
 ck_american.0030.desc: "[ck_us_president.GetShortUIName] has suspended Congress and will rule the United States by decree. No state will be allowed to leave."
 ck_american.0030.a: "A dark day for the Republic."
 ck_american.0040.t: "A New Union"
 ck_american.0040.desc: "With the old Union broken, [ck_us_bloc_leader.GetShortUIName] invites us to join their realm, as the states of our bloc gather together again."
 ck_american.0040.a: "We join them."
 ck_american.0040.b: "We stand alone."
 ck_american.0050.t: "The Union Is Broken"
 ck_american.0050.desc: "The United States has broken apart. The blocs gather their own states, the corporate cities govern themselves, and the great vassals have gone their own way."
 ck_american.0050.a: "What now?"
 ck_american.0060.t: "The Hegemony of the Americas"
 ck_american.0060.desc: "[ck_americas_hegemon.GetShortUIName] has proclaimed the Hegemony of the Americas. From the Arctic to Patagonia, the Americas answer to one throne, and it means to rival Eurasia."
 ck_american.0060.a: "The balance of the world has shifted."
