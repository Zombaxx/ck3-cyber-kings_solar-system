 ck_catalyst_us_external_defeat: "Defeat Abroad"
 ck_catalyst_us_external_defeat_desc: "The president lost a war against an outside power."
 ck_catalyst_us_continental_conquest: "Continental Conquest"
 ck_catalyst_us_continental_conquest_desc: "The president won a war against a power of the Americas."
 ck_catalyst_us_corporate_charter: "Corporate Charter"
 ck_catalyst_us_corporate_charter_desc: "A city broke away from the Union as a corporate free city."
 ck_catalyst_us_civil_war: "Shots Fired"
 ck_catalyst_us_civil_war_desc: "An independence war was declared on the president."
 ck_catalyst_us_union_preserved: "Union Preserved"
 ck_catalyst_us_trust_busting: "Trust-Busting"
 ck_catalyst_us_trust_busting_desc: "The president revoked the charters of the corporations in the Union (Charter and Crown)."
 ck_catalyst_us_union_preserved_desc: "The president won an independence war."
 ck_us_imperial_presidency_decision: "Assume the Imperial Presidency"
 ck_us_imperial_presidency_decision_desc: "Suspend Congress and rule the Union by decree. No state will be allowed to leave."
 ck_us_imperial_presidency_decision_tooltip: "Rule the Union by decree"
 ck_us_progressive_commonwealth_decision: "Proclaim the Progressive Commonwealth"
 ck_us_progressive_commonwealth_decision_desc: "Share power with the states, renounce conquest and build a fair and peaceful Union."
 ck_us_progressive_commonwealth_decision_tooltip: "Turn the Union into a Progressive Commonwealth"
 ck_us_refound_union_decision: "Re-found the United States"
 ck_us_refound_union_decision_desc: "Gather the broken states and proclaim the Union restored."
 ck_us_refound_union_decision_tooltip: "Restore the United States"
 ck_found_americas_hegemony_decision: "Proclaim the Hegemony of the Americas"
 ck_found_americas_hegemony_decision_desc: "Unite the Americas under one throne, to rival Eurasia."
 ck_found_americas_hegemony_decision_tooltip: "Rule the Americas"
