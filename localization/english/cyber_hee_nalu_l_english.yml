 hee_nalu_choose_aumakua_decision: "Choose the House 'Aumakua"
 hee_nalu_choose_aumakua_decision_tooltip: "Name the ancestral guardian that watches over your house"
 hee_nalu_choose_aumakua_decision_desc: "Every family of the old islands had its 'aumakua: an ancestor who came back in the body of an animal to watch over the living. Ours has gone unnamed too long."
 hee_nalu_choose_aumakua_decision_confirm: "Go to the heiau"
 hee_nalu_choose_aumakua_decision_effect_tt: "You choose one guardian. Every member of your [house|E] gains its blessing, for good."
 hee_nalu_choose_aumakua_house_head_trigger: "You are the head of your [house|E]"
 hee_nalu_bless_the_swell_decision: "Bless the Swell"
 hee_nalu_bless_the_swell_decision_tooltip: "Make offerings to Kanaloa for waves"
 hee_nalu_bless_the_swell_decision_desc: "Ti leaves, a woven lei, and the first fish of the season, carried out past the break and given to the water. Kanaloa is not bought. But Kanaloa notices."
 hee_nalu_bless_the_swell_decision_confirm: "Make the offering"
 hee_nalu_bless_the_swell_decision_effect_tt: "For 3 years the wave sense comes more easily on a Surf Trip"
 hee_nalu_blessed_swell_modifier: "Blessed the Swell"
 hee_nalu_blessed_swell_modifier_desc: "This character has made offerings to Kanaloa, and the sea has been kind since."
 hee_nalu_blessed_swell_county_modifier: "The Swell Is Blessed"
 hee_nalu_blessed_swell_county_modifier_desc: "The ruler made offerings for waves here, and the people saw it."
 hee_nalu_aumakua_mano_modifier: "'Aumakua: Manō, the Shark"
 hee_nalu_aumakua_mano_modifier_desc: "The shark watches over this house. Its members do not flinch."
 hee_nalu_aumakua_honu_modifier: "'Aumakua: Honu, the Turtle"
 hee_nalu_aumakua_honu_modifier_desc: "The sea turtle watches over this house. Its members endure."
 hee_nalu_aumakua_pueo_modifier: "'Aumakua: Pueo, the Owl"
 hee_nalu_aumakua_pueo_modifier_desc: "The owl watches over this house. Its members see what others miss."
 hee_nalu_aumakua_io_modifier: "'Aumakua: 'Io, the Hawk"
 hee_nalu_aumakua_io_modifier_desc: "The hawk watches over this house. Its members look down on the field before they strike."
 hee_nalu_tide_of_war_modifier: "The Tide Is With Us"
 hee_nalu_tide_of_war_modifier_desc: "The kahuna read the swell and said: now."
 hee_nalu_localism_modifier: "Locals Only"
 hee_nalu_localism_modifier_desc: "Strangers have learned to ask before they paddle out at this character's break."
 hee_nalu_aloha_county_modifier: "Aloha in the Lineup"
 hee_nalu_aloha_county_modifier_desc: "Strangers were made welcome in the water here, and word of it has travelled."

 hee_nalu.0200.t: "The Paddle-Out"
 hee_nalu.0200.desc: "They have brought [deceased.GetFirstName]'s ashes down to the water in a gourd wrapped in ti leaves.\n\nThe whole shore is here, each with a board and a lei. We paddle out past the break together and form a circle, hands joined across the gaps, rising and falling on the swell [deceased.GetSheHe] spent a lifetime reading. Someone begins a chant. The flowers are already drifting.\n\nThey are waiting for me to open the gourd."
 hee_nalu.0200.a: "I scatter the ashes, and we all strike the water and shout [deceased.GetHerHis] name."
 hee_nalu.0200.b: "Then I turn and catch the next wave in, the way [deceased.GetSheHe] would have."
 hee_nalu.0200.c: "The kahuna knows the words better than I do. Let him see to it."

 hee_nalu.0210.t: "The 'Aumakua"
 hee_nalu.0210.desc: "The kahuna has fasted three days. Tonight he will name the ancestor who watches over my house, and he has made it plain that the ancestor has already chosen. I am only here to listen.\n\nStill, he looks at me a long time across the fire before he speaks, as if to see which name I am ready to hear."
 hee_nalu.0210.a: "Manō. The shark that swims beside our canoes."
 hee_nalu.0210.a.tt: "On a Surf Trip, the shark is far more likely to be a guardian"
 hee_nalu.0210.b: "Honu. The turtle that always finds its way home."
 hee_nalu.0210.c: "Pueo. The owl that leads the lost out of the dark."
 hee_nalu.0210.d: "'Io. The hawk that belongs to chiefs."

 hee_nalu.0301.t: "The Kahuna Reads the Swell"
 hee_nalu.0301.desc: "My captains want orders. My kahuna wants me to come down to the beach.\n\nHe stands ankle deep for a long time, watching the sets, and when he turns round he is certain. \"The sea is pushing. Three days of rising swell, then it turns. What you begin on a rising sea, you finish.\""
 hee_nalu.0301.a: "Then we strike while the tide is with us."
 hee_nalu.0301.b: "And if it turns first? We wait for a better sea."
 hee_nalu.0301.c: "Wars are not won by staring at seaweed."

 hee_nalu.0302.t: "First Wave"
 hee_nalu.0302.desc: "[surf_child.GetFirstName] has been dragging a board twice [surf_child.GetHerHis] own length up and down the beach for a week, and today [surf_child.GetSheHe] finally asks. Not whether. When.\n\nThe waves on the inside are small and soft this morning. I remember who pushed me into my first one."
 hee_nalu.0302.a: "\"Lie flat. When I say paddle, paddle. PADDLE!\""
 hee_nalu.0302.b: "The kahuna taught me. He can teach [surf_child.GetFirstName]."
 hee_nalu.0302.c: "Not yet. The sea will still be there next year."

 hee_nalu.0303.t: "The Broken Board"
 hee_nalu.0303.desc: "It was not even a big wave. I heard the crack before I felt it, and came up holding half of the board I have ridden for eleven years. The other half washed in a little later, as if embarrassed."
 hee_nalu.0303.a: "A good shaper can have a new one ready in a month."
 hee_nalu.0303.b: "I will mend it myself. It knows my feet."
 hee_nalu.0303.c: "Boards do not break for no reason. Something is being said."

 hee_nalu.0304.t: "Strangers in the Lineup"
 hee_nalu.0304.desc: "A boatload of outlanders has found our break. They paddle for everything, sit too deep, and one of them has already run over a child. My people are looking at me. On land I would know exactly what to do."
 hee_nalu.0304.a: "\"There are waves enough. Show them how it is done here.\""
 hee_nalu.0304.b: "\"This is our water. Send them back to their boat.\""

 hee_nalu.0305.t: "The Flat Spell"
 hee_nalu.0305.desc: "Nineteen days without a wave. The sea lies there like a pond, lapping politely at the sand. The young ones have stopped looking at it. I have started dreaming about it."
 hee_nalu.0305.a: "Offerings at the heiau. Kanaloa is waiting to be asked."
 hee_nalu.0305.b: "I paddle out anyway and back, every dawn, for the arms."
 hee_nalu.0305.c: "I sit on the wall and stare at the horizon."

 hee_nalu.0306.t: "The Wanderer"
 hee_nalu.0306.desc: "[wanderer.GetFirstName] came ashore from a trading boat with one bag and one board, asked the locals where it breaks best on this tide, and was out in the water before the boat had finished unloading.\n\nBy evening half my court was on the beach watching. [wanderer.GetSheHe|U] has surfed breaks I know only from chants, and says the best wave [wanderer.GetSheHe] ever rode is always the next one."
 hee_nalu.0306.a: "\"Stay. My court could use someone who reads the water.\""
 hee_nalu.0306.b: "We share the dawn session, and then [wanderer.GetSheHe] is gone."

 # Makahiki, the surf heiau, and boards (2026-11-16)
 hee_nalu_proclaim_makahiki_decision: "Proclaim Makahiki"
 hee_nalu_proclaim_makahiki_decision_tooltip: "Open the season of Lono: four months of peace and games"
 hee_nalu_proclaim_makahiki_decision_desc: "When the Pleiades rise at sunset the image of Lono is carried round the island, war is put under kapu, and the people play. Four months of feasting, wrestling, sledding and surfing, and nobody may raise a spear."
 hee_nalu_proclaim_makahiki_decision_confirm: "Raise Lono's banner"
 hee_nalu_proclaim_makahiki_decision_effect_tt: "The season lasts 120 days. The games begin in two weeks.\nIf you are at peace when Lono departs you are rewarded; if you are at war, the kapu is broken and you lose [piety|E]."
 hee_nalu_makahiki_modifier: "Makahiki"
 hee_nalu_makahiki_modifier_desc: "The season of Lono. War is under kapu and the people are at their games."
 hee_nalu_lonos_peace_modifier: "Lono's Peace"
 hee_nalu_lonos_peace_modifier_desc: "This character kept the Makahiki peace, and Lono has left the land fat behind him."
 hee_nalu.0400.t: "The Games of Lono"
 hee_nalu.0400.desc: "The whole district has come down to the shore. There are boxers oiling their arms, old men bent over the kōnane board, children racing sleds down the grass, and beyond them all the contest everyone is really waiting for: the surf is up, and the judges are already arguing.\n\nA ruler may simply preside. A ruler may also be expected to show what they are made of."
 hee_nalu.0400.a: "I take my board down to the water."
 hee_nalu.0400.b: "I step into the mokomoko ring."
 hee_nalu.0400.c: "I sit down at the kōnane board."
 hee_nalu.0400.d: "I preside, and give the prizes with my own hands."
 hee_nalu.0400.win.tt: "You win, and they will not let you forget it"
 hee_nalu.0400.lose.tt: "You lose, cheerfully"
 hee_nalu.0403.t: "Lono Departs"
 hee_nalu.0403.desc.kept: "The last night of the season. The image of Lono is set in a canoe piled with offerings and pushed out past the reef to sail back to Kahiki.\n\nFour months without a spear raised anywhere in my lands. The storehouses are full, the old quarrels have gone quiet, and tomorrow the ordinary year begins again."
 hee_nalu.0403.desc.broken: "The last night of the season. The image of Lono is set in a canoe and pushed out past the reef, and nobody on the beach will look at me.\n\nThere is war in my lands. Whoever began it, the kapu was mine to keep."
 hee_nalu.0403.a: "Until the Pleiades rise again."
 hee_nalu.0403.b: "Lono will remember this. So will they."

 building_type_hee_nalu_surf_heiau_01: "Surf Heiau"
 building_type_hee_nalu_surf_heiau_01_desc: "A terraced platform of black lava rock at the water's edge, with a stone-lined pool to rinse the salt off afterwards. Here the kahuna watch the horizon and the faithful pray for swell before they paddle out."
 building_hee_nalu_surf_heiau_01: "$building_type_hee_nalu_surf_heiau_01$"
 building_hee_nalu_surf_heiau_01_desc: "$building_type_hee_nalu_surf_heiau_01_desc$"
 hee_nalu.reward.heiau.tt: "#P A surf heiau stands here#!"

 hee_nalu_shape_board_decision: "Commission a Board"
 hee_nalu_shape_board_decision_tooltip: "Have a master shaper make you a board"
 hee_nalu_shape_board_decision_desc: "A shaper will walk the forest for days before choosing the tree. Koa for the long boards, wiliwili for the light ones. Offerings are made at the stump. The rest is adze, coral and patience."
 hee_nalu_shape_board_decision_confirm: "Send for the shaper"
 hee_nalu_shape_board_decision_effect_tt: "You receive a board as an [artifact|E]. A Waterman, Waterwoman or Big Kahuna is given an olo, the great board of chiefs. Others receive an alaia."
 hee_nalu_shape_board_surfer_trigger: "You surf (Grom or better, or a Kook)"
 artifact_hee_nalu_alaia_name: "Koa Alaia"
 artifact_hee_nalu_alaia_desc: "A thin, finless board of koa wood, shaped by adze and finished with coral and kukui oil. It rewards a light foot."
 artifact_hee_nalu_olo_name: "Olo of Wiliwili"
 artifact_hee_nalu_olo_desc: "A great board of wiliwili wood, three times the height of its rider. In the old islands only chiefs might ride an olo."
 artifact_hee_nalu_kai_olo_name: "The Olo of the Ali'i"
 artifact_hee_nalu_kai_olo_desc: "The surfboard of the old chiefs of O'ahu, black with age and oil, handed down the ruling line of Hawaii. It is said to have ridden Pipeline before the collapse."
 hee_nalu_alaia_artifact_modifier: "Koa Alaia"
 hee_nalu_olo_artifact_modifier: "Olo of Wiliwili"
 hee_nalu_kai_olo_artifact_modifier: "The Olo of the Ali'i"
