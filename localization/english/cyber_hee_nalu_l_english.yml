l_english:
 # He'e Nalu (2026-11-15): the surfers' religion. Design: _dev/HEE_NALU.md
 # Encoding rule: kahakō vowels (ā ē ī ō ū) are allowed; the 'okina is written as a straight apostrophe.
 hee_nalu_religion: "He'e Nalu"
 hee_nalu_religion_adj: "He'e Nalu"
 hee_nalu_religion_adherent: "Wave Rider"
 hee_nalu_religion_adherent_plural: "Wave Riders"
 hee_nalu_religion_desc: "He'e nalu, wave sliding, is far older than the collapse. When the old order fell, the watermen and waterwomen of Hawaii and the California coast kept the one thing the sea had never taken from them: the knowledge of how to read it. To them the ocean is alive and speaks to those who are quiet enough to listen."
 hee_nalu_faith: "He'e Nalu"
 hee_nalu_faith_name: "He'e Nalu"
 hee_nalu_faith_adj: "He'e Nalu"
 hee_nalu_faith_adherent: "Wave Rider"
 hee_nalu_faith_adherent_plural: "Wave Riders"
 hee_nalu_faith_desc: "The faithful of He'e Nalu seek to become one with the ocean. A true waterman does not watch the horizon for the next set. He feels it coming through the water, knows where the perfect wave will break before it rises, and is already there when it does. They honor Kanaloa and the akua of old Hawaii, gather at the surf heiau to pray for swell, and scatter the ashes of their dead beyond the break."
 hee_nalu_rite: "He'e Nalu"
 hee_nalu_rite_name: "He'e Nalu"
 hee_nalu_rite_adj: "He'e Nalu"
 hee_nalu_rite_adherent: "Wave Rider"
 hee_nalu_rite_adherent_plural: "Wave Riders"
 hee_nalu_rite_desc: "The rite of the He'e Nalu faith."

 tenet_hee_nalu_name: "He'e Nalu"
 tenet_hee_nalu_desc: "To slide on a wave is to pray. Those who give themselves to the ocean learn to sense it without looking: the pulse of a distant swell, the pause before a set, the place where the perfect wave will break. The sea carries them, calms them, and now and then humbles them."
 doctrine_parameter_hee_nalu_surfing_active: "Can go on a #V Surf Trip#! [activity|E] to any coastal [barony|E]"

