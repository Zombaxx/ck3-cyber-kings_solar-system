 hee_nalu.0001.t: "Dawn Patrol"
 hee_nalu.0001.desc: "The sky is still grey when I reach the sand, board under my arm. The air smells of salt and wet kelp, and somewhere out in the half-light the ocean is breathing: a long hiss, a pause, then the crack of a wave folding over the reef.\n\nLines of swell are marching in from the horizon. On the inside the waves are clean and shoulder high. Far out, over the outer reef, something much bigger is feathering white against the dawn.\n\nNobody rules out there. Not even me."
 hee_nalu.0001.desc.sacred: "[surf_break.GetName]. Every wave rider knows the name. The chants say the akua themselves shaped this break, and that the ocean listens more closely here than anywhere else.\n\n"
 hee_nalu.0001.desc.home: "[surf_break.GetName]: home water. I know every rock of this beach, and the people on it know me.\n\n"
 hee_nalu.0001.desc.foreign: "[surf_break.GetName] is a long way from my own hall. Here I am nobody's ruler, only a stranger with a board, and the locals are watching to see what I am worth.\n\n"
 hee_nalu.0001.a: "First I sit at the water's edge, close my eyes, and listen."
 hee_nalu.0001.a.tt: "You try to sense what the ocean is about to do"
 hee_nalu.0001.b: "Enough looking. I paddle straight out to the lineup."
 hee_nalu.0001.b.tt: "You join the lineup at the main break"
 hee_nalu.0001.c: "The outer reef is breaking. That is where I am going."
 hee_nalu.0001.c.tt: "You paddle for the giants at the outer reef. This is dangerous."
 hee_nalu.0001.d: "Today I will only watch. That is a kind of prayer too."

 hee_nalu.0002.t: "The Ocean Speaks"
 hee_nalu.0002.desc.intro: "I sit where the foam slides up the sand and reaches my feet. I let my breath fall in with the sets: in as the water draws back, out as it comes.\n\n"
 hee_nalu.0002.desc.felt: "Then it is there. Not a sound and not a sight, more like a hand pressing gently on my chest from far away. Three waves are coming, and the third is the one. I know where it will stand up and where it will break as surely as I know my own name. On the horizon there is nothing to see yet.\n\n[ROOT.Char.GetFaith.HighGodName] has spoken."
 hee_nalu.0002.desc.nothing: "I wait. A gull complains. My leg goes numb. The water is only water this morning, and whatever the ocean is saying, it is not saying it to me."
 hee_nalu.0002.a: "I paddle to the exact spot and wait for it."
 hee_nalu.0002.b: "That pull is coming from the outer reef. So be it."
 hee_nalu.0002.c: "Then I will find my waves the ordinary way, with my eyes."
 hee_nalu.0002.d: "The ocean keeps its counsel. Not today."

 hee_nalu.0010.t: "The Lineup"
 hee_nalu.0010.desc.intro: "I sit on my board beyond the break, rising and falling with the swell. The horizon darkens. A set is coming, and the first wave of it is a beauty, a long clean wall already bending toward the reef.\n\n"
 hee_nalu.0010.desc.companion: "[surf_companion.GetFirstName] has seen it too. [surf_companion.GetSheHe|U] is deeper than I am, already turning [surf_companion.GetHerHis] board and paddling hard. By the old rule of the water the wave is [surf_companion.GetHersHis]. But I am the one who brought [surf_companion.GetHerHim] here."
 hee_nalu.0010.desc.local: "A young local has seen it too. The kid is deeper than I am, already turning and paddling hard. By the old rule of the water the wave is theirs. But rulers are not used to waiting their turn."
 hee_nalu.0010.a: "Mine. I drop in."
 hee_nalu.0010.b: "\"Go, go, go! It is yours!\""
 hee_nalu.0010.c: "I let it pass. The one I want is still out there."

 hee_nalu.0011.t: "A Good Session"
 hee_nalu.0011.desc: "No legends were made today. There were only waves, one after another, each a little different from the last: a fast one that closed out, a slow fat one I rode nearly to the sand, one I shared with a sea turtle that could not have cared less about my rank.\n\nWhen I finally walk up the beach my arms are like wet rope and the sun is high. I cannot stop smiling, and I cannot remember what I was worried about yesterday."
 hee_nalu.0011.a: "Stoked."
 hee_nalu.0011.b: "I build a fire with [surf_companion.GetFirstName] and we talk story until dark."

 hee_nalu.0020.t: "The Outer Reef"
 hee_nalu.0020.desc.intro: "It takes a long time to paddle this far, and with every stroke the sound grows. Out here the waves do not crash. They detonate.\n\nA set rises from the deep water, and for a moment the horizon is simply gone. A hill of dark green glass, tall as a temple, is moving toward me with the wind tearing spray from its crest.\n\n"
 hee_nalu.0020.desc.attuned: "And yet I am calm. I felt this wave on the beach, before it had a shape. I know which one is mine, and it is not the first."
 hee_nalu.0020.desc.blind: "My mouth is dry. There is no reading this. There is only choosing."
 hee_nalu.0020.a: "I turn and paddle. No hesitation."
 hee_nalu.0020.b: "Not this one. I wait for the wave I felt."
 hee_nalu.0020.c: "This is beyond me. I paddle back to the inside."

 hee_nalu.0021.t: "The Drop"
 hee_nalu.0021.desc: "The wave lifts me and the reef falls away below. For one heartbeat I am standing at the top of a cliff made of water, looking down.\n\nThen I am falling and flying at once, the board chattering under my feet, the whole weight of the Pacific rearing up behind my shoulder. I lean, the rail bites, and I am racing along a wall of moving glass with a roar in my ears like the end of the world.\n\nFrom the shore they will have seen it. They will be telling this one to their grandchildren."
 hee_nalu.0021.a: "I ride it out with my arms wide open."
 hee_nalu.0021.b: "It is starting to throw. I pull up into the barrel."

 hee_nalu.0022.t: "Held Down"
 hee_nalu.0022.desc: "The lip catches me between the shoulders and the world turns white.\n\nI am thrown down and down, tumbled like a rag, the board ripped away. Up and down have no meaning. The reef scrapes past somewhere close. My lungs begin to burn, and above me, muffled and enormous, I hear the next wave arriving.\n\nThe ocean gives. Today the ocean is taking."
 hee_nalu.0022.a: "I fight for the surface with everything I have!"
 hee_nalu.0022.b: "I go limp. The ocean will let me go when it is ready."

 hee_nalu.0023.t: "A Shadow Beneath"
 hee_nalu.0023.desc: "The water goes quiet between sets, and that is when I see it: a long grey shape sliding under my board, unhurried, its fin just creasing the surface a spear's length away.\n\nA shark. A big one.\n\nMy grandmother's people would say there is no cause for fear. Sharks are 'aumākua, the ancestors come back to watch over their own, and many a waterman has been guided home by one. My grandmother's people also had a great many stories that ended otherwise."
 hee_nalu.0023.a: "I turn for shore. Slowly. No splashing."
 hee_nalu.0023.b: "I lay my hand flat on the water. \"Aloha, old one.\""

 hee_nalu.0030.t: "The Perfect Wave"
 hee_nalu.0030.desc: "I am already paddling when it rises, and it rises exactly where I am.\n\nTwo strokes and I am on my feet. The wall stands up ahead of me, smooth and blue and lit from inside by the low sun, and then the crest pitches out over my head and comes down on the far side, and I am inside the wave.\n\nIt is quiet in here. The roar is somewhere else. There is a round window of daylight ahead, water turning slowly overhead like the roof of a heiau, and all the time in the world.\n\nThis is what the old chants mean. This is he'e nalu."
 hee_nalu.0030.a: "I trim high and ride it all the way to the sand."
 hee_nalu.0030.b: "I drag a hand in the wall and stay in the barrel as long as it will have me."
 hee_nalu.0030.c: "There is no board and no rider. There is only the wave."

 # Surf skill traits (2026-11-15 night)
 trait_hee_nalu_surfer: "Surfer"
 trait_hee_nalu_surfer_grom: "Grom"
 trait_hee_nalu_surfer_surfer: "Surfer"
 trait_hee_nalu_surfer_waterman: "Waterman"
 trait_hee_nalu_surfer_waterwoman: "Waterwoman"
 trait_hee_nalu_surfer_kahuna: "Big Kahuna"
 trait_hee_nalu_surfer_desc: "This character rides waves. It begins as a grom, all enthusiasm and swallowed seawater, and with enough years in the lineup may end as one of the few the ocean seems to know by name. Skill is earned only on Surf Trips, a little at a time."
 trait_track_hee_nalu_surfer: "Surf Skill"
 trait_track_hee_nalu_surfer_desc: "Grom, then Surfer (30), then Waterman or Waterwoman (65), then Big Kahuna (100). Each level makes the better outcomes of a Surf Trip more likely."
 trait_hee_nalu_kook: "Kook"
 trait_hee_nalu_kook_desc: "This character surfs, in the sense that a board is involved. Wrong wave, wrong spot, wrong foot forward, and no idea whose turn it is. Real surfers wince. A good session might still turn a kook into a grom."
 hee_nalu.trait.kook_to_grom.toast: "No longer a Kook: something finally clicked out there"
 hee_nalu.trait.dropin_kook.tt: "Dropping in on someone is how a Grom gets called a Kook"

 # Guests' own events (2026-11-15)
 hee_nalu.trait.guest_nothing.tt: "It was a nice day at the beach"
 hee_nalu.outcome.guest_wave.tt: "You catch a wave"
 hee_nalu.outcome.guest_tumble.tt: "The wave catches you"
 hee_nalu.0100.t: "Paddling Out"
 hee_nalu.0100.desc.newcomer: "[host.GetFirstName] is already waist deep, board under one arm, waving me in as if this were the most natural thing in the world.\n\nIt is not. The board I have been lent is longer than I am and slippery as an eel, the water is colder than it looked, and out past the foam the waves are standing up and falling over with a noise like siege engines.\n\n\"You will love it,\" [host.GetSheHe] calls. \"Everybody eats it the first time!\""
 hee_nalu.0100.desc.surfer: "[host.GetFirstName] is already waist deep, grinning back at me over one shoulder. I do not need to be asked twice. The break is working, there is room in the lineup, and for once somebody else did the work of getting us here."
 hee_nalu.0100.desc.kook: "[host.GetFirstName] is already waist deep, waving me in. I notice [host.GetSheHe] has chosen a spot well away from everyone else. I notice the locals noticing me. I have the board the right way up this time, I am fairly sure."
 hee_nalu.0100.a: "I follow [host.GetFirstName] out to the lineup."
 hee_nalu.0100.b: "I will stay in the whitewater and learn to stand up first."
 hee_nalu.0100.c: "Somebody has to watch the towels."
 hee_nalu.0110.t: "A Wave of My Own"
 hee_nalu.0110.desc: "\"This one! Paddle! PADDLE!\"\n\nI paddle. Something enormous and patient picks up the back of the board, the paddling suddenly stops mattering, and I am moving faster than I have ever moved without a horse under me. I get one foot down, then the other. I am standing. I am standing on the sea.\n\nIt lasts perhaps four heartbeats before I fall off sideways, and I come up laughing so hard I swallow half the ocean. [host.GetFirstName] is hooting from the lineup with both arms in the air."
 hee_nalu.0110.a: "Again. Again!"
 hee_nalu.0110.b: "I owe [host.GetFirstName] for this."
 hee_nalu.0111.t: "The Washing Machine"
 hee_nalu.0111.desc: "I do everything I was told. I turn, I paddle, I look over my shoulder, and the wave picks up the tail of the board and drives the nose straight down like a spear.\n\nWhat follows is hard to describe in order. There is a great deal of water, most of it inside my nose. The board hits me once on the way past. When the sea finally lets go I am sitting in knee-deep foam facing the wrong way, and [host.GetFirstName] is trying very hard to look concerned."
 hee_nalu.0111.a: "I spit out the sand, laugh, and paddle back out."
 hee_nalu.0111.b: "Never again. The sea is for ships."

