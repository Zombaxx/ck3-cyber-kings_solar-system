 CK_AMBITION_VENUS_COUNTY_CB_WAR_NAME_BASE:0 "War of Ambition for Venus"
 ck_ambition_venus_duchy_cb:0 "Hegemonic Ambition: Venus (Duchy)"
 ck_ambition_venus_duchy_cb_desc:0 "Your declared ambition to forge Venus justifies seizing this duchy of Venus. The defender loses what it holds of the target."
 CK_AMBITION_VENUS_DUCHY_CB_NAME:0 "Ambition for Venus: [TITLE.GetName]"
 CK_AMBITION_VENUS_DUCHY_CB_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]War of Ambition for Venus"
