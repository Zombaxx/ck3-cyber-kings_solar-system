 ck_ambition.1301.t:0 "An Ambition Stirs: The Outer Moons"
 ck_ambition.1301.desc:0 "Titan beneath Saturn and Triton beneath Neptune are the edge of the inhabited Solar System. Few have ever tried to rule both; fewer still survived the voyage between them.\n\nMy realm now holds enough of Titan and Triton that the old dream no longer seems foolish. My councillors speak of it openly. If I declare it, every court will know - and every rival will prepare."
 ck_ambition.1301.a:0 "Let the heralds proclaim it!"
 ck_ambition.1301.b:0 "Not yet. Let them underestimate us a while longer."
 ck_ambition.1302.t:0 "A Hegemonic Ambition: The Outer Moons"
 ck_ambition.1302.desc:0 "The heralds of the Spacer Guild carry a proclamation along every space lane: [ck_amb_ruler.GetTitledFirstName] means to forge the Outer Moons and rule Titan and Triton from a single throne."
 ck_ambition.1302.a:0 "Bold words. We shall see."
 ck_ambition.1303.t:0 "A Rival Ambition"
 ck_ambition.1303.desc:0 "[ck_amb_ruler.GetTitledFirstName] has proclaimed the very ambition I swore to: to forge the Outer Moons. There can be only one hegemon."
 ck_ambition.1303.a:0 "Then one of us must fall."
 ck_ambition.1304.t:0 "A Rival Ambition"
 ck_ambition.1304.desc:0 "My proclamation had barely left the court when word came back: [ck_amb_rival.GetTitledFirstName] has long since sworn the same oath to forge the Outer Moons."
 ck_ambition.1304.a:0 "Then one of us must fall."
