 ck_ambition.401.t:0 "An Ambition Stirs: Sol"
 ck_ambition.401.desc:0 "One hegemony over one world group is no longer enough. Beyond it lie the other worlds, and beyond them only the Sun itself. No ruler since the First Great Disaster has held the whole Solar System.\n\nMy realm now holds enough of all twelve worlds of the Solar System that the old dream no longer seems foolish. My councillors speak of it openly. If I declare it, every court will know - and every rival will prepare."
 ck_ambition.401.a:0 "Let the heralds proclaim it!"
 ck_ambition.401.b:0 "Not yet. Let them underestimate us a while longer."
 ck_ambition.402.t:0 "A Hegemonic Ambition: Sol"
 ck_ambition.402.desc:0 "The heralds of the Spacer Guild carry a proclamation along every space lane: [ck_amb_ruler.GetTitledFirstName] means to forge Sol and rule all twelve worlds of the Solar System from a single throne."
 ck_ambition.402.a:0 "Bold words. We shall see."
 ck_ambition.403.t:0 "A Rival Ambition"
 ck_ambition.403.desc:0 "[ck_amb_ruler.GetTitledFirstName] has proclaimed the very ambition I swore to: to forge Sol. There can be only one hegemon."
 ck_ambition.403.a:0 "Then one of us must fall."
 ck_ambition.404.t:0 "A Rival Ambition"
 ck_ambition.404.desc:0 "My proclamation had barely left the court when word came back: [ck_amb_rival.GetTitledFirstName] has long since sworn the same oath to forge Sol."
 ck_ambition.404.a:0 "Then one of us must fall."
