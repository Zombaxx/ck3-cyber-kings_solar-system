 ck_ambition.801.t:0 "An Ambition Stirs: Venus"
 ck_ambition.801.desc:0 "Beneath its endless clouds, green Venus is divided among rival thrones. A single Venusian hegemon would command the richest garden of the inner worlds.\n\nMy realm now holds enough of Venus that the old dream no longer seems foolish. My councillors speak of it openly. If I declare it, every court will know - and every rival will prepare."
 ck_ambition.801.a:0 "Let the heralds proclaim it!"
 ck_ambition.801.b:0 "Not yet. Let them underestimate us a while longer."
 ck_ambition.802.t:0 "A Hegemonic Ambition: Venus"
 ck_ambition.802.desc:0 "The heralds of the Spacer Guild carry a proclamation along every space lane: [ck_amb_ruler.GetTitledFirstName] means to forge Venus and rule Venus from a single throne."
 ck_ambition.802.a:0 "Bold words. We shall see."
 ck_ambition.803.t:0 "A Rival Ambition"
 ck_ambition.803.desc:0 "[ck_amb_ruler.GetTitledFirstName] has proclaimed the very ambition I swore to: to forge Venus. There can be only one hegemon."
 ck_ambition.803.a:0 "Then one of us must fall."
 ck_ambition.804.t:0 "A Rival Ambition"
 ck_ambition.804.desc:0 "My proclamation had barely left the court when word came back: [ck_amb_rival.GetTitledFirstName] has long since sworn the same oath to forge Venus."
 ck_ambition.804.a:0 "Then one of us must fall."
 ck_ambition.810.t:0 "Momentum: Venus"
 ck_ambition.810.desc:0 "Three quarters of the way. The other courts of Venus no longer laugh at our proclamation; they count our banners. How shall we carry the ambition forward?"
 ck_ambition.810.a:0 "Proclaim our destiny in every hall and market."
 ck_ambition.810.b:0 "Forge the war machine that will finish this."
 ck_ambition.810.c:0 "Send envoys to calm the other courts."
 ck_ambition.811.t:0 "On the Threshold: Venus"
 ck_ambition.811.desc:0 "Only a few more counties stand between us and Venus. My advisers urge one last push, and the old archives are full of half-forgotten rights waiting to be pressed."
 ck_ambition.811.a:0 "Dig up our ancient rights to a neighbouring land."
 ck_ambition.811.b:0 "This is a triumph of the whole dynasty."
 ck_ambition.811.c:0 "Let the worlds see who leads them."
 ck_ambition.812.t:0 "The Throne Awaits: Venus"
 ck_ambition.812.desc:0 "It is done: enough of Venus answers to us. All that remains is to take the crown of Venus."
 ck_ambition.812.a:0 "Then let it be done."
 ck_ambition.812.tt:0 "The decision Proclaim the Hegemony of Venus is now available."
 ck_ambition.820.t:0 "Ambition Realized: Venus"
 ck_ambition.820.desc:0 "What was a boast in the councils is now law across Venus. The ambition my court laughed at is the crown I wear. Songs will be sung of this in every hab and every hall."
 ck_ambition.820.a:0 "As I said it would be."
 ck_ambition.821.t:0 "Ambition Thwarted: Venus"
 ck_ambition.821.desc:0 "The dream of Venus has slipped through my fingers. My realm no longer holds enough of Venus to pretend otherwise, and the other courts are already mocking the proclamation they once feared."
 ck_ambition.821.a:0 "Another time. Perhaps another ruler."
 ck_ambition.822.t:0 "Ambition Preempted: Venus"
 ck_ambition.822.desc:0 "[ck_amb_winner.GetTitledFirstName] has taken the crown of Venus - the crown I swore would be mine. My ambition dies with that coronation."
 ck_ambition.822.a:0 "Curse them!"
 ck_declare_ambition_mars_decision:0 "Hegemonic Ambition: Mars"
 ck_declare_ambition_mars_decision_desc:0 "Zeus once united Mars, and Mars has never forgotten it. Since his fall the red world has only known anarchy and brief, broken dynasties.\n\nWe are close enough to see it. Proclaim before every court that we mean to forge Mars. Rulers who hold about a third of the counties de jure in Mars may declare this ambition. The hegemony itself is restored by the Restore the Martian Hegemony decision."
