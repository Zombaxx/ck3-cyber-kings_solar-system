 ck_ambition.310.b:0 "Forge the war machine that will finish this."
 ck_ambition.310.c:0 "Send envoys to calm the other courts."
 ck_ambition.311.t:0 "On the Threshold: The Celestial Hegemony"
 ck_ambition.311.desc:0 "Only a few more counties stand between us and the Celestial Hegemony. My advisers urge one last push, and the old archives are full of half-forgotten rights waiting to be pressed."
 ck_ambition.311.a:0 "Dig up our ancient rights to a neighbouring land."
 ck_ambition.311.b:0 "This is a triumph of the whole dynasty."
 ck_ambition.311.c:0 "Let the worlds see who leads them."
 ck_ambition.312.t:0 "The Throne Awaits: The Celestial Hegemony"
 ck_ambition.312.desc:0 "It is done: enough of the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton answers to us. All that remains is to take the crown of the Celestial Hegemony."
 ck_ambition.312.a:0 "Then let it be done."
 ck_ambition.312.tt:0 "The decision to form the Celestial Hegemony is now available."
 ck_ambition.320.t:0 "Ambition Realized: The Celestial Hegemony"
 ck_ambition.320.desc:0 "What was a boast in the councils is now law across the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton. The ambition my court laughed at is the crown I wear. Songs will be sung of this in every hab and every hall."
 ck_ambition.320.a:0 "As I said it would be."
 ck_ambition.321.t:0 "Ambition Thwarted: The Celestial Hegemony"
 ck_ambition.321.desc:0 "The dream of the Celestial Hegemony has slipped through my fingers. My realm no longer holds enough of the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton to pretend otherwise, and the other courts are already mocking the proclamation they once feared."
 ck_ambition.321.a:0 "Another time. Perhaps another ruler."
 ck_ambition.322.t:0 "Ambition Preempted: The Celestial Hegemony"
 ck_ambition.322.desc:0 "[ck_amb_winner.GetTitledFirstName] has taken the crown of the Celestial Hegemony - the crown I swore would be mine. My ambition dies with that coronation."
 ck_ambition.322.a:0 "Curse them!"
 ck_declare_ambition_sol_decision:0 "Hegemonic Ambition: Sol"
 ck_declare_ambition_sol_decision_desc:0 "One hegemony over one world group is no longer enough. Beyond it lie the other worlds, and beyond them only the Sun itself. No ruler since the First Great Disaster has held the whole Solar System.\n\nWe are close enough to see it. Proclaim before every court that we mean to forge Sol. Rulers who rule one mid-level hegemony and hold about a third of a second world group may declare this ambition."
 ck_declare_ambition_sol_decision_tooltip:0 "Proclaim your ambition to forge Sol."
 ck_ambition_sol_modifier:0 "Hegemonic Ambition: Sol"
 ck_ambition_sol_modifier_desc:0 "This ruler has sworn to forge Sol."
