 ck_ambition_outer_moons_duchy_cb:0 "Hegemonic Ambition: The Outer Moons (Duchy)"
 ck_ambition_outer_moons_duchy_cb_desc:0 "Your declared ambition to forge the Outer Moons justifies seizing this duchy of Titan and Triton. The defender loses what it holds of the target."
 CK_AMBITION_OUTER_MOONS_DUCHY_CB_NAME:0 "Ambition for The Outer Moons: [TITLE.GetName]"
