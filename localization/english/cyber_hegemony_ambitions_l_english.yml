 ck_ambition_venus_modifier:0 "Hegemonic Ambition: Venus"
 ck_ambition_venus_modifier_desc:0 "This ruler has sworn to forge Venus."
 ck_ambition_venus_county_cb:0 "Hegemonic Ambition: Venus (County)"
 ck_ambition_venus_county_cb_desc:0 "Your declared ambition to forge Venus justifies seizing this county of Venus. The defender loses what it holds of the target."
 CK_AMBITION_VENUS_COUNTY_CB_NAME:0 "Ambition for Venus: [TITLE.GetName]"
