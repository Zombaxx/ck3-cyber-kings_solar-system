 ck_ambition.1210.t:0 "Momentum: The Galilean Moons"
 ck_ambition.1210.desc:0 "Three quarters of the way. The other courts of Ganymede, Callisto and Europa no longer laugh at our proclamation; they count our banners. How shall we carry the ambition forward?"
 ck_ambition.1210.a:0 "Proclaim our destiny in every hall and market."
 ck_ambition.1210.b:0 "Forge the war machine that will finish this."
 ck_ambition.1210.c:0 "Send envoys to calm the other courts."
 ck_ambition.1211.t:0 "On the Threshold: The Galilean Moons"
 ck_ambition.1211.desc:0 "Only a few more counties stand between us and the Galilean Moons. My advisers urge one last push, and the old archives are full of half-forgotten rights waiting to be pressed."
 ck_ambition.1211.a:0 "Dig up our ancient rights to a neighbouring land."
 ck_ambition.1211.b:0 "This is a triumph of the whole dynasty."
 ck_ambition.1211.c:0 "Let the worlds see who leads them."
 ck_ambition.1212.t:0 "The Throne Awaits: The Galilean Moons"
 ck_ambition.1212.desc:0 "It is done: enough of Ganymede, Callisto and Europa answers to us. All that remains is to take the crown of the Galilean Moons."
 ck_ambition.1212.a:0 "Then let it be done."
 ck_ambition.1212.tt:0 "The decision Proclaim the Hegemony of The Galilean Moons is now available."
 ck_ambition.1220.t:0 "Ambition Realized: The Galilean Moons"
 ck_ambition.1220.desc:0 "What was a boast in the councils is now law across Ganymede, Callisto and Europa. The ambition my court laughed at is the crown I wear. Songs will be sung of this in every hab and every hall."
 ck_ambition.1220.a:0 "As I said it would be."
 ck_ambition.1221.t:0 "Ambition Thwarted: The Galilean Moons"
 ck_ambition.1221.desc:0 "The dream of the Galilean Moons has slipped through my fingers. My realm no longer holds enough of Ganymede, Callisto and Europa to pretend otherwise, and the other courts are already mocking the proclamation they once feared."
 ck_ambition.1221.a:0 "Another time. Perhaps another ruler."
 ck_ambition.1222.t:0 "Ambition Preempted: The Galilean Moons"
 ck_ambition.1222.desc:0 "[ck_amb_winner.GetTitledFirstName] has taken the crown of the Galilean Moons - the crown I swore would be mine. My ambition dies with that coronation."
 ck_ambition.1222.a:0 "Curse them!"
 ck_declare_ambition_outer_moons_decision:0 "Hegemonic Ambition: The Outer Moons"
 ck_declare_ambition_outer_moons_decision_desc:0 "Titan beneath Saturn and Triton beneath Neptune are the edge of the inhabited Solar System. Few have ever tried to rule both; fewer still survived the voyage between them.\n\nWe are close enough to see it. Proclaim before every court that we mean to forge the Outer Moons. Rulers who hold about a third of the counties de jure in the Outer Moons may declare this ambition. Declaring it opens the way to proclaim the hegemony at half of its counties."
 ck_declare_ambition_outer_moons_decision_tooltip:0 "Proclaim your ambition to forge the Outer Moons."
 ck_ambition_outer_moons_modifier:0 "Hegemonic Ambition: The Outer Moons"
 ck_ambition_outer_moons_modifier_desc:0 "This ruler has sworn to forge the Outer Moons."
 ck_ambition_outer_moons_county_cb:0 "Hegemonic Ambition: The Outer Moons (County)"
 ck_ambition_outer_moons_county_cb_desc:0 "Your declared ambition to forge the Outer Moons justifies seizing this county of Titan and Triton. The defender loses what it holds of the target."
 CK_AMBITION_OUTER_MOONS_COUNTY_CB_NAME:0 "Ambition for The Outer Moons: [TITLE.GetName]"
