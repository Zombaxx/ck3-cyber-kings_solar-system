 ck_abandon_hegemonic_ambition_decision:0 "Abandon Hegemonic Ambition"
 ck_abandon_hegemonic_ambition_decision_desc:0 "Some thrones are not meant to be. Let the heralds fall silent and the other courts breathe easier - at a cost to our name."
 ck_abandon_hegemonic_ambition_decision_tooltip:0 "Give up your declared Hegemonic Ambition."
 ck_declare_ambition_terra_decision:0 "Hegemonic Ambition: Terra"
 ck_declare_ambition_terra_decision_desc:0 "Earth, the cradle of humanity, has not answered to a single throne since before the Spacers came home. Its councils, its old republics and its new kings all remember what a united Earth could do.\n\nWe are close enough to see it. Proclaim before every court that we mean to forge Terra. Rulers who hold about a third of the counties on Earth may declare this ambition. A ruler who already holds a world hegemony among these worlds needs only a fifth of them."
 ck_declare_ambition_terra_decision_tooltip:0 "Proclaim your ambition to forge Terra."
 ck_ambition_terra_modifier:0 "Hegemonic Ambition: Terra"
 ck_ambition_terra_modifier_desc:0 "This ruler has sworn to forge Terra."
 ck_ambition_terra_county_cb:0 "Hegemonic Ambition: Terra (County)"
 ck_ambition_terra_county_cb_desc:0 "Your declared ambition to forge Terra justifies seizing this county of Earth. The defender loses what it holds of the target."
 CK_AMBITION_TERRA_COUNTY_CB_NAME:0 "Ambition for Terra: [TITLE.GetName]"
 CK_AMBITION_TERRA_COUNTY_CB_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]War of Ambition for Terra"
 CK_AMBITION_TERRA_COUNTY_CB_WAR_NAME_BASE:0 "War of Ambition for Terra"
 ck_ambition_terra_duchy_cb:0 "Hegemonic Ambition: Terra (Duchy)"
 ck_ambition_terra_duchy_cb_desc:0 "Your declared ambition to forge Terra justifies seizing this duchy of Earth. The defender loses what it holds of the target."
 CK_AMBITION_TERRA_DUCHY_CB_NAME:0 "Ambition for Terra: [TITLE.GetName]"
 CK_AMBITION_TERRA_DUCHY_CB_WAR_NAME:0 "[ConcatIfNeitherEmpty('$ORDER|q$', ' ')]War of Ambition for Terra"
 CK_AMBITION_TERRA_DUCHY_CB_WAR_NAME_BASE:0 "War of Ambition for Terra"
 ck_ambition.101.t:0 "An Ambition Stirs: Terra"
 ck_ambition.101.desc:0 "Earth, the cradle of humanity, has not answered to a single throne since before the Spacers came home. Its councils, its old republics and its new kings all remember what a united Earth could do.\n\nMy realm now holds enough of Earth that the old dream no longer seems foolish. My councillors speak of it openly. If I declare it, every court will know - and every rival will prepare."
 ck_ambition.101.a:0 "Let the heralds proclaim it!"
 ck_ambition.101.b:0 "Not yet. Let them underestimate us a while longer."
 ck_ambition.102.t:0 "A Hegemonic Ambition: Terra"
 ck_ambition.102.desc:0 "The heralds of the Spacer Guild carry a proclamation along every space lane: [ck_amb_ruler.GetTitledFirstName] means to forge Terra and rule Earth from a single throne."
 ck_ambition.102.a:0 "Bold words. We shall see."
 ck_ambition.103.t:0 "A Rival Ambition"
 ck_ambition.103.desc:0 "[ck_amb_ruler.GetTitledFirstName] has proclaimed the very ambition I swore to: to forge Terra. There can be only one hegemon."
 ck_ambition.103.a:0 "Then one of us must fall."
 ck_ambition.104.t:0 "A Rival Ambition"
 ck_ambition.104.desc:0 "My proclamation had barely left the court when word came back: [ck_amb_rival.GetTitledFirstName] has long since sworn the same oath to forge Terra."
 ck_ambition.104.a:0 "Then one of us must fall."
 ck_ambition.110.t:0 "Momentum: Terra"
 ck_ambition.110.desc:0 "Three quarters of the way. The other courts of Earth no longer laugh at our proclamation; they count our banners. How shall we carry the ambition forward?"
 ck_ambition.110.a:0 "Proclaim our destiny in every hall and market."
 ck_ambition.110.b:0 "Forge the war machine that will finish this."
 ck_ambition.110.c:0 "Send envoys to calm the other courts."
 ck_ambition.111.t:0 "On the Threshold: Terra"
 ck_ambition.111.desc:0 "Only a few more counties stand between us and Terra. My advisers urge one last push, and the old archives are full of half-forgotten rights waiting to be pressed."
 ck_ambition.111.a:0 "Dig up our ancient rights to a neighbouring land."
 ck_ambition.111.b:0 "This is a triumph of the whole dynasty."
 ck_ambition.111.c:0 "Let the worlds see who leads them."
 ck_ambition.112.t:0 "The Throne Awaits: Terra"
 ck_ambition.112.desc:0 "It is done: enough of Earth answers to us. All that remains is to take the crown of Terra."
 ck_ambition.112.a:0 "Then let it be done."
 ck_ambition.112.tt:0 "The decision to form Terra is now available."
 ck_ambition.120.t:0 "Ambition Realized: Terra"
 ck_ambition.120.desc:0 "What was a boast in the councils is now law across Earth. The ambition my court laughed at is the crown I wear. Songs will be sung of this in every hab and every hall."
 ck_ambition.120.a:0 "As I said it would be."
 ck_ambition.121.t:0 "Ambition Thwarted: Terra"
 ck_ambition.121.desc:0 "The dream of Terra has slipped through my fingers. My realm no longer holds enough of Earth to pretend otherwise, and the other courts are already mocking the proclamation they once feared."
 ck_ambition.121.a:0 "Another time. Perhaps another ruler."
 ck_ambition.122.t:0 "Ambition Preempted: Terra"
 ck_ambition.122.desc:0 "[ck_amb_winner.GetTitledFirstName] has taken the crown of Terra - the crown I swore would be mine. My ambition dies with that coronation."
 ck_ambition.122.a:0 "Curse them!"
 ck_declare_ambition_helian_decision:0 "Hegemonic Ambition: The Helian Hegemony"
 ck_declare_ambition_helian_decision_desc:0 "The sunward worlds - scorched Mercury, the green seas of Venus, the red highlands of Mars - have always been ruled from many thrones. Whoever binds them together holds the hottest, richest and most stubborn heart of the Solar System.\n\nWe are close enough to see it. Proclaim before every court that we mean to forge the Helian Hegemony. Rulers who hold about a third of the counties on Mercury, Venus and Mars may declare this ambition. A ruler who already holds a world hegemony among these worlds needs only a fifth of them."
 ck_declare_ambition_helian_decision_tooltip:0 "Proclaim your ambition to forge the Helian Hegemony."
