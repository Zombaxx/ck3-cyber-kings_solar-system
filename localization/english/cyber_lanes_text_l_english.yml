l_english:
 # Cyber Kings (2026-11-12): the two versions of each sea-travel text. ck_lane.* = space lane, ck_sea.* = vanilla 1.20 copy.
 ck_lane.travel_danger_events.4010.desc_sea: "As our ship follows the space lane towards [destination.GetNameNoTooltip], the clean, cold air of the hold is doing wonders for at least #EMP my#! health and well-being. However, we are not all so lucky.\n\nI have noticed how [ill_character.GetTitledFirstName] has been deteriorating over the past few days, and now there is no doubt that [ill_character.GetSheHe] has contracted an illness of some kind."
 ck_sea.travel_danger_events.4010.desc_sea: "As we sail towards [destination.GetNameNoTooltip], the fresh sea air is doing wonders for at least #EMP my#! health and well-being. However, we are not all so lucky.\n\nI have noticed how [ill_character.GetTitledFirstName] has been deteriorating over the past few days, and now there is no doubt that [ill_character.GetSheHe] has contracted an illness of some kind."
 ck_lane.travel_danger_events.4010.desc_sea_again: "We make good progress along the lane towards [destination.GetNameNoTooltip], which I find very invigorating. It would however seem as if my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))], [ill_character.GetTitledFirstName], is experiencing the opposite.\n\nThis morning I found [ill_character.GetHerHim] leaning heavily on the railing of the observation deck with a rasping cough, and clearly [ill_character.GetSheHe] also seems to have contracted something. Is this a plague?"
 ck_sea.travel_danger_events.4010.desc_sea_again: "We make good progress towards [destination.GetNameNoTooltip], which I find very invigorating. It would however seem as if my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('ill_character'))], [ill_character.GetTitledFirstName], is experiencing the opposite.\n\nThis morning I found [ill_character.GetHerHim] — leaning heavily on the railing with a rasping cough — and clearly [ill_character.GetSheHe] also seems to have contracted something. Is this a plague?"
 ck_lane.travel_danger_events.4010.a_sea: "Put in at the nearest Spacer Guild station so that [ill_character.GetFirstNameNoTooltip] may rest and recover fully."
 ck_sea.travel_danger_events.4010.a_sea: "Find a port so that [ill_character.GetFirstNameNoTooltip] may rest and recover fully."
 ck_lane.travel_danger_events.7000.f_sea: "Put [snake_victim.GetHerHim] out the airlock!"
 ck_sea.travel_danger_events.7000.f_sea: "Let the tide take [snake_victim.GetHerHim]!"
 ck_lane.travel_events.4003.desc.intro: "The lane is thick with drifting ice and stone, shards of light materializing and vanishing in the blink of an eye. A monstrous silhouette appears against the stars, and all seems calm until it slides out of the glittering haze into plain view.\n\n"
 ck_sea.travel_events.4003.desc.intro: "The seas are thick with mist, rocks and waves materializing and vanishing in the blink of an eye. A monstrous silhouette appears on the horizon, and all seems calm until the great beast peaks out of the fog into plain view.\n\n"
 ck_lane.travel_events.4003.desc.viking: "A raider's ship painted with a dragon's head closes on our vessel, its crew of Reaver pirates jeering from the open boarding hatch!"
 ck_sea.travel_events.4003.desc.viking: "The head of a dragon approaches our vessel, with a ferocious crew of northmen jeering on its back!"
 ck_lane.travel_events.4003.desc.berber_pirate: "A great ship heavy with plunder emerges from the dark beyond the lane, with a crew of space pirates brandishing their blades, ready to board!"
 ck_sea.travel_events.4003.desc.berber_pirate: "A great ship heavy with plunder emerges on the horizon, with a crew of Barbary pirates brandishing their blades, ready to attack!"
 ck_lane.travel_events.4003.desc.regular_pirate: "A battered ship filled to the brim with ragged brigands and thieves closes on us, their toothless grins eager to lay their grimy fingers on our riches."
 ck_sea.travel_events.4003.desc.regular_pirate: "A ship filled to the brim with ragged brigands and thieves approaches us, their toothless grins eager to lay their salty fingers on our riches."
 ck_lane.travel_events.4003.c: "Attempt to lose them in the drifting ice!"
 ck_sea.travel_events.4003.c: "Attempt to lose them in the fog!"
 ck_lane.travel_events.4005.desc: "The lane around here is busy with [merchant_character_scope.GetCulture.GetName] traders going about their usual craft, carrying rare and exotic goods from one world to another.\n\nOne such merchant ship holds an item within it that immediately takes my interest. The moment I lay eyes upon the [merchant_artifact_scope.GetName], I know I could never find anything like it back in [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] and it simply must be mine."
 ck_sea.travel_events.4005.desc: "The seas around here are thick with [merchant_character_scope.GetCulture.GetName] traders going about their usual craft, carrying rare and exotic goods from one port to another.\n\nOne such merchant ship holds an item within it that immediately takes my interest. The moment I lay eyes upon the [merchant_artifact_scope.GetName], I know I could never find anything like it back in [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] and it simply must be mine."
 ck_lane.travel_events.4006.desc: "I am stirred from my relaxing crossing of the space lane by a sudden shriek! I sprint into the stores below deck and am horrified to find a [ROOT.Char.Custom('GetRandomMigratoryBird')], escaped from some passenger's cage, beside the shredded remains of our supplies, its feathers stretched thin against its foul bloated belly.\n\nIn my rage, I could have killed the repugnant winged menace right there, but I am stopped by [superstituous_caravan_member.GetName].\n\n"Hark! Stay your hand, you [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstituous_caravan_member'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstituous_caravan_member'))]! Don't you know it's bad luck to kill a bird between the worlds?""
 ck_sea.travel_events.4006.desc: "I am stirred from my relaxing trip across the great blue sea by a sudden shriek! I sprint into the stores below deck and am horrified to find a [ROOT.Char.Custom('GetRandomMigratoryBird')] beside the shredded remains of our supplies, its feathers stretched thin against its foul bloated belly.\n\nIn my rage, I could have killed the repugnant winged menace right there, but I am stopped by [superstituous_caravan_member.GetName].\n\n"Hark! Stay your hand, you [ROOT.Char.Custom2('InsultAdjective', SCOPE.sC('superstituous_caravan_member'))] [ROOT.Char.Custom2('InsultNoun', SCOPE.sC('superstituous_caravan_member'))]! Don't you know it's bad luck to kill a bird at sea?""
 ck_lane.travel_events.4008.desc: "The lane is calm and forgiving today, its aurora steady and the drive humming at our back. It seems it'll be an easy day for the crew below, but then I spot the mangled hulk of a ship buried nose-first into a tumbling rock just ahead.\n\nThere doesn't appear to be any survivors, and the rock would be no trivial thing to approach, yet I feel compelled to go and investigate this mysterious wreck."
 ck_sea.travel_events.4008.desc: "The sea is calm and forgiving today, still as a boulder and a powerful wind at our back to boot. It seems it'll be an easy day for the rowers below, but then I spot the mangled corpse of a ship buried nose-first into some jagged rocks just ahead.\n\nThere doesn't appear to be any survivors, and the rocks would be no trivial thing to navigate, yet I feel compelled to go and investigate this mysterious wreck."
 ck_lane.travel_events.1208.desc: "While crossing [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], we come alongside a small Spacer Guild tender to trade news. What is meant to be a quick stop ends up being a long discussion about hull seals, the drift of the lanes and general spacefaring.\n\n"Well you see, the old ships are the queens of all the lanes, and to scuttle one, well. That is the greatest of all crimes.""
 ck_sea.travel_events.1208.desc: "While sailing through [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], we drop anchor to talk to a boat full of locals. What is meant to be a quick stop ends up being a long discussion about knots, local currents and general seafaring.\n\n"Well you see the albatross is the king of all birds, and to kill it well. That is the greatest of all crimes.""
 ck_lane.harm.0521.desc.sea: "I always appreciate the view from the deck as we cross a space lane. Even on a rough day like today, with the ship shuddering through the lane's eddies, it's got a stark beauty to it, a sense of fragility, of—"
 ck_sea.harm.0521.desc.sea: "I always appreciate finding myself at sea. Even on a squall-tossed day like today, it's got a stark beauty to it, a sense of fragility, of—"
 ck_lane.harm.0521.desc.outro: "\n\nThe ship lurches to the side, and I am pitched through an open hatch into the flooded ballast tank below. The shock of the impact knocks the air from my lungs, the icy water sending my body into stunned shock.\n\nAs I come to, coughing and spluttering under water, my body and brain are utterly aflame. My consciousness is already draining away again, my brain choking and dimming with each second."
 ck_sea.harm.0521.desc.outro: "\n\nThe vessel lurches to the side, and I am pitched into the drink. The shock of the impact knocks the air from my lungs, the sudden shift in temperature sending my body into stunned shock.\n\nAs I come to, coughing and spluttering under water, my body and brain are utterly aflame. My consciousness is already draining away again, my brain choking and dimming with each second."
 ck_lane.harm.0522.desc.sea: "Is there anything quite as invigorating as a voyage between the worlds? The aurora of the lane rippling past the ports, the distant glitter of the stars, the steady hum of the ship around us."
 ck_sea.harm.0522.desc.sea: "Is there anything quite as invigorating as the sea? The smell of the salt, the sometime-calls of gulls when passing land, the gentle sound of water lapping against our hull."
 ck_lane.harm.0522.desc.outro: "\n\nStanding at the open cargo port, leaning out toward the shimmering lane, I feel so very peaceful."
 ck_sea.harm.0522.desc.outro: "\n\nStanding on the boat's deck, leaning over the side, I feel so very peaceful."
 ck_lane.harm.0522.a: "The lights are almost hypnotic..."
 ck_sea.harm.0522.a: "The water is almost hypnotic..."
 ck_lane.pilgrimage.2030.desc: "Crossing the space lane towards our destination in [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], I am in constant awe of the void's vastness and [ROOT.Char.Custom('GetWickedDangerous')] whims.\n\nHaving just ridden out a storm of drifting ice the previous night, this morning we are greeted by a magnificent aurora, stretching across the lane from one world to the next.\n\nI overhear some of the other pilgrims also contemplating the grandness of it, calling the sight #EMP divine#! and #EMP a sign from [ROOT.Char.GetFaith.HighGodName]#!."
 ck_sea.pilgrimage.2030.desc: "Traversing the sea towards our destination in [ROOT.Char.GetTravelPlan.GetData.GetNextDestination.GetProvince.GetNameNoTooltip], I am in constant awe of its vastness and [ROOT.Char.Custom('GetWickedDangerous')] whims.\n\nHaving just ridden out a storm the previous night, this morning we are greeted by a magnificent rainbow, stretching from horizon to horizon.\n\nI overhear some of the other pilgrims also contemplating the grandness of it, calling the sight #EMP divine#! and #EMP a sign from [ROOT.Char.GetFaith.HighGodName]#!."
 ck_lane.pilgrimage.2040.desc: "As we spend our days and nights on this ship, I try to fill my time with interesting conversations, prayers, contemplating the journey or simply planning my travel forward.\n\nHowever, recently I have seen some of the pilgrims in my entourage spend their time on another quite mundane task: fishing in the great water tanks where the Spacer Guild keeps live fish for the long crossings.\n\nThey all seem quite care-free and the activity itself has a soothing aspect to it."
 ck_sea.pilgrimage.2040.desc: "As we spend our days and nights on this ship, I try to fill my time with interesting conversations, prayers, contemplating the journey or simply planning my travel forward.\n\nHowever, recently I have seen some of the pilgrims in my entourage spend their time on another quite mundane task — fishing.\n\nThey all seem quite care-free and the activity itself has a soothing aspect to it."
 ck_lane.pilgrimage.2050.desc: "Right before the ship's lamps are dimmed for the night, we hear cries for help over the speaking-tube, and as I look out of the forward port into the lane, I notice a small lifeboat with three human-like shapes.\n\nThey appear to be drifting along the lane, aimlessly going where its currents take them.\n\nI try to make out who they might be, and from my limited knowledge they look to be shipwrecked... [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? Whatever could they be doing out here?"
 ck_sea.pilgrimage.2050.desc: "Right before dusk falls, we hear the cries for help and as I look over the railing out onto the vast body of water, I notice a small boat with three human-like shapes.\n\nThey appear to be drifting across the sea, aimlessly going where the waves take them.\n\nI try to make out who they might be, and from my limited knowledge they look to be shipwrecked... [first_pilgrim.GetCulture.GetCollectiveNounNoTooltip]? Whatever could they be doing out here?"
 ck_lane.pilgrimage.2050.a.tt: "You drop the pilgrims off at the closest station"
 ck_sea.pilgrimage.2050.a.tt: "You drop the pilgrims off at the closest shore"
 ck_lane.pilgrimage.2050.b.failure.desc: "The pilgrims are not convinced, but you take them to the closest station"
 ck_sea.pilgrimage.2050.b.failure.desc: "The pilgrims are not convinced, but you help them to shore"
 ck_lane.pilgrimage_intent.1030.desc_sea: "Out here in the lane, when the ship runs quiet and not another vessel is to be seen against the stars, the peace and silence is overwhelming. [ROOT.Char.GetFaith.HighGodNamePossessive|U] presence is particularly strong here, and it fills me to the brim.\n\nPerhaps we should seize the opportunity for quiet contemplation by lingering in this stretch of the lane just a while longer?"
 ck_sea.pilgrimage_intent.1030.desc_sea: "Out here at sea, when the weather is calm and not a ship is to be seen on the horizon, the peace and quiet is overwhelming. [ROOT.Char.GetFaith.HighGodNamePossessive|U] presence is particularly strong here, and it fills me to the brim.\n\nPerhaps we should seize the opportunity for quiet contemplation by lingering in this bay just a while longer?"
