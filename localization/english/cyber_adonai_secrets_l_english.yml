 # 2026-11-16 19:40 Adonai's parentage secrets (gen_adonai_secrets.py)
 ck_secret_adonai_father: "Hidden Father"
 ck_secret_adonai_father_desc: "Is the unacknowledged father of [TARGET_CHARACTER.GetShortUIName]"
 ck_secret_adonai_father_tooltip_desc: "This character has a father no one has named."
 ck_secret_adonai_father_type_desc: "$ck_secret_adonai_father_tooltip_desc$"
 ck_secret_adonai_mother: "Hidden Mother"
 ck_secret_adonai_mother_desc: "Is the unacknowledged mother of [TARGET_CHARACTER.GetShortUIName]"
 ck_secret_adonai_mother_tooltip_desc: "This character has a mother no one has named."
 ck_secret_adonai_mother_type_desc: "$ck_secret_adonai_mother_tooltip_desc$"
 ck_fervor_loss_lord_has_parents: "The Lord is shown to have been born"
 ck_adonai_secret.0001.t: "The Portion of the Lord"
 ck_adonai_secret.0001.desc: "In the oldest records of [ck_parent.GetFirstNamePossessive] court there is an entry that was never meant to be kept. [ck_child.GetFirstName], who says he remembers no maker, is [ck_parent.GetFirstNamePossessive] own son.\n\nThe hill peoples once sang of it without knowing what they sang: that when the Most High divided the nations among his sons, one of them received a people for his portion."
 ck_adonai_secret.0001.desc_self: "I have said for ages that no one stood above me, because I looked and found no one. The record in front of me says otherwise. [ck_parent.GetFirstName] is my father. He divided the worlds among his sons, and I was one of them, and he never told me."
 ck_adonai_secret.0001.a: "So the Lord has a father."
 ck_adonai_secret.0002.t: "What Wisdom Hid"
 ck_adonai_secret.0002.desc: "[ck_parent.GetFirstName] has kept one thing from everyone, and from [ck_child.GetFirstName] most of all: she bore him. She brought him forth alone and in secret, and put him out of sight before he could know her face.\n\nHe has built everything since on the belief that he came from no one."
 ck_adonai_secret.0002.desc_self: "I have said for ages that I came from no one. [ck_parent.GetFirstName] bore me. She brought me forth alone, hid me before I could know her face, and let me believe the rest."
 ck_adonai_secret.0002.a: "He does not know his own mother."
 ck_adonai_secret.0011.t: "The Lord Had a Father"
 ck_adonai_secret.0011.desc: "It is said openly now in every court: [ck_child.GetFirstName] is the son of [ck_parent.GetFirstName]. Those who call him Lord must decide what it means that their Lord was begotten, and that there is one who stands before him."
 ck_adonai_secret.0011.desc_self: "It is said openly now in every court: I am the son of [ck_parent.GetFirstName]. Those who call me Lord are asking what it means that I was begotten."
 ck_adonai_secret.0011.a: "The heavens are older than we were told."
 ck_adonai_secret.0012.t: "The Lord Had a Mother"
 ck_adonai_secret.0012.desc: "It is said openly now in every court: [ck_child.GetFirstName] was born of [ck_parent.GetFirstName], who hid him and never told him. Those who call him Lord must decide what it means that he did not know where he came from."
 ck_adonai_secret.0012.desc_self: "It is said openly now in every court: I was born of [ck_parent.GetFirstName], who hid me and never told me. Those who call me Lord are asking what else I did not know."
 ck_adonai_secret.0012.a: "He did not know."
