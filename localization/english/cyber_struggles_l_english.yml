# Cyber Kings: world struggles. GENERATED by _dev/scripts/struggles/gen_world_struggles.py.
 ck_struggle_dominion_opinion:0 "Dominated their world"
 ck_struggle_concord_joined_opinion:0 "Joined the Concord"

# Terra
 ck_struggle_terra:0 "Struggle for Terra"
 ck_struggle_terra_desc:0 "One realm has grown to hold more than a third of Earth, and every other power on the homeworld now measures itself against it. Old rivalries between Earth's nations, faiths and peoples have flared into a contest for the future of humanity's cradle. It may end in the domination of one power, a balance among many, a concord under the [GetTitleByKey('h_ck_terra').GetName], or simple exhaustion."
 ck_terra_phase_opportunity:0 "Opportunity"
 ck_terra_phase_opportunity_desc:0 "After a long peace the powers of Earth have grown comfortable, and ambitious rulers see their chance. Claims are pressed and old grudges remembered."
 ck_terra_phase_hostility:0 "Hostility"
 ck_terra_phase_hostility_desc:0 "Open rivalry grips Earth. Wars between its powers are cheap, intolerance spreads, and any ruler strong enough may try to dominate it."
 ck_terra_phase_compromise:0 "Compromise"
 ck_terra_phase_compromise_desc:0 "Exhausted by conflict, the powers of Earth look for terms. Truces are kept, borders recognised, and a balance of power becomes possible."
 ck_terra_phase_conciliation:0 "Conciliation"
 ck_terra_phase_conciliation_desc:0 "The peoples of Earth are learning to live together again. Trade, marriages and shared institutions bind the powers, and a leading power could draw them into a Terran Concord."

 ck_terra_struggle_cb:0 "Struggle for Terra Conquest"
 ck_terra_struggle_cb_desc:0 "Seize a county of Earth during the Struggle for Terra."
 ck_terra_struggle_cb_war_name:0 "Struggle for Terra War"

 ck_terra_ending_general_peace_tt:0 "No two independent kings or greater of Earth are at war with each other"

 ck_terra_ending_dominion_decision:0 "Dominion of Terra"
 ck_terra_ending_dominion_decision_desc:0 "Earth will have one master. Crush the pretensions of the other powers and end the Struggle for Terra by force."
 ck_terra_ending_dominion_decision_tooltip:0 "End the Struggle for Terra through domination"
 ck_terra_ending_dominion_decision_correct_phase_tt:0 "The Struggle for Terra is in #V Hostility#!"
 ck_terra_ending_dominion_decision_control_tt:0 "You completely control Earth and have held an empire or greater title as your primary title for at least 5 years"
 ck_terra_ending_dominion_decision_share_tt:0 "Your realm holds at least #V $VALUE|0$#! counties of Earth"
 ck_terra_ending_dominion_decision_rival_tt:0 "No other independent realm holds #V $VALUE|0$#! or more counties of Earth"
 ck_terra_ending_dominion_effect_tt:0 "The Struggle for Terra ends in your #V Dominion#!. Every other independent ruler of Earth fears you."

 ck_terra_ending_balance_decision:0 "Balance of Power"
 ck_terra_ending_balance_decision_desc:0 "No power can hold Earth alone. Broker a settlement in which the great powers recognise each other's borders and end the Struggle for Terra."
 ck_terra_ending_balance_decision_tooltip:0 "End the Struggle for Terra through a balance of power"
 ck_terra_ending_balance_decision_correct_phase_tt:0 "The Struggle for Terra must be in #V Compromise#!"
 ck_terra_ending_balance_decision_share_tt:0 "Your realm holds fewer than #V $VALUE|0$#! counties of Earth"
 ck_terra_ending_balance_decision_other_share_tt:0 "No other independent realm holds #V $VALUE|0$#! or more counties of Earth"
 ck_terra_ending_balance_decision_opinion_tt:0 "Every other independent emperor of Earth is your ally, has at least #V 40#! opinion of you, or is under your strong hook"
 ck_terra_ending_balance_decision_no_rival_tt:0 "No other independent emperor rules on Earth"
 ck_terra_ending_balance_effect_tt:0 "The Struggle for Terra ends in a #V Balance of Power#!. Every independent king or greater of Earth gains [GetModifier('ck_terra_balance_modifier').GetName]."

 ck_terra_ending_concord_decision:0 "Terran Concord"
 ck_terra_ending_concord_decision_desc:0 "The powers of Earth have learned to trust you. Invite them into a Terran Concord under the [GetTitleByKey('h_ck_terra').GetName], united by agreement rather than conquest."
 ck_terra_ending_concord_decision_tooltip:0 "End the Struggle for Terra through a Terran Concord"
 ck_terra_ending_concord_decision_correct_phase_tt:0 "The Struggle for Terra must be in #V Conciliation#!"
 ck_terra_ending_concord_decision_hegemony_tt:0 "You hold the [GetTitleByKey('h_ck_terra').GetName], or no one does"
 ck_terra_ending_concord_decision_share_tt:0 "Your realm holds at least #V $VALUE|0$#! counties of Earth"
 ck_terra_ending_concord_decision_accept_tt:0 "Every other independent emperor of Earth is your ally, has at least #V 50#! opinion of you, or is under your strong hook"
 ck_terra_ending_concord_effect_tt:0 "You take the #V [GetTitleByKey('h_ck_terra').GetName]#! if you do not hold it already. Every other independent ruler of Earth is invited to enter it as your vassal."

 ck_terra_dominion_modifier:0 "Dominion of Terra"
 ck_terra_dominion_modifier_desc:0 "This ruler ended the Struggle for Terra by dominating Earth."
 ck_terra_balance_architect_modifier:0 "Architect of the Terran Balance"
 ck_terra_balance_architect_modifier_desc:0 "This ruler brokered the Balance of Power that ended the Struggle for Terra."
 ck_terra_balance_modifier:0 "Terran Balance of Power"
 ck_terra_balance_modifier_desc:0 "The great powers of Earth guarantee each other's borders."
 ck_terra_concord_modifier:0 "Leader of the Terran Concord"
 ck_terra_concord_modifier_desc:0 "This ruler united the powers of Earth by agreement."
 ck_terra_concord_member_modifier:0 "Member of the Terran Concord"
 ck_terra_concord_member_modifier_desc:0 "This ruler entered the [GetTitleByKey('h_ck_terra').GetName] by agreement."

 ck_struggles.0001.t:0 "The Struggle for Terra"
 ck_struggles.0001.desc:0 "[GetGlobalVariable('ck_terra_contender').GetCharacter.GetShortUIName] now rules more than a third of Earth. Every power there, and many beyond it, must now take a side in the Struggle for Terra."
 ck_struggles.0001.desc_start:0 "The powers of Earth are locked in the Struggle for Terra."
 ck_struggles.0001.a:0 "Let the struggle begin."
 ck_struggles.0010.t:0 "The Struggle for Terra Ends"
 ck_struggles.0010.desc_dominion:0 "[GetGlobalVariable('ck_terra_ender').GetCharacter.GetShortUIName] has crushed all rivals. The Struggle for Terra has ended in Dominion."
 ck_struggles.0010.desc_balance:0 "Through [GetGlobalVariable('ck_terra_ender').GetCharacter.GetShortUIName]'s diplomacy, the great powers of Earth have agreed to a Balance of Power. The Struggle for Terra is over, for now."
 ck_struggles.0010.desc_concord:0 "[GetGlobalVariable('ck_terra_ender').GetCharacter.GetShortUIName] has called the rulers of Earth into a Terran Concord under the [GetTitleByKey('h_ck_terra').GetName]. The Struggle for Terra is over."
 ck_struggles.0010.desc_collapse:0 "No power of Earth is strong enough to dominate the others any longer. Exhausted, the Struggle for Terra has collapsed."
 ck_struggles.0010.a:0 "So ends the struggle."
 ck_struggles.0020.t:0 "The Terran Concord"
 ck_struggles.0020.desc:0 "[ck_struggle_concord_leader.GetShortUIName] invites us to enter the [GetTitleByKey('h_ck_terra').GetName] as a member of the Terran Concord. We would keep our lands and laws, but bow to the hegemon."
 ck_struggles.0020.a:0 "We join the Concord."
 ck_struggles.0020.b:0 "We remain sovereign."

