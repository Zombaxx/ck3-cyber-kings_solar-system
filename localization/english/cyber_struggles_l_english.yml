 ck_luna_ending_concord_decision:0 "Lunar Concord"
 ck_luna_ending_concord_decision_desc:0 "The powers of Luna have learned to trust you. Invite them into a Lunar Concord under the [GetTitleByKey('h_moon').GetName], united by agreement rather than conquest."
 ck_luna_ending_concord_decision_tooltip:0 "End the Struggle for Luna through a Lunar Concord"
 ck_luna_ending_concord_decision_correct_phase_tt:0 "The Struggle for Luna must be in #V Conciliation#!"
 ck_luna_ending_concord_decision_hegemony_tt:0 "You hold the [GetTitleByKey('h_moon').GetName], or no one does"
 ck_luna_ending_concord_decision_share_tt:0 "Your realm holds at least #V $VALUE|0$#! counties of Luna"
 ck_luna_ending_concord_decision_accept_tt:0 "Every other independent emperor of Luna is your ally, has at least #V 50#! opinion of you, or is under your strong hook"
 ck_luna_ending_concord_effect_tt:0 "You take the #V [GetTitleByKey('h_moon').GetName]#! if you do not hold it already. Every other independent ruler of Luna is invited to enter it as your vassal."

 ck_luna_dominion_modifier:0 "Dominion of Luna"
 ck_luna_dominion_modifier_desc:0 "This ruler ended the Struggle for Luna by dominating Luna."
 ck_luna_balance_architect_modifier:0 "Architect of the Lunar Balance"
 ck_luna_balance_architect_modifier_desc:0 "This ruler brokered the Balance of Power that ended the Struggle for Luna."
 ck_luna_balance_modifier:0 "Lunar Balance of Power"
 ck_luna_balance_modifier_desc:0 "The great powers of Luna guarantee each other's borders."
 ck_luna_concord_modifier:0 "Leader of the Lunar Concord"
 ck_luna_concord_modifier_desc:0 "This ruler united the powers of Luna by agreement."
 ck_luna_concord_member_modifier:0 "Member of the Lunar Concord"
 ck_luna_concord_member_modifier_desc:0 "This ruler entered the [GetTitleByKey('h_moon').GetName] by agreement."

 ck_struggles.0301.t:0 "The Struggle for Luna"
 ck_struggles.0301.desc:0 "[GetGlobalVariable('ck_luna_contender').GetCharacter.GetShortUIName] now rules more than a third of Luna. Every power there, and many beyond it, must now take a side in the Struggle for Luna."
 ck_struggles.0301.desc_start:0 "The powers of Luna are locked in the Struggle for Luna."
 ck_struggles.0301.a:0 "Let the struggle begin."
 ck_struggles.0310.t:0 "The Struggle for Luna Ends"
 ck_struggles.0310.desc_dominion:0 "[GetGlobalVariable('ck_luna_ender').GetCharacter.GetShortUIName] has crushed all rivals. The Struggle for Luna has ended in Dominion."
 ck_struggles.0310.desc_balance:0 "Through [GetGlobalVariable('ck_luna_ender').GetCharacter.GetShortUIName]'s diplomacy, the great powers of Luna have agreed to a Balance of Power. The Struggle for Luna is over, for now."
 ck_struggles.0310.desc_concord:0 "[GetGlobalVariable('ck_luna_ender').GetCharacter.GetShortUIName] has called the rulers of Luna into a Lunar Concord under the [GetTitleByKey('h_moon').GetName]. The Struggle for Luna is over."
 ck_struggles.0310.desc_collapse:0 "No power of Luna is strong enough to dominate the others any longer. Exhausted, the Struggle for Luna has collapsed."
 ck_struggles.0310.a:0 "So ends the struggle."
 ck_struggles.0320.t:0 "The Lunar Concord"
 ck_struggles.0320.desc:0 "[ck_struggle_concord_leader.GetShortUIName] invites us to enter the [GetTitleByKey('h_moon').GetName] as a member of the Lunar Concord. We would keep our lands and laws, but bow to the hegemon."
 ck_struggles.0320.a:0 "We join the Concord."
 ck_struggles.0320.b:0 "We remain sovereign."
 ck_luna_ending_dominion_decision_body_tt:0 "You completely control the Moon or Ceres"
 ck_luna_ending_concord_decision_bodies_tt:0 "Your realm holds half of the Moon and a quarter of Ceres, or half of Ceres and a quarter of the Moon"

# the Jovian Schism
 ck_struggle_jovian:0 "The Jovian Schism"
 ck_struggle_jovian_desc:0 "Across Ganymede, Callisto and Europa the Zensunni, the Shia, the Gnostic dualists and the followers of the Eternal Mechanism contend for the souls of the Galilean moons, while older faiths endure among the moon peoples. It may end in the triumph of one faith, a settlement between them, a concordat of the faiths, or the slow victory of one faith by conversion."
 ck_jovian_phase_opportunity:0 "Schism"
 ck_jovian_phase_opportunity_desc:0 "The faiths of the Galilean moons have split apart. Each claims the moons for itself, and ambitious rulers use the quarrel for their own ends."
 ck_jovian_phase_hostility:0 "Religious Zeal"
 ck_jovian_phase_hostility_desc:0 "Zeal grips the moons. Preachers call for holy war, conversions are forced, and a faith strong enough could triumph over all the others."
 ck_jovian_phase_compromise:0 "Reconciliation"
 ck_jovian_phase_compromise_desc:0 "Weary of bloodshed, the rulers of the moons look for terms between the faiths. A settlement that lets each worship in peace is within reach."
 ck_jovian_phase_conciliation:0 "Theological Reform"
 ck_jovian_phase_conciliation_desc:0 "Scholars of every faith meet and argue rather than fight. A pious ruler could call them into a Jovian Concordat."

 ck_jovian_struggle_cb:0 "The Jovian Schism Conquest"
 ck_jovian_struggle_cb_desc:0 "Seize a county of the Galilean moons during the Jovian Schism."
 ck_jovian_struggle_cb_war_name:0 "War of the Jovian Schism"

 ck_jovian_ending_general_peace_tt:0 "No two independent kings or greater of the Galilean moons are at war with each other"

 ck_jovian_ending_triumph_decision:0 "Triumph of the Faith"
 ck_jovian_ending_triumph_decision_desc:0 "Our faith has prevailed on the Galilean moons. Proclaim its triumph and end the Jovian Schism."
 ck_jovian_ending_triumph_decision_tooltip:0 "End the Jovian Schism in the triumph of your faith"
 ck_jovian_ending_triumph_decision_correct_phase_tt:0 "The Jovian Schism is in #V Religious Zeal#!"
 ck_jovian_ending_triumph_decision_alt_tt:0 "Your faith holds at least #V $VALUE|0$#! counties of the Galilean moons"
 ck_jovian_ending_triumph_decision_faith_tt:0 "Your faith holds at least #V $VALUE|0$#! counties of the Galilean moons"
 ck_jovian_ending_triumph_decision_rival_tt:0 "No other faith holds #V $VALUE|0$#! or more counties of the Galilean moons"
 ck_jovian_ending_triumph_decision_power_tt:0 "Your realm holds at least #V $VALUE|0$#! counties of the Galilean moons"
 ck_jovian_ending_triumph_effect_tt:0 "The Jovian Schism ends in the #V Triumph#! of [ROOT.Char.GetFaith.GetName]. Its fervor rises, and independent rulers of other faiths on the moons resent you."
 ck_jovian_triumph_fervor:0 "Triumph in the Jovian Schism"

 ck_jovian_ending_settlement_decision:0 "Jovian Settlement"
 ck_jovian_ending_settlement_decision_desc:0 "No faith can rule the moons alone. Broker a settlement in which each faith keeps its own and end the Jovian Schism."
 ck_jovian_ending_settlement_decision_tooltip:0 "End the Jovian Schism through a settlement between the faiths"
 ck_jovian_ending_settlement_decision_correct_phase_tt:0 "The Jovian Schism must be in #V Reconciliation#!"
 ck_jovian_ending_settlement_decision_no_faith_tt:0 "No faith holds #V $VALUE|0$#! or more counties of the Galilean moons"
 ck_jovian_ending_settlement_decision_opinion_tt:0 "Every other independent emperor of the Galilean moons is your ally, has at least #V 40#! opinion of you, or is under your strong hook"
 ck_jovian_ending_settlement_decision_no_rival_tt:0 "No other independent emperor rules on the Galilean moons"
 ck_jovian_ending_settlement_effect_tt:0 "The Jovian Schism ends in the #V Jovian Settlement#!. Every independent king or greater of the moons gains [GetModifier('ck_jovian_settlement_modifier').GetName]."

 ck_jovian_ending_concordat_decision:0 "Jovian Concordat"
 ck_jovian_ending_concordat_decision_desc:0 "Call the scholars and priests of every faith into a council and bind the moons in a Jovian Concordat, ending the Jovian Schism."
 ck_jovian_ending_concordat_decision_tooltip:0 "End the Jovian Schism through a concordat of the faiths"
 ck_jovian_ending_concordat_decision_correct_phase_tt:0 "The Jovian Schism must be in #V Theological Reform#!"
 ck_jovian_ending_concordat_decision_share_tt:0 "Your realm holds at least #V $VALUE|0$#! counties of the Galilean moons"
 ck_jovian_ending_concordat_decision_accept_tt:0 "Every other independent emperor of the Galilean moons is your ally, has at least #V 50#! opinion of you, or is under your strong hook"
 ck_jovian_ending_concordat_effect_tt:0 "The Jovian Schism ends in the #V Jovian Concordat#!. Every independent ruler of the moons gains [GetModifier('ck_jovian_concordat_modifier').GetName]."

 ck_jovian_triumph_modifier:0 "Triumph of the Faith"
 ck_jovian_triumph_modifier_desc:0 "This ruler ended the Jovian Schism in the triumph of their faith."
 ck_jovian_settlement_architect_modifier:0 "Architect of the Jovian Settlement"
 ck_jovian_settlement_architect_modifier_desc:0 "This ruler brokered the settlement that ended the Jovian Schism."
 ck_jovian_settlement_modifier:0 "Jovian Settlement"
 ck_jovian_settlement_modifier_desc:0 "The faiths of the Galilean moons keep the peace between them."
 ck_jovian_concordat_leader_modifier:0 "Convener of the Jovian Concordat"
 ck_jovian_concordat_leader_modifier_desc:0 "This ruler called the faiths of the moons into council."
 ck_jovian_concordat_modifier:0 "Jovian Concordat"
 ck_jovian_concordat_modifier_desc:0 "The faiths of the Galilean moons are bound by a concordat."

 ck_struggles.0401.t:0 "The Jovian Schism"
 ck_struggles.0401.desc:0 "The faiths of Ganymede, Callisto and Europa are divided, and each claims the moons for itself. The Jovian Schism has begun."
 ck_struggles.0401.a:0 "Faith will decide."
 ck_struggles.0410.t:0 "The Jovian Schism Ends"
 ck_struggles.0410.desc_triumph:0 "[GetGlobalVariable('ck_jovian_ender').GetCharacter.GetShortUIName] has proclaimed the triumph of [GetGlobalVariable('ck_jovian_ender').GetCharacter.GetFaith.GetName]. The Jovian Schism is over."
 ck_struggles.0410.desc_settlement:0 "Through [GetGlobalVariable('ck_jovian_ender').GetCharacter.GetShortUIName]'s diplomacy, the faiths of the moons have agreed to the Jovian Settlement. The Jovian Schism is over, for now."
 ck_struggles.0410.desc_concordat:0 "[GetGlobalVariable('ck_jovian_ender').GetCharacter.GetShortUIName] has bound the faiths of the moons in the Jovian Concordat. The Jovian Schism is over."
 ck_struggles.0410.desc_healed:0 "One faith now holds nearly all of the Galilean moons. Without rivals, the Jovian Schism has faded away."
 ck_struggles.0410.a:0 "So ends the schism."
