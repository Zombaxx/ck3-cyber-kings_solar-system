 situation_type_ck_triton_steppe_desc: "On the frozen northern continent of Triton, ergaster and torquas clans follow their herds across the ice plains and geyser fields. The seasons decide whether they prosper or starve, and in hard years they ride south into the tribal lands of the neanderthal and antecessor peoples, who may in turn take up the nomad life."
