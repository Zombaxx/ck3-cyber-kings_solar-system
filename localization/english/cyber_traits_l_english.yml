 trait_cybernetic_arm:0 "Cybernetic Arm"
 trait_cybernetic_arm_desc:0 "One of this character's arms is a machine."
 trait_cybernetic_leg:0 "Cybernetic Leg"
 trait_cybernetic_leg_desc:0 "One of this character's legs is a machine."
 trait_cybernetic_skeleton:0 "Cybernetic Skeleton"
 trait_cybernetic_skeleton_desc:0 "This character's bones have been reinforced or replaced with alloy."
 trait_full_cybernetic_conversion:0 "Cywizard"
 trait_full_cybernetic_conversion_desc:0 "This character has undergone full cybernetic conversion. Only the brain remains organic; the body is a machine that does not age. Cywizards hold the secrets of genetic engineering."
 trait_damaged_cybernetics:0 "Damaged Cybernetics"
 trait_damaged_cybernetics_desc:0 "This character's implants are damaged and malfunctioning."
 trait_clone:0 "Clone"
 trait_clone_desc:0 "This character is a clone, an artificially created human grown from someone else's genetic stock."
 trait_vat_born:0 "Vat Born"
 trait_vat_born_desc:0 "This character was decanted from a vat: an artificially created human grown from the genes of several donors. The process resembles cloning, with multiple donors."
 trait_cloning_defects:0 "Cloning Defects"
 trait_cloning_defects_desc:0 "This character's clone line has been tainted by genetic defects. Something about them is not quite right."
 trait_supersoldier:0 "Supersoldier"
 trait_supersoldier_desc:0 "This character, or an ancestor, was genetically engineered for superhuman strength and endurance."
 trait_spacer:0 "Spacer"
 trait_spacer_desc:0 "Generations in low gravity have changed this character's physiology: taller and thinner than other humans, and unable to live long on a heavy world without acclimating drugs."
 trait_worlder:0 "Worlder"
 trait_worlder_desc:0 "This character was born and raised under the gravity of a world."
 trait_gmo:0 "Genetically Modified"
 trait_gmo_desc:0 "This character was genetically modified, or inherited modified genes from an engineered ancestor."
 trait_empath:0 "Empath"
 trait_empath_desc:0 "An innate ability to sense and understand the emotions of others, and to reach networks with the mind alone. Empaths are charismatic and intuitive, but feel the suffering around them keenly."
 trait_nekojin:0 "Nekojin"
 trait_nekojin_desc:0 "This character, or an ancestor, had their genes spliced with a cat. Still recognisably human, the results are uncanny."
 trait_archaic:0 "Archaic"
 trait_archaic_desc:0 "The Archaic are blessed with a modest extension of life, a refined elegance and a profound affinity for historical lore, blending age-old wisdom with a timeless, graceful presence."
 trait_elohim:0 "Elohim"
 trait_elohim_desc:0 "A celestial people known for ethereal beauty and cosmic wisdom. Blending ancient tradition with a connection to the cosmos, they are revered as guardians and wise rulers across many worlds."
 trait_neanderthal:0 "Neanderthal"
 trait_neanderthal_desc:0 "Neanderthals have a robust, stocky build, pronounced brow ridges and short stature. Adapted to cold climates, they are powerfully muscled, with a neural wiring that gives them an innate talent for spatial tasks and tracking."
 trait_jotunn:0 "Jotunn"
 trait_jotunn_desc:0 "Of towering stature and formidable strength, the Jotnar are renowned for extraordinary endurance and a commanding presence, echoing ancient might and majesty."
 trait_mau_khet:0 "Mau'Khet"
 trait_mau_khet_desc:0 "The Mau'Khet move with agile grace and perceive with sharp senses, an air of feline mystique about them: curious, independent, sleek and stealthy."
 trait_denisovan:0 "Denisovan"
 trait_denisovan_desc:0 "Denisovans are distinguished by striking green skin and an underbite with tusk-like canines. Exceptionally resilient and formidable in combat, they dominate as warriors and protectors."
