 ancestor_worship_faith_adherent_plural: "Ancestor Worshippers"
 ancestor_worship_faith_desc: "Ancestor Worship is a collection of beliefs partially Buddhist in nature, with polytheistic animist traditions guided by shamans. The ancestral dieties often interact with the world of the living, at times protecting people, and at other times seeming to cause harm."
