 lunism_faith_adj: "Lunist"
 lunism_faith_adherent: "Lunist"
 lunism_faith_adherent_plural: "Lunists"
 lunism_faith_desc: "Descended from the worship of deities prior to the Great Disaster of long ago, Lunism followers remember the dark forested lands and large rolling hills of tall grasses. Led by archivists who sought to keep these traditions alive through the dark ages of planetary isolation, the worship of these deities and the script of their mythological texts has combined to keep the Lunist faith strong. These people are stout and hold fast to their homeland, woe behold anyone who tries to take it from them or remove the sacred forests."
