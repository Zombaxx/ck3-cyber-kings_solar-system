 retrogradism_rite_adherent: "Retrogradist"
 retrogradism_rite_adherent_plural: "Retrogradists"
 retrogradism_rite_desc: "The rite of the Retrogradism faith."
 cargo_cult_faith: "Cargo Cult"
 cargo_cult_faith_name: "Cargo Cult"
 cargo_cult_faith_adj: "Cargo Cult"
 cargo_cult_faith_adherent: "Cargo Cultist"
 cargo_cult_faith_adherent_plural: "Cargo Cultists"
 cargo_cult_faith_desc: "A cargo cult is an indigenist millenarian belief system, in which adherents perform rituals which they believe will cause a more technologically advanced society to deliver goods. They are marked by a number of common characteristics, including a \"myth-dream\" that is a synthesis of indigenous and foreign elements, the expectation of help from the ancestors, charismatic leaders, and a belief in the appearance of an abundance of goods.."
