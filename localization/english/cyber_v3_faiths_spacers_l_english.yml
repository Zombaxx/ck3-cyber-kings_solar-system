 gnoslam_faith_name: "Gnoslam"
 gnoslam_faith_adj: "Gnoslamic"
 gnoslam_faith_adherent: "Gnoslamite"
 gnoslam_faith_adherent_plural: "Gnoslamites"
 gnoslam_faith_desc: "Gnoslam, also known as Gnostic Chrislam, is a unique and complex faith, combining tenants from many Abrahamic teachings into a multifaceted belief system. They claim that all other Abrahamic religions are misinterpretations of their God-Emperor. Gnoslam reflects God's continuous attempts throughout history to establish his true religion. Having founded the original versions of Judaism, Christianity, Islam, and many of their reformations at different times, each iteration was an effort to restore the faith after it had strayed from the original message during his periods of absence. Rituals and practices blend aspects of prayer, meditation, and ceremonial rites, focusing on personal enlightenment and communal worship of God as the divine ruler and ultimate source of wisdom, and bringing his Kingdom of Divinity to all of the world."
