 escudo_solar_faith_adherent_plural: "Escudo Solarists"
 escudo_solar_faith_desc: "Escudo Solarists believe the ancient king Pakal had saved the Earth from the Doom with his sun shield vessel. Humanity strayed from this sacred knowledge and neglected to stop the Doom the second time. They must be ready to stop it the third."
