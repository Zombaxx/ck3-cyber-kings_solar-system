 holy_serpent_faith: "Holy Serpent"
 holy_serpent_faith_name: "Holy Serpent"
 holy_serpent_faith_adj: "Holy Serpent"
 holy_serpent_faith_adherent: "Serpentine"
 holy_serpent_faith_adherent_plural: "Serpentines"
 holy_serpent_faith_desc: "The Holy Serpent is a heretical Christian sect that originated on the moon after the use of the Colomboid Space Gun successfully landed an expedition of joint USA and European forces in 1902, influenced by the native Lunists. They believe that the true God can be perceived by the carnal senses, and that this perception is necessary to reach perfection. Each person is born with an inner god, and only intense prayer can achieve its full potential. They also believe that Lucifer was the leader of a rebellion against the tyrant of the Elohim and a force for good, and that incest is sacred since it was practised by the children of Adam and Eve thanks to their salvation by the sacred Sacred Serpent. This same Sacred Serpent would show Jesus the true path after his 40 days of fasting in the desert, once again. They have no formal rites and no strict church hierarchy."
 holy_serpent_rite: "Holy Serpent"
