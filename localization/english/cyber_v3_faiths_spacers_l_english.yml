 non_denominational_rite_desc: "The rite of the Non-Denominational faith."
 reaverism_faith: "Reaverism"
 reaverism_faith_name: "Reaverism"
 reaverism_faith_adj: "Reaverist"
 reaverism_faith_adherent: "Reaverist"
 reaverism_faith_adherent_plural: "Reaverists"
 reaverism_faith_desc: "Reaverism is the opportunistic faith practiced largely by the Space Pirates and Criminal Syndicates of the Solar System, blending ancient pagan reverence with pragmatic self-interest. Devotees believe the recently re-discovered many Terraformed Worlds are a chaotic sea ripe for conquest and adventure, where morality is subjective, and fortune favors the bold. Reavers pursue personal glory and wealth, justifying raids and plunder as sacred rites. Ceremonies often involve symbolic tributes to patron deities for successful ventures, alongside rituals venerating the carrier and shuttle spaceships they managed to steal from the Celestial of Tau Ceti during their founding as living entities imbued with divine essence."
 reaverism_rite: "Reaverism"
 reaverism_rite_name: "Reaverism"
 reaverism_rite_adj: "Reaverist"
 reaverism_rite_adherent: "Reaverist"
 reaverism_rite_adherent_plural: "Reaverists"
 reaverism_rite_desc: "The rite of the Reaverism faith."
 retrogradism_faith: "Retrogradism"
 retrogradism_faith_name: "Retrogradism"
 retrogradism_faith_adj: "Retrogradist"
 retrogradism_faith_adherent: "Retrogradist"
 retrogradism_faith_adherent_plural: "Retrogradists"
 retrogradism_faith_desc: "Retrogradism, a pagan belief system found in various forms around Triton, revolves around the core practice of communion with the spiritual world through intermediaries or 'shamans'. Its practitioners believe in a world imbued with spirits - of the deceased, of animals, of natural elements, and of deities. These spirits influence the material world and shamans can negotiate, appease, or interact with them for the benefit of their communities. Rituals, dreams, and symbols hold important places in these practices. The respect for nature is intrinsic, and ancestors are venerated. This decentralized religion, rich in rituals and deeply connected to the natural world, offers a unique way of spiritual life and societal organization."
 retrogradism_rite: "Retrogradism"
 retrogradism_rite_name: "Retrogradism"
