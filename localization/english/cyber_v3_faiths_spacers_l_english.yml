l_english:
 protestant_faith: "Protestant"
 protestant_faith_name: "Protestant"
 protestant_faith_adj: "Protestant"
 protestant_faith_adherent: "Protestant"
 protestant_faith_adherent_plural: "Protestants"
 protestant_faith_desc: "Protestants reject the Catholic doctrine of papal supremacy, but disagree among themselves regarding the number of sacraments, the real presence of Christ in the Eucharist, and matters of ecclesiastical polity and apostolic succession. They emphasize the priesthood of all believers, justification by faith alone rather than by faith with good works, the teaching that salvation comes by divine grace or \"unmerited favor\" only, not as something merited, and either affirm the Bible as being the sole highest authority or primary authority for Christian doctrine, rather than being on parity with sacred tradition."
 protestant_rite: "Protestant"
 protestant_rite_name: "Protestant"
 protestant_rite_adj: "Protestant"
 protestant_rite_adherent: "Protestant"
 protestant_rite_adherent_plural: "Protestants"
 protestant_rite_desc: "The rite of the Protestant faith."
 anglican_faith: "Anglican"
 anglican_faith_name: "Anglican"
 anglican_faith_adj: "Anglican"
 anglican_faith_adherent: "Anglican"
 anglican_faith_adherent_plural: "Anglicans"
 anglican_faith_desc: "The Anglican Church emerged from a turbulent history to become a symbol of continuity and faith for its adherents. After the devastation of 2026 wiped out modern technology, the church served as a beacon of hope, stability, and community for the faithful. Its adherence to a middle path between Catholicism and Protestantism allows for a diverse range of beliefs and practices under a common banner, and its strong ties to the monarchy mean that it often plays a crucial role in the politics of the realm."
 anglican_rite: "Anglican"
 anglican_rite_name: "Anglican"
 anglican_rite_adj: "Anglican"
 anglican_rite_adherent: "Anglican"
 anglican_rite_adherent_plural: "Anglicans"
 anglican_rite_desc: "The rite of the Anglican faith."
 latter_day_saints_faith: "Latter-day Saints"
 latter_day_saints_faith_name: "Latter-day Saints"
 latter_day_saints_faith_adj: "Latter-day Saint"
 latter_day_saints_faith_adherent: "Latter-day Saint"
 latter_day_saints_faith_adherent_plural: "Latter-day Saints"
 latter_day_saints_faith_desc: "The Church of the Latter-day Saints, also unofficially called the Mormon Church, is a nontrinitarian, Christian restorationist church that considers itself to be the restoration of the original church founded by Jesus Christ. Although originating in the United States long before the Great Disaster, the church had pockets of followers all around the globe by the time the Great Disaster occured. Although their influence had dwindled over the millenia, they found that the disorganized Cult of the Reborn were the perfect opportunity to be indoctrinated into the true faith for their own salvation, and to gain enough followers to once again send prosthelytizing missions around the world."
 latter_day_saints_rite: "Latter-day Saints"
 latter_day_saints_rite_name: "Latter-day Saints"
 latter_day_saints_rite_adj: "Latter-day Saint"
 latter_day_saints_rite_adherent: "Latter-day Saint"
 latter_day_saints_rite_adherent_plural: "Latter-day Saints"
 latter_day_saints_rite_desc: "The rite of the Latter-day Saints faith."
 fundamentalist_faith: "Fundamentalist"
 fundamentalist_faith_name: "Fundamentalist"
 fundamentalist_faith_adj: "Fundamentalist"
 fundamentalist_faith_adherent: "Fundamentalist"
 fundamentalist_faith_adherent_plural: "Fundamentalists"
 fundamentalist_faith_desc: "Fundamentalism is a movement emphasizing biblical literalism. They argue that many modernist theologians had misinterpreted or rejected certain doctrines, especially biblical inerrancy, which they considered the fundamentals of the Christian faith. Fundamentalists are almost always described as holding to the beliefs in biblical infallibility and biblical inerrancy. In keeping with traditional Christian doctrines concerning biblical interpretation, the role of Jesus in the Bible, and the role of the church in society, fundamentalists usually believe in a core of Christian beliefs which include the historical accuracy of the Bible and all of the events which are recorded in it as well as the Second Coming of Jesus Christ. Fundamentalism manifests itself in various denominations which believe in various theologies, rather than a single denomination or a systematic theology."
 fundamentalist_rite: "Fundamentalist"
 fundamentalist_rite_name: "Fundamentalist"
 fundamentalist_rite_adj: "Fundamentalist"
 fundamentalist_rite_adherent: "Fundamentalist"
 fundamentalist_rite_adherent_plural: "Fundamentalists"
 fundamentalist_rite_desc: "The rite of the Fundamentalist faith."
 non_denominational_faith: "Non-Denominational"
 non_denominational_faith_name: "Non-Denominational"
 non_denominational_faith_adj: "Non-Denominational"
 non_denominational_faith_adherent: "Non-Denominational Christian"
 non_denominational_faith_adherent_plural: "Non-Denominational Christians"
 non_denominational_faith_desc: "Unorganized and decentralized, Non-Denominational Christians are marked by diverse practices, ranging from charismatic worship to minimalist gatherings, where believers emphasize scripture over dogma. However, its lack of cohesion has left it vulnerable to internal schisms and outside condemnation. Reforming the Non-Denominational Christian Heresy could bring unity to its scattered followers, potentially transforming it into a powerful spiritual force, guided by a codified theology that bridges its many disparate beliefs."
 non_denominational_rite: "Non-Denominational"
