l_english:
 bm_cyber_kings_1066: "Solar System 2050 C.E."
 bm_cyber_kings_1066_desc: "Decades ago, Earth went dark on the same day all existing electronics in the Solar System stopped working. All ships not in orbit fell from the sky. Humanity quickly descended into chaos as society collapsed, bringing on a new Dark Age. Most of the population succumbed to famine as governments broke down and nations fractured. Until one day a derelict ship, carrying a strange elongated race that cannot survive in the gravity well of a planet's surface, arrived in orbit, offering to transport the humans of the many worlds of the Solar System on trips of conquest to nearby planets in exchange for basic supplies and goods. This technologically advanced but politically neutral faction, which had voyaged from the neighboring star system of Tau Ceti in a generational colony ship to investigate why the ancient proto-civilizations of Sol had gone dark to communications many millennia ago, would eventually become known as the Spacer's Guild to the native rulers of the Solar System and would hold a monopoly on the services of interplanetary travel, cybernetics, and cloning."
 bm_group_cyber_kings: "Cyber Kings"
 bm_ck_char_108275: "Colonists of Venus"
 bm_ck_char_108275_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_108275_desc: "With the discovery of space habitats and rockets by the people of Earth that can reach other worlds in the decades prior to the Great Disaster that would ultimately destroy all modern technology, sending humanity back to the dark ages it is in today, a Cold War during an era of colonization occured when the already inhabited yet primitive worlds of Sol were discovered during the Space Race. Now with the remaining oppressors having been cut off from their home world and pushed out of all regions except the Shinto and Catholic islands in the north near the pirate outpost, the humid jungle planet of Venus is nearly free to play out its natural course between the three tribal Druids, Solarians, and Animists, as well as the many seemingly Dharmist beliefs of the planet's separate nomadic neanderthal caste system."
 bm_ck_char_121585: "Caliph of the Galilean Moons"
 bm_ck_char_121585_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_121585_desc: "The great sultan of Jupiter's Zensunni has recaptured his ancestral lands from infidel hands. With the Kingdom in danger, the great leaders of the moon of Europa prepare to embark to the Holy Land on the largest crusade ever. The Gnostic Christian kingdoms of the three Galilean moons reach a stalemate against the Zensunni, as the powerful ancient cyborgs of the Eternal Mechanism rise on central Ganymede with the declared intent of halting the Christian invasion, guiding the strayed Zensunni back to their roots, and returning Al-Jupitalus to its former glory as the pleroma. Yet a more distant shadow is falling: an interplanetary empire from Ganymede has quietly planted an outpost on the Zensunni's own world, and few believe it means to stay small."
 bm_ck_char_112385: "Olympians of Mars"
 bm_ck_char_112385_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_112385_desc: "When the rovers first arrived to Mars they confirmed what the few spacefaring nations of Earth had already feared yet kept secret from the public, that like the Moon, other worlds beyond Earth were also already home to vast cultures of other exotic humans, separated from Earth during pre-history in an interplanetary civilization-ending calamity. After the Lunar Independence Rebellion succeeded in 1972  shortely before the loss of the Venusnam War, the United States remained unable to continue to fund new colonization efforts offworld, until the elite of the private sector funded the mission for their own benefit. In the wake of the Great Disaster, neo-feudalism crept in faster than expected, with the former corporation now run as a vast empire stretching from Mount Olympus to Valles Mareneris. The native Olympians begin to plot rebellion."
 bm_ck_char_101415: "United Oligarchy of America"
 bm_ck_char_101415_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_101415_desc: "The United States has dubiously survived the Great Disaster, but as tensions between the Muricans and Liblanders begin to rise once again turmoil appears to lie around the corner. Will the President, who had been ruling via decree of a continued State of Emergency for decades, prevail in calming the masses, or will the once mighty empire be fractured, allowing opportunity to those who dare to take it? The endless quarterly profit goals of corporations largely drove the rise of the accelerated pre-disaster development, but even with the total destruction of all advanced technology, the corporate elite were ready to weather the storm. Now that the storm has finally lifted, or at least reached the eye, the Board begins to wonder if the common people would be better off under the total unregulated rule of corporate overlords rather than a failed federation, and more importantly what this could mean for their shareholders."
 bm_ck_char_1020130: "Dark Side of the Moon"
 bm_ck_char_1020130_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_1020130_desc: "In the fractured political landscape of the inhabitable side of the moon, the Kennedy Clone Dynasty rules a small, volatile nation state decades after the infamous Lunar Rebellion that shattered the colonies. Their realm is plagued by instability due to the new clone heir not being a perfect copy due to cloning defects, threatening their claim to power. Adding to the tension, the elder Monroe clone vanished years ago, and rumors suggest she now leads a nearby pagan Lunist tribe. This fragile state must navigate pagan savages, rival lunar colonies, a persistent United States outpost, and the ever-present threat of internal strife. Will the clones manage to re-unite the lunar colonies and pursue the claims of their forefathers, or will their venture wither into obscurity?"
 bm_ck_char_107175: "Cyborg of Eurasia"
 bm_ck_char_107175_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_107175_desc: "When the Ancient Cyborg first descended from the Himalayan space elevator, which China owned, China was surprised to learn that this being was from a very literal Celestial Empire, seemingly ruled by the literal Jade Emperor of legends that China's own Emperors had always spoken of being descended from. China, soon found itself taken under the wing of their long lost family, gaining unimagined technological wonders, knowledge, and security at the cost of agreeing to pay tribute and to help the Celestial in battle. Soon they grew to possess a larger portion of Eurasia, but all was not well in heaven as the Cyborg was not the true master above, the treacherous Spacers having overthrown his rule of the millennia spacefleet from Tau Ceti 1066 years ago and installing his corrupted cloneline as the new rulers. Now crowned Hegemon of Eurasia, the Ancient Cyborg holds claim to every throne from Europe to the Indies, though the realm that truly answers to him ends at the borders of his old empire."
 bm_ck_char_104265: "Kemetics of Mercury"
 bm_ck_char_104265_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_ck_char_104265_desc: "Deep in the Upper Nile of Egypt lies a seemingly endless ornate tunnel. The Nile of Mercury contains a mysteriously similar tunnel, and the tribal inhabitants of the nearby great deserts still follow the ancient ways of the Kemetic pagan gods. Shortly after the arrival of the Celestial Space Fleet the endless tunnel suddenly transformed into a seemingly liquid mirror, only the other side seemed to be a continuation of the surrounding environment but with an abrupt change at the boundary. On closer inspection, it was in fact a Jump Gate that had been reactivated, a stabilized wormhole punched in the very fabric of space itself between the separate Nile regions on Earth and Mercury. Will the tribes of Mercury's expansive deserts bring Kemetic control back to Egypt, or will the Sunni venture forth to the desert planet in a new era of holy wars?"
