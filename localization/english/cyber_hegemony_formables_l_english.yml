l_english:
 h_ck_terra:0 "Terra"
 h_ck_terra_adj:0 "Terran"
 h_ck_helian:0 "Helian Hegemony"
 h_ck_helian_adj:0 "Helian"
 h_ck_celestial:0 "Celestial Hegemony"
 h_ck_celestial_adj:0 "Celestial"
 h_ck_sol:0 "Sol"
 h_ck_sol_adj:0 "Solar"
 ck_form_terra_hegemony_decision:0 "Establish the Hegemony of Terra"
 ck_form_terra_hegemony_decision_desc:0 "The old powers of Earth bicker over a world that is already half ours. Proclaim the Hegemony of Terra, and let every land of Earth, humanity's first world, answer to a single throne."
 ck_form_terra_hegemony_decision_tooltip:0 "Unite Earth under the Hegemony of Terra."
 ck_form_terra_hegemony_decision_confirm:0 "Proclaim Terra"
 ck_form_helian_hegemony_decision:0 "Establish the Helian Hegemony"
 ck_form_helian_hegemony_decision_desc:0 "The Helian worlds, Mercury, Venus and Mars, circle closest to the Sun beside Earth, and half of their lands already obey us. Proclaim the Helian Hegemony over the sunward worlds."
 ck_form_helian_hegemony_decision_tooltip:0 "Unite Mercury, Venus and Mars under the Helian Hegemony."
 ck_form_helian_hegemony_decision_confirm:0 "Proclaim the Helian Hegemony"
 ck_form_celestial_hegemony_decision:0 "Establish the Celestial Hegemony"
 ck_form_celestial_hegemony_decision_desc:0 "The Celestial worlds are the moons and the belt: the Moon, Ceres and Phobos, and Ganymede, Callisto, Europa, Titan and Triton beyond. Half of their lands already obey us. Proclaim the Celestial Hegemony over the moons of the heavens."
 ck_form_celestial_hegemony_decision_tooltip:0 "Unite the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton under the Celestial Hegemony."
 ck_form_celestial_hegemony_decision_confirm:0 "Proclaim the Celestial Hegemony"
 ck_form_sol_hegemony_decision:0 "Unite the Solar System"
 ck_form_sol_hegemony_decision_desc:0 "Not since the age of the proto-civilization has one power held sway over the entire Solar System. We already rule one of its three great realms - Terra (Earth), the Helian worlds (Mercury, Venus and Mars) or the Celestial worlds (the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton) - and half the lands of another obey us. Proclaim Sol, the hegemony of the entire Solar System itself: every world that circles the Sun."
 ck_form_sol_hegemony_decision_tooltip:0 "Unite the entire Solar System, all twelve worlds, as the Hegemony of Sol."
 ck_form_sol_hegemony_decision_confirm:0 "Proclaim Sol"
 ck_form_terra_hegemony_decision_effect_tt:0 "Every Earth empire whose hegemony has no holder, every Earth empire you hold, and every Earth empire at least half inside your realm becomes de jure part of [GetTitleByKey('h_ck_terra').GetName]. Hegemonies left without land become titular.\nYou gain the #V Unite World#! casus belli."
 ck_form_helian_hegemony_decision_effect_tt:0 "Every Helian (Mercury, Venus, Mars) empire whose hegemony has no holder, every Helian (Mercury, Venus, Mars) empire you hold, and every Helian (Mercury, Venus, Mars) empire at least half inside your realm becomes de jure part of [GetTitleByKey('h_ck_helian').GetName]. Hegemonies left without land become titular.\nYou gain the #V Unite the Helian Worlds#! casus belli, including against whole hegemonies."
 ck_form_celestial_hegemony_decision_effect_tt:0 "Every Celestial (Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan, Triton) empire whose hegemony has no holder, every Celestial (Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan, Triton) empire you hold, and every Celestial (Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan, Triton) empire at least half inside your realm becomes de jure part of [GetTitleByKey('h_ck_celestial').GetName]. Hegemonies left without land become titular.\nYou gain the #V Unite the Celestial Worlds#! casus belli, including against whole hegemonies."
 ck_form_sol_hegemony_decision_effect_tt:0 "Every empire of the entire Solar System whose hegemony has no holder, every empire you hold, and every empire at least half inside your realm becomes de jure part of [GetTitleByKey('h_ck_sol').GetName]. Hegemonies left without land become titular.\nYou gain the #V Unite the Solar System#! casus belli, including against whole hegemonies, anywhere in the Solar System."
 ck_heg_req_terra:0 "Your realm holds at least #V $VALUE|0$#! counties on Earth: half of them"
 ck_heg_req_helian:0 "Your realm holds at least #V $VALUE|0$#! counties on the Helian worlds (Mercury, Venus and Mars): half of them"
 ck_heg_req_celestial:0 "Your realm holds at least #V $VALUE|0$#! counties on the Celestial worlds (the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton): half of them"
 ck_unite_cb_absorb_tt:0 "Empires now at least half inside the attacker's realm become de jure part of the attacker's hegemony."
 ck_hegemony.0001.t:0 "The Hegemony of Terra"
 ck_hegemony.0001.desc:0 "Earth, the cradle of humanity, answers to one throne again. The Hegemony of Terra lays claim to every land of Earth.\n\nThe heralds of the Spacer Guild carry our proclamation along every space lane."
 ck_hegemony.0001.a:0 "Let the worlds take note."
 ck_hegemony.0011.t:0 "The Hegemony of Terra"
 ck_hegemony.0011.desc:0 "[ck_heg_founder.GetTitledFirstName] has proclaimed a new hegemony. Earth, the cradle of humanity, answers to one throne again. The Hegemony of Terra lays claim to every land of Earth."
 ck_hegemony.0011.a:0 "The balance of the worlds has shifted."
 ck_hegemony.0002.t:0 "The Helian Hegemony"
 ck_hegemony.0002.desc:0 "The sunward worlds, Mercury, Venus and Mars, are bound together under the Helian Hegemony.\n\nThe heralds of the Spacer Guild carry our proclamation along every space lane."
 ck_hegemony.0002.a:0 "Let the worlds take note."
 ck_hegemony.0012.t:0 "The Helian Hegemony"
 ck_hegemony.0012.desc:0 "[ck_heg_founder.GetTitledFirstName] has proclaimed a new hegemony. The sunward worlds, Mercury, Venus and Mars, are bound together under the Helian Hegemony."
 ck_hegemony.0012.a:0 "The balance of the worlds has shifted."
 ck_hegemony.0003.t:0 "The Celestial Hegemony"
 ck_hegemony.0003.desc:0 "The moons and the belt, the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton, are bound together under the Celestial Hegemony.\n\nThe heralds of the Spacer Guild carry our proclamation along every space lane."
 ck_hegemony.0003.a:0 "Let the worlds take note."
 ck_hegemony.0013.t:0 "The Celestial Hegemony"
 ck_hegemony.0013.desc:0 "[ck_heg_founder.GetTitledFirstName] has proclaimed a new hegemony. The moons and the belt, the Moon, Ceres, Phobos, Ganymede, Callisto, Europa, Titan and Triton, are bound together under the Celestial Hegemony."
 ck_hegemony.0013.a:0 "The balance of the worlds has shifted."
 ck_hegemony.0004.t:0 "Sol"
 ck_hegemony.0004.desc:0 "For the first time since the proto-civilization, the entire Solar System, all twelve worlds from Mercury to Triton, is claimed by a single hegemony: Sol. Sol lays claim to Terra, the Helian worlds and the Celestial worlds alike.\n\nThe heralds of the Spacer Guild carry our proclamation along every space lane."
 ck_hegemony.0004.a:0 "Let the worlds take note."
 ck_hegemony.0014.t:0 "Sol"
 ck_hegemony.0014.desc:0 "[ck_heg_founder.GetTitledFirstName] has proclaimed a new hegemony. For the first time since the proto-civilization, the entire Solar System, all twelve worlds from Mercury to Triton, is claimed by a single hegemony: Sol. Sol lays claim to Terra, the Helian worlds and the Celestial worlds alike."
 ck_hegemony.0014.a:0 "The balance of the worlds has shifted."
