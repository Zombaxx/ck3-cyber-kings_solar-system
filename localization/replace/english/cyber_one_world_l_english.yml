l_english:
 # Cyber Kings (2026-11-12, LOCALIZATION_SOLAR batch 1): vanilla strings that assumed a single world, reworded for
 # the solar system. Only the "world" phrase changed; scopes and the rest of the text are vanilla 1.20. After a CK3
 # patch: diff these keys against vanilla (VANILLA_PATCH_CHECKLIST).
 dynasty_of_many_crowns_decision_desc:1 "One day, our dynasty will rule realms on many worlds. Through marriage and conquest, the [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] name will be known to all."
 viz_extravagance.t3.activities.scholars.debates:0 "This character invites scholars of all stripes from every known world to their gatherings, delighting in the conversations brought by the greatest minds of the age sat at the same table."
 viz_extravagance.t3.treasure.fabrics:0 "This character prides themselves on owning ample quantities of the most luxurious textiles of all the worlds: silks, damasks, velvets, fine brocades, elaborate quilts, and a near-infinite sea of minor variations and regional specialities."
 bp2_adult_education.1011.desc:0 "People from all over the known worlds gather in universities and religious centers to gain and share knowledge, but this is made possible only by the shared knowledge of a common language, usually some ancient language of liturgy loaded with traditional authority.\n\nUnfortunately, I'm not very familiar with the language of culture spoken in [location.GetBaronyNameExplicitly], which is making my studies much harder than they need to be.\n\nIt's not an easy endeavor, but isn't this what higher education is all about?"
 ep3_laamp_flavor.0030.desc:0 "The banquet tables extend far! My high throne gleams with rubies and sapphires! Guests from every world under the Sun celebrate my twenty years of blessed reign.\n\n“Another cup of sweet ambrosia, glorious Emperor?” Supreme Archsteward [dream_friend.GetFirstName] asks, offering a splendid goblet. I quaff from it eagerly.\n\n“Dance for me, fool!” I bellow at the disgraced and humbled [dream_rival.GetFirstName]. Such is the fate of those who cross me. I close my eyes for just a moment.\n\nUpon opening them again, I find myself in an all too familiar straw bed. I sigh. Just a dream."
 fp2_yearly.1008.desc:0 "It is time. Deep in my storage has sat some of the most incredible cheese in all the known worlds, slowly ageing, increasing in potency.\n\n And now I shall consume it."
 court_events.1000.desc:0 ""O great [ROOT.Char.GetTitleAsNameNoTooltip]! Together, we two have wandered all the known worlds," fawns [guest.GetName], the first of a pair of renowned travelers, "Beheld sunny pleasure-domes! Caves of ice! Drunk the milk of Palestine and fed on honey-dew."\n\n"We've visited the camps of khans, sultans' palaces, ancient halls... but not a court on any world compares to yours: none equal in stateliness and luxury!"\n\n[guest.GetHerHis|U] companion [guest_2.GetName] performs strange foreign obeisances, pleading:\n\n"The comforts of this place — they're beyond even [second_court.GetPrimaryTitle.GetAdjective] frivolities... wise [ROOT.Char.GetTitleAsNameNoTooltip], please allow us yet more early glimpses of [guest_2.GetFaith.PositiveAfterLife]!""
 court_maintenance.0012.desc_illustrious:0 "My family's insignia is now known across the worlds, noted by chancellors, taught to children, and delighting merchants on worlds never even set foot on by [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip]."
 major_decisions.0501.desc:0 "Through carefully planned marriages, alliances and conquests, the [ROOT.Char.GetDynasty.GetBaseNameNoTooltip] dynasty has taken its rightful place among the true powers of the known worlds.\n\n[realm_1.GetNameNoTierNoTooltip|U], [realm_2.GetNameNoTierNoTooltip|U], [realm_3.GetNameNoTierNoTooltip|U], [realm_4.GetNameNoTierNoTooltip|U]... Our domain stretches far and wide. Many crowns sit atop our heads, but by blood, we are united as one."
 ep3_laamp_flavour_ewan.3051.b:0 "My map shall be famed across the worlds."
 guide_map_desc:0 "This bundle of maps shows the lay of the land in great detail, across much of the known worlds. It is particularly useful when navigating tricky and treacherous terrain."
 learning_scholarship_special.3001.desc_opening:0 "The transmutation of lead to gold has long been the dream of alchemists across the worlds. Though many have attempted such a feat, nobody is known to have succeeded.\n\n"
 faith_creation.1001.desc.outlook.ghw:0 "\n\nImpassioned [reformer.Custom('DefaultPriestTitlePlural')] are already talking about launching [reformed_faith.GHWNamePlural] to spread their new faith across the worlds and"
 SUCCESSION_EVENT_WINDOW_HEIR_VIKING:0 "Having led numerous raids, [ROOT.Char.GetFirstNamePossessiveNoTooltip] name is known and feared across the worlds."
 ce1_completed_my_holy_legend_desc:0 "I spread a tale of piety and divinity to every world under the Sun"
 ce1_completed_my_holy_legend_desc_second_perspective:0 "you spread a tale of piety and divinity to every world under the Sun"
 ce1_completed_my_holy_legend_desc_third_perspective:0 "[owner.GetTitledFirstName] spread a tale of piety and divinity to every world under the Sun"
 tenet_armed_pilgrimages_desc:0 "Our pilgrims travel across the worlds to visit our sacred holy sites - we will gladly take up the sword to keep them safe from any who would harm them"
 ra_landless_adventurer_4_desc:0 "As an [adventurer|e], your primary source of income will be [task_contracts|e]. You can see them represented as scrolls on the map. $game_concept_task_contracts$ can be found all across the worlds, and require you to complete a specific task for an employer.\n\nYour [prestige_level|E] determines the [task_contract_tier|e] of $game_concept_task_contracts$ you receive. Obtaining the [GetPrestigeLevelName('(int32)2')] Level of Fame or higher unlocks purchasing or conquering [land|E], should you wish to transition into a [landed|E] [ruler|E]. Higher levels unlock more powerful options.\n\nYou can access new $game_concept_task_contracts$ by moving your [camp|e], an action which will cost an amount of [provisions_i][provisions|e] based on the distance moved."
 ra_landless_adventurer_6_desc:0 "@ra_landless_adventurer!\nAccept [task_contracts|e], move your [camp|e] to explore different parts of the worlds, and grow your [following|e].\n\nAs an [adventurer|e], you have the freedom to choose the future path of your [dynasty|e]. Will you stay on the road, try to gain a [title|e] in a distant land, or meddle with the affairs of [rulers|e] across the worlds?"
 legend_chapter_opening_priesthood_restoration:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] entered this world as the [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdjectiveNoTooltip] faithful were shattered across the worlds in a hopeless diaspora. With visions of an almighty [ROOT.Legend.GetProperty( 'faith' ).Faith.HouseOfWorship] towering over creation in [ROOT.Legend.GetProtagonist.GetHerHis] mind, [ROOT.Legend.GetProtagonist.GetSheHe] knew that [ROOT.Legend.GetProtagonist.GetSheHe] was charged with a holy mission from [ROOT.Legend.GetProperty( 'faith' ).Faith.HighGodName] to unite all [ROOT.Legend.GetProperty( 'faith' ).Faith.GetAdherentNamePluralNoTooltip]."
 legend_chapter_great_coronation:0 "[ROOT.Legend.GetProtagonist.GetNamePossessiveNoTooltip] held the greatest coronation ever known to Man, with [ROOT.Legend.GetProtagonist.GetFaith.HighGodName] [ROOT.Legend.GetProtagonist.GetFaith.HighGodHighGodHerselfHimself] blessing each moment of the glorious ceremony. Every known world beheld the [ROOT.Legend.GetProtagonist.GetTitleAsNameNoTooltip] in awe."
 guide_diplomatic_1:0 "A whispered rumor among courtiers is that the true power of [location.Custom('GetSpecialBuildingPrefix')][location.GetHolding.GetSpecialBuildingType.GetNameNoTooltip] lies in a secret chamber where all the worlds' treaties are magically bound and can be altered by the worthy."
 # batch 1b (2026-11-12 23:40): UI concepts, tutorials, traits, adventurer and generic events
 treasure_hunting_contract_decision_effect:0 "Starts [traveling|E] to a random location in the chosen [region|E] of the worlds."
 viz_extravagance.t4.charity.civil_service.fire:0 "This character is personally responsible for the upkeep of a fire service for [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip] — nearly unheard of on the other worlds."
 bp2_adult_education.0010.desc_uni:0 "Here I am, finally at the gates of [location.GetBaronyNameExplicitly], the renowned University seat.\n\nAll knowledge is collected inside these hallowed halls, and scholars of repute from all over the worlds assemble in these same hallways to preserve and increase a true wealth of wisdom. And I'll soon join them!"
 bp2_adult_education.1050.desc:0 "[location.GetBaronyNameExplicitly] is a center of studies that truly attracts students from all over the worlds!\n\nThis realization hits me as I contemplate how myself and many of my fellow pursuers of knowledge, including [student_1.GetFirstName] and [student_2.GetFirstName], are all foreigners in [location.GetBaronyNameExplicitlyNoTooltip]. I wonder if there is any way I could take advantage of this..."
 dyn_many_crown_legend_desc:0 "Either through fate or by design, power falls into [dynasty.GetName] hands. Our lands are many and our deeds great, and our dominion over the thrones of the worlds is preordained."
 fund_inspiration.0051.desc:0 "Worry not, my great [ROOT.Char.GetTitleTierName]," [inspiration_owner.GetTitledFirstName] bows with a dramatic flair and [ROOT.Char.Custom2('QuirkPresentPosOrNeg', SCOPE.sC('inspiration_owner'))].\n\n"I shall venture out and explore the worlds in your stead while you continue ruling over your realm. What I bring back will be of such caliber that you will feel my accomplishments #EMP permeate#! through the memento of my adventure!"\n\nThere's a slight pause before [inspiration_owner.GetSheHe] continues. "On that note, is there an area of the worlds that you're interested in, [ROOT.Char.Custom('FormOfAddressForLiege')]?""
 fund_inspiration.2060.desc.court:0 "My opulent court is resented and celebrated across the worlds, all wish they could match and enjoy its splendor, and, with that, come the admirers."
 fund_inspiration.2060.desc.fame:0 "My deeds are spoken of with reverence and envy across the worlds, from foreign courts to village taverns, and, with that, come the supporters."
 trait_traveler_1_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] is inspired by wanderlust — [ROOT.Char.GetSheHe] wants to see the worlds."
 trait_traveler_1_desc:0 "This character is inspired by a wanderlust to get out into the worlds."
 trait_traveler_3_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has walked many roads and seen much of the worlds."
 ep3_laamps.0032.desc:0 "A more thrilling life, traveling the worlds, calls to me. After long deliberation, I have decided to forfeit my lands to you, my liege, to keep as your own. I will shortly depart [old_primary_title.GetBaseNameNoTierNoTooltip] for the open road."
 ep3_laamps.5005.samefaith:0 "Such figures are well-known in [ROOT.Char.GetFaith.GetAdjective] circles. The traveling preachers spread the word of [priest.GetFaith.HighGodName] to every nook and cranny of the worlds."
 ep3_laamp_flavour_ewan.0051.desc.purpose.explorers.2:0 "flagrant ambitions to see the worlds constantly flaunted,"
 stewardship_domain_special.1102.desc:0 "[second_local_baron.GetTitledFirstName] presents me with wares from all over the worlds; cloth from the furthest reaches of the silk road, locally grown crops, technological marvels from the east...\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], what wares should we promote for the new fair?""
 stewardship_domain_special.1105.desc:0 "[local_baron.GetTitledFirstName] presents me with wares from all over the worlds; religious objects from holy cities, food grown by the [local_baron.GetFaith.DevoteeMalePlural] and [local_baron.GetFaith.DevoteeFemalePlural] in the area, marvels from foreign religions...\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], what wares should we promote for the new fair?""
 hold_court.7000.desc:0 "[local_leader.Custom2('MyCharacterIntroduction', ROOT.Char)|U] wanders into court, [local_leader.GetHerHis] eyes wildly admiring the wealth that one can afford in the capital.\n\n"It's no secret that [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U] is the envy of the worlds, [ROOT.Char.Custom('FormOfAddressForLiege')], but not all of your realm is so fortunate. In [low_dev_county.GetNameNoTier], for instance, the fields are barren with nary a soul to attend them. Would it not be grand if the entire realm were as magnificent as [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip|U]?""
 laamp_contract_scheme_desc_general_boilerplate:0 "\n\n#WEAK [contract_schemes|E] involve performing various duties for the landed [rulers|E] of the worlds in exchange for payment. Completing a $game_concept_task_contract$ for a $game_concept_ruler$ automatically adds them to your [contact_list|E].#!"
 laamp_base_contract_schemes.0031.desc:0 "The endless bickering of petty locals is one of few experiences shared by both the rulers of the worlds and [ROOT.Char.Custom('GetLaampDescribeTypeSelfPlural')] like myself.\n\nIt's enough to drive a [employer.GetWomanMan] mad, or at least make [employer.GetHerHim] so frustrated that [employer.GetSheHe] turns to outsiders for help — which is exactly what [employer.GetTitledFirstName] has done.\n\nIf my [ROOT.Char.Custom('GetCourtierTypePlural')|l] and I can calm some of [employer.GetHerHis] more irate subjects, we'll be paid handsomely."
 hunt.7001.adventurer:0 "Wouldn't you rather see the worlds with us?"
 ra_inspiration_open_desc:0 "You can now fund your first [inspiration|E]. An Inspiration is the desire of a character to realize an [artifact|E].\n\n[inspired|E] [characters|E] come and go from the most prestigious [royal_courts|E] of the worlds; when one stops at your court, you are notified and invited to [sponsor|E] this character's [project|E].\n\nBy paying a varying amount of [gold|E], you can secure this character's services and, after some time, a new Artifact!"
 lesson_basics_find_spouse_concept_desc:1 "Choosing #TUT_KW Find Spouse#! opens a list of potential [spouses|E] — they hail from [courts|E] all over the worlds!\n\nChoosing #TUT_KW Arrange Marriage#! also opens a list of potential [spouses|E], but only with people from the [court|E] of the Character you clicked.\n\n#TUT Your own Character is visible on the left, because this Marriage needs #EMP your#! approval. Whoever is the [liege|E] of the other spouse will appear on the right side, as the union will need their approval as well.\n\n#TUT_KW Arrange Marriage#! can be useful for match-making between your [courtiers|E] or for setting up a specific marriage [alliance|E]. For now, #TUT_KW Find Spouse#! is more relevant for our purposes.#!"
 ra_landless_adventurer_1_desc:0 "@ra_landless_adventurer_2! \nYou are an [adventurer|e]! Travel the worlds, visit the [courts|e] of [rulers|e] to find work, and complete [task_contracts|e] for gainful rewards. You can improve your [camp|e], recruit [followers|e], and build up a vast [contact_list|e]."
 ra_landless_adventurer_2_desc:0 "As an [adventurer|e], you are not tied to any one piece of land, instead having the freedom to travel the worlds. Your base of operations as an $game_concept_adventurer$ is your [camp|e], which you can upgrade and expand with [camp_buildings|e] during the course of your adventuring career. "
 game_concept_location_desc:0 "Every [character|E] has a location indicating where they currently are among the worlds. To get from one location to another, you must [travel|E]."
 game_concept_point_of_interest_desc:0 "A $game_concept_point_of_interest$ is a location on one of the worlds that is worth visiting. When you visit that location for the first time, you will gain the benefits associated with it."
 game_concept_special_building_desc:0 "$game_concept_special_buildings$ are unique [buildings|E] that are present in a few predetermined places around the worlds.\n\nExamples include ancient wonders, grand cathedrals, and notable mines. Some are already constructed at the start of the game, while others have to be constructed.\n\n$game_concept_special_buildings$ are usually very powerful, and well worth fighting for."
 game_concept_wanderer_desc:0 "Characters who do not belong to a [court|E] or hold any [titles|e] are called Wanderers. They travel the worlds, visiting Courts as [guests|E] along the way. Wanderers might become [mercenary|E] Captains, leaders of [holy_orders|E], [clergy|E] members, or [city|E] holders."
 south_asia.0021.desc:0 "Forced to live nomadic lives and living in small enclaves across the worlds, the Jewish people have lacked a home to call their own. The centuries of wandering, it seems, are at last at an end.\n\n[founder.GetNameNoTooltip] has been crowned [founder.GetTitleAsNameNoTooltip] of $k_bene_israel$. Though unlikely, it seems the Jewish people have found their home along the West coast of India, with the [founder.GetFaith.ReligiousHeadTitleName] restored and the declaration of a new Israel, [founder.GetTitledFirstNameNoTooltip] believes [founder.GetHerselfHimself] to be ushering in a new golden age for followers of Judaism across the worlds."
