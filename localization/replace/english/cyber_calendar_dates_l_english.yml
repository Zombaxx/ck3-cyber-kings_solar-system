 # Cyber Kings 2026-11-14 00:20 (modder 22:39, 22:46): dates in the files are AP (AP = AD + 5000; start 7050.9.15 AP = 2050.9.15 AD).
 # 1) The engine date formats end in "AP". 2) Every vanilla loc key that prints a date or a year (scanned from the CK3 English loc,
 #    _dev/scripts/oneoff/gen_calendar_loc.py) also gives the AD year: "1 Jan 7050 AP (2050 AD)"; years alone become "2050 AD (7050 AP)".
 #    Ancient dates give negative AD years (the modder allowed it): Adam AP 997 = -4003 AD. DURATION_DATE_RANGE is skipped (substitution macro).
