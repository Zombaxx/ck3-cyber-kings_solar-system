 terraformed_adherent_plural:0 "Terraformers"
 terraformed_desc:0 "Sacred guardians of the dormant atmospheric machines, The Terraformed belive humanity had to transform Mars into a new home using the gifts given by the Singularity in time to survive as a test. Living against the Terraformers Code could cause all colonists to die making the management of decadence a priority. They believe the terraforming machines must be preserved and reactivated before the atmosphere escapes, forcing them to proselytize and spread their faith through any means necessary."
