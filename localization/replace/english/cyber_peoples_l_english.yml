 cult_of_hazhut_desc:0 "The Cult of Hazhut is a distorting mirror of the Cult of Knowledge, embodying the most negative traits of titans - greed, lust for power, hatred of others. Slave labor, bloody sacrifices, ruthless exploitation and tyranny are the pillars of this religion, for such is the will of the Father of Darkness. At one time, the followers of this religion were ruthlessly exterminated by the followers of the Cult of Knowledge, but, apparently, not completely."
