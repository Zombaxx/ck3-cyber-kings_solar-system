 rajatral_tar_desc:0 "Rajatral'tar is a polytheistic religion based on the worship of numerous gods. The number of gods of this religion is huge, but several main gods stand out in it: the supreme god Rajatra, whose sphere is the sun and royal power, the goddess of war Serhejet, the god of fire and the desert Yajatra, the goddess of death Mafredejt, the goddess of fertility and rain Teferjerut and the goddess of knowledge Shejart. They all fight against the monstrous Apojri, the Great Serpent, who wants to devour the world"
