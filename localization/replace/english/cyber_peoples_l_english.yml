 wargadanism_desc:0 "Wargadanism is a monotheistic religion based upon worshipping of a single warrior god - Wargadan. Wargadan originally was an Denisovan tribe chief, whose truly name was long forgotten, who managed to unify the various Denisovan tribes and build a mighty Denisovan Empire. According to the Denisovan legends, he did not die, but ascended to the eternal sky to rule not only the Denisovan, but the spirits as well. Wargadan favour those brave warriors who show courage and strength on the battlefield and ascend them after their death to join his great army that wage war against various evil spirits and various foreign gods that seeks to destroy his followers."
