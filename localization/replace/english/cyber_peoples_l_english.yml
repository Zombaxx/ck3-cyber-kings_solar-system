 triarchy_desc:0 "The Triarchy, or VERIAL, is a religion based on the worship of three Gods-Triarchs: Lady Reanna, warrior-poet, patroness of military, Lord Al-Setep, patron of craft and knowledge and Lord Verios, patron of laws and diplomacy. The Triarchy is opposed by the evil god Shurdum, the ruler of the Cursed House and the lord of nightmares and diseases, who, according to legend, betrayed the Triarchy and killed Lord Naveruz, the herald of VERIAL"
