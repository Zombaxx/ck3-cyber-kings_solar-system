 eternal_mechanism_name:0 "Eternal Mechanism"
 eternal_mechanism:0 "Eternal Mechanism"
 eternal_mechanism_adj:0 "Eternal Mechanism"
 eternal_mechanism_adherent:0 "Mechanist"
 eternal_mechanism_adherent_plural:0 "Mechanists"
 eternal_mechanism_desc:0 "The Eternal Mechanism is the majority faith of the last surviving cyborgs of the Proto Civilization, who have largely remained isolated on Ganymede since their last fuel reserves ran out 1066 years ago. They see the universe as a vast, deterministic machine, believing humanity was once near Ascension before the First Great Disaster shattered interplanetary civilization many millennia ago. Their goal is to preserve knowledge, reclaim the many empires, and restore the lost Golden Age with the ancient secrets from the Proto-Civilizations. They meditate on ancient archives, awaiting the day they can reignite the Mechanism and reshape the Solar System in perfect order."
