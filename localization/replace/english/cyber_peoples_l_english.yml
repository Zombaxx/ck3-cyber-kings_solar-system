 cult_of_knowledge_desc:0 "The Cult of Knowledge cannot be considered a religion in the usual sense of the word. It is rather a philosophy aimed at comprehending and studying the world. Even \"The One Omniscient\" described in the texts of this \"religion\" is rather an incomprehensible ideal of a perfect being to strive for, rather than a deity. Nevertheless, like the followers of the Triarchy, the followers of the Cult of Knowledge fear and hate the evil god Shurdum..."
