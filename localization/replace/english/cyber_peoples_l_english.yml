 cult_of_kaine_desc:0 "The Cult of Kaine is a terrifying religion, whose adherents worship and make human sacrifices to the relentless Vicar of War, Kaine. In addition to the Vicar of War, they also worshipping other fallen ones that were condemed by others Vicars, such as Renneth, Vicar of Battle and daughter of Kaine, and Berethan, Vicar of Shadows. Followers of traditional Archaic Pantheon despise Blood Cultists for their practices, and that feeling is mutual"
