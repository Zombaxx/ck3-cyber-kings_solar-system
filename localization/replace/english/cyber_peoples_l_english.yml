 paleolithic_adherent_plural:0 "Paleoliths"
 paleolithic_desc:0 "Sacred rituals and intricate stone carvings form the core of Paleolithic practice, echoing whispers of ancient earth-bound mysteries and reverence for the natural world. Their beliefs are steeped in legends of ancestral spirits dwelling in deep caverns, guiding them in the art of forging and the secrets of the earth, thus endowing their culture with a profound connection to the land and its hidden treasures. Evil tongues claim that the Paleolithic god is in fact the Archaic Vare Aliur, which the Palelitchics vehemently deny"
