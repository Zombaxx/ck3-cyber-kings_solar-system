 nurutushian_desc:0 "The religion of the Nurutushians deviates from the materialism of the Cult of Knowledge towards blind faith in Nurutush, also known as \"The Chrome God\", a magical construct that helped the titans move to another world, and its creator, Cronus. Nurutushians believe that \"The Chrome God\" remaining in the dying world will soon join them in the new world and begin a new era of peace and prosperity"
