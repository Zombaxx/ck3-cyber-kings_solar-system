 zurvanism_adherent:0 "Divine Cycle"
 zurvanism_adherent_plural:0 "Divine Cycles"
 zurvanism_desc:0 "The Singularity is merely the moment that each cycle of the Divine Cycle begins. Adherents of this ideology believe the disaster and being earth-like irrelevant due to the cyclical nature of the universe, though do not deny that Earth is humanity's original homeland. The Divine Cycle is practiced among royalty through Divine Marriage."
