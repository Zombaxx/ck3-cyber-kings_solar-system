 magyar_pagan_adherent:0 "Escudo Solar"
 magyar_pagan_adherent_plural:0 "Escudo Solars"
 magyar_pagan_desc:0 "Escudo Solarists believe the ancient king Pakal had saved the Earth from the Doom with his sun shield vessel. Humanity strayed from this sacred knowledge and neglected to stop the Doom the second time. They must be ready to stop it the third."
 # norse_pagan (832 uses)
 norse_pagan_name:0 "Reaverism"
 norse_pagan:0 "Reaverism"
 norse_pagan_adj:0 "Reaverism"
 norse_pagan_adherent:0 "Reaverist"
 norse_pagan_adherent_plural:0 "Reaverists"
 norse_pagan_desc:0 "Reaverism is the opportunistic faith practiced largely by the Space Pirates and Criminal Syndicates of the Solar System, blending ancient pagan reverence with pragmatic self-interest. Devotees believe the recently re-discovered many Terraformed Worlds are a chaotic sea ripe for conquest and adventure, where morality is subjective, and fortune favors the bold. Reavers pursue personal glory and wealth, justifying raids and plunder as sacred rites. Ceremonies often involve symbolic tributes to patron deities for successful ventures, alongside rituals venerating the carrier and shuttle spaceships they managed to steal from the Celestial of Tau Ceti during their founding as living entities imbued with divine essence."
 # monophysite (2 uses)
 paulician_name:0 "Fundamentalist"
 paulician:0 "Fundamentalist"
 paulician_adj:0 "Fundamentalist"
 paulician_adherent:0 "Fundamentalist"
 paulician_adherent_plural:0 "Fundamentalists"
 paulician_desc:0 "Fundamentalism is a movement emphasizing biblical literalism. They argue that many modernist theologians had misinterpreted or rejected certain doctrines, especially biblical inerrancy, which they considered the fundamentals of the Christian faith. Fundamentalists are almost always described as holding to the beliefs in biblical infallibility and biblical inerrancy. In keeping with traditional Christian doctrines concerning biblical interpretation, the role of Jesus in the Bible, and the role of the church in society, fundamentalists usually believe in a core of Christian beliefs which include the historical accuracy of the Bible and all of the events which are recorded in it as well as the Second Coming of Jesus Christ. Fundamentalism manifests itself in various denominations which believe in various theologies, rather than a single denomination or a systematic theology."
 # messalian (248 uses)
 sethianism_name:0 "Holy Serpent"
 sethianism:0 "Holy Serpent"
 sethianism_adj:0 "Holy Serpent"
 sethianism_adherent:0 "Holy Serpent"
 sethianism_adherent_plural:0 "Holy Serpents"
 sethianism_desc:0 "The Holy Serpent is a heretical Christian sect that originated on the moon after the use of the Colomboid Space Gun successfully landed an expedition of joint USA and European forces in 1902, influenced by the native Lunists. They believe that the true God can be perceived by the carnal senses, and that this perception is necessary to reach perfection. Each person is born with an inner god, and only intense prayer can achieve its full potential. They also believe that Lucifer was the leader of a rebellion against the tyrant of the Elohim and a force for good, and that incest is sacred since it was practised by the children of Adam and Eve thanks to their salvation by the sacred Sacred Serpent. This same Sacred Serpent would show Jesus the true path after his 40 days of fasting in the desert, once again. They have no formal rites and no strict church hierarchy."
 # slavic_pagan (173 uses)
 slavic_pagan_name:0 "Lunism"
 slavic_pagan:0 "Lunism"
 slavic_pagan_adj:0 "Lunism"
 slavic_pagan_adherent:0 "Lunist"
 slavic_pagan_adherent_plural:0 "Lunists"
 slavic_pagan_desc:0 "Descended from the worship of deities prior to the Great Disaster of long ago, Lunism followers remember the dark forested lands and large rolling hills of tall grasses. Led by archivists who sought to keep these traditions alive through the dark ages of planetary isolation, the worship of these deities and the script of their mythological texts has combined to keep the Lunist faith strong. These people are stout and hold fast to their homeland, woe behold anyone who tries to take it from them or remove the sacred forests."
 # tengri_pagan (111 uses)
 tengri_pagan_name:0 "Shamanism"
 tengri_pagan:0 "Shamanism"
 tengri_pagan_adj:0 "Shamanism"
 tengri_pagan_adherent:0 "Shamanist"
 tengri_pagan_adherent_plural:0 "Shamanists"
 tengri_pagan_desc:0 "Shamanism is a pagan belief system found in various forms around Earth, revolves around the core practice of interaction with the spiritual world through intermediaries or 'shamans'. Its practitioners believe in a world imbued with spirits - of the deceased, of animals, of natural elements, and of deities. These spirits influence the material world and shamans can negotiate, appease, or interact with them for the benefit of their communities. Rituals, dreams, and symbols hold important places in these practices. The respect for nature is intrinsic, and ancestors are venerated. This decentralized religion, rich in rituals and deeply connected to the natural world, offers a unique way of spiritual life and societal organization."
 # trex_the_heretics (10 uses)
 waldensian_name:0 "Non-Denominational"
 waldensian:0 "Non-Denominational"
 waldensian_adj:0 "Non-Denominational"
 waldensian_adherent:0 "Non-Denominational"
 waldensian_adherent_plural:0 "Non-Denominationals"
 waldensian_desc:0 "Unorganized and decentralized, Non-Denominational Christians are marked by diverse practices, ranging from charismatic worship to minimalist gatherings, where believers emphasize scripture over dogma. However, its lack of cohesion has left it vulnerable to internal schisms and outside condemnation. Reforming the Non-Denominational Christian Heresy could bring unity to its scattered followers, potentially transforming it into a powerful spiritual force, guided by a codified theology that bridges its many disparate beliefs."
 # west_african_pagan (690 uses)
