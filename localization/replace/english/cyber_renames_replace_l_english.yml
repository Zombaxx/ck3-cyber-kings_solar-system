 # miaphysite (10 uses)
 adoptionist_name:0 "Latter-day Saints"
 adoptionist:0 "Latter-day Saints"
 adoptionist_adj:0 "Latter-day Saints"
 adoptionist_adherent:0 "Latter-day Saints"
 adoptionist_adherent_plural:0 "Latter-day Saintss"
 adoptionist_desc:0 "The Church of the Latter-day Saints, also unofficially called the Mormon Church, is a nontrinitarian, Christian restorationist church that considers itself to be the restoration of the original church founded by Jesus Christ. Although originating in the United States long before the Great Disaster, the church had pockets of followers all around the globe by the time the Great Disaster occured. Although their influence had dwindled over the millenia, they found that the disorganized Cult of the Reborn were the perfect opportunity to be indoctrinated into the true faith for their own salvation, and to gain enough followers to once again send prosthelytizing missions around the world."
 # baltic_pagan (571 uses)
 baltic_pagan_name:0 "Cargo Cult"
 baltic_pagan:0 "Cargo Cult"
 baltic_pagan_adj:0 "Cargo Cult"
 baltic_pagan_adherent:0 "Cargo Cult"
 baltic_pagan_adherent_plural:0 "Cargo Cults"
 baltic_pagan_desc:0 "A cargo cult is an indigenist millenarian belief system, in which adherents perform rituals which they believe will cause a more technologically advanced society to deliver goods. They are marked by a number of common characteristics, including a \"myth-dream\" that is a synthesis of indigenous and foreign elements, the expectation of help from the ancestors, charismatic leaders, and a belief in the appearance of an abundance of goods.."
 # bon (734 uses)
 bon_faith_name:0 "Ancestor Worship"
 bon_faith:0 "Ancestor Worship"
 bon_faith_adj:0 "Ancestor Worship"
 bon_faith_adherent:0 "Ancestor Worship"
 bon_faith_adherent_plural:0 "Ancestor Worships"
 bon_faith_desc:0 "Ancestor Worship is a collection of beliefs partially Buddhist in nature, with polytheistic animist traditions guided by shamans. The ancestral dieties often interact with the world of the living, at times protecting people, and at other times seeming to cause harm."
 # qarmatian (28 uses)
 druze_name:0 "Gnoslam"
 druze:0 "Gnoslam"
 druze_adj:0 "Gnoslam"
 druze_adherent:0 "Gnoslam"
 druze_adherent_plural:0 "Gnoslams"
 druze_desc:0 "Gnoslam, also known as Gnostic Chrislam, is a unique and complex faith, combining tenants from many Abrahamic teachings into a multifaceted belief system. They claim that all other Abrahamic religions are misinterpretations of their God-Emperor. Gnoslam reflects God's continuous attempts throughout history to establish his true religion. Having founded the original versions of Judaism, Christianity, Islam, and many of their reformations at different times, each iteration was an effort to restore the faith after it had strayed from the original message during his periods of absence. Rituals and practices blend aspects of prayer, meditation, and ceremonial rites, focusing on personal enlightenment and communal worship of God as the divine ruler and ultimate source of wisdom, and bringing his Kingdom of Divinity to all of the world."
 # finnish_pagan (359 uses)
 finnish_pagan_name:0 "Retrogradism"
 finnish_pagan:0 "Retrogradism"
 finnish_pagan_adj:0 "Retrogradism"
 finnish_pagan_adherent:0 "Retrogradist"
 finnish_pagan_adherent_plural:0 "Retrogradists"
 finnish_pagan_desc:0 "Retrogradism, a pagan belief system found in various forms around Triton, revolves around the core practice of retrograde with the spiritual world through intermediaries or 'shamans'. Its practitioners believe in a world imbued with spirits - of the deceased, of animals, of natural elements, and of deities. These spirits influence the material world and shamans can negotiate, appease, or interact with them for the benefit of their communities. Rituals, dreams, and symbols hold important places in these practices. The respect for nature is intrinsic, and ancestors are venerated. This decentralized religion, rich in rituals and deeply connected to the natural world, offers a unique way of spiritual life and societal organization."
 # fraticelli (1000 uses)
 gnostic_faith_name:0 "Gnostic"
 gnostic_faith:0 "Gnostic"
 gnostic_faith_adj:0 "Gnostic"
 gnostic_faith_adherent:0 "Gnostic"
 gnostic_faith_adherent_plural:0 "Gnostics"
 gnostic_faith_desc:0 "Gnostics seek a profound, esoteric understanding of Christ's teachings, emphasizing personal spiritual knowledge (gnosis) over traditional ecclesiastical authority. This faith revolves around the belief in a divine spark within each individual, which can be nurtured and awakened through deep contemplation, mystical experiences, and the decoding of symbolic, often hidden, meanings in Christian scripture."
 # hellenic_pagan (658 uses)
 hellenic_pagan_name:0 "Olympic"
 hellenic_pagan:0 "Olympic"
 hellenic_pagan_adj:0 "Olympic"
 hellenic_pagan_adherent:0 "Olympic"
 hellenic_pagan_adherent_plural:0 "Olympics"
 hellenic_pagan_desc:0 "The Olympic religion is polytheistic, with a pantheon of twelve major gods including Jupiter, Mars, Mercury, Venus, Minerva and Vesta. It originated in ancient Post-Disaster Mars with the conquests of Xander the Great and the Olympian Empire, it would go on to become the dominant religion in the western Tharsis Rise until the rise of Singularity and Solarianism."
 # nestorian (1299 uses)
 hussite_name:0 "Protestant"
 hussite:0 "Protestant"
 hussite_adj:0 "Protestant"
 hussite_adherent:0 "Protestant"
 hussite_adherent_plural:0 "Protestants"
 hussite_desc:0 "Protestants reject the Catholic doctrine of papal supremacy, but disagree among themselves regarding the number of sacraments, the real presence of Christ in the Eucharist, and matters of ecclesiastical polity and apostolic succession. They emphasize the priesthood of all believers, justification by faith alone rather than by faith with good works, the teaching that salvation comes by divine grace or \"unmerited favor\" only, not as something merited, and either affirm the Bible as being the sole highest authority or primary authority for Christian doctrine, rather than being on parity with sacred tradition."
 # khurmazta (446 uses)
 khurmazta_name:0 "Hermazta"
 khurmazta:0 "Hermazta"
 khurmazta_adj:0 "Hermazta"
 khurmazta_adherent:0 "Hermazta"
 khurmazta_adherent_plural:0 "Hermaztas"
 khurmazta_desc:0 "Hermazta is a syncretic form of Divine Cycle which was practiced among the Mercurians. It mixes Divine Cycle with Kemetic and other Mercurian religions. It worships and higher god and several lesser deities."
 # cathar (76 uses)
 lollard_name:0 "Anglican"
 lollard:0 "Anglican"
 lollard_adj:0 "Anglican"
 lollard_adherent:0 "Anglican"
 lollard_adherent_plural:0 "Anglicans"
 lollard_desc:0 "The Anglican Church emerged from a turbulent history to become a symbol of continuity and faith for its adherents. After the devastation of 2026 wiped out modern technology, the church served as a beacon of hope, stability, and community for the faithful. Its adherence to a middle path between Catholicism and Protestantism allows for a diverse range of beliefs and practices under a common banner, and its strong ties to the monarchy mean that it often plays a crucial role in the politics of the realm."
 # aztec (90 uses)
