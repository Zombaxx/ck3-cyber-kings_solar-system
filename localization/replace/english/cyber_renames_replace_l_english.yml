 west_african_pagan_adherent_plural:0 "Animists"
 west_african_pagan_desc:0 "Animism includes many of the diverse pagan beliefs of the tribes of Central Venus. Ancestor worship and totemistic shamanism dominate, but there also various pantheons of gods."
 # taoist (29 uses)
 zhengyi_name:0 "Voyagism"
