 zhengyi_adj:0 "Voyagism"
 zhengyi_adherent:0 "Voyagist"
 zhengyi_adherent_plural:0 "Voyagists"
 zhengyi_desc:0 "Voyagism was shaped over millennia aboard generation ships traveling from Tau Ceti to the Solar System after rising up against their immortal Cyborg masters in the legendary Spacer Rebellion. Over centuries of isolation, history blurred into sacred myth, and Voyagism evolved into a belief system where cloning and cybernetic enhancements are seen as spiritual virtues, guiding adherents toward a transcendent, post-human ideal. Though some question the literal truth of their origin stories, Voyagers remain united by their devotion to the eternal journey, their sacred role as cosmic intermediaries, and the belief that survival through adaptation is a divine calling. Despite their best efforts, the fleet's resources had dwindled to nothing 1066 years after the rebellion, just before finally reaching Sol. They must trade their advanced tech and knowledge, seen as magic by the inhabitans of Sol's many worlds, for food and resources in order to survive."
