l_english:
 # Cyber Kings (2026-11-12): vanilla concept text with the space-lane sentence added at the end
 game_concept_travel_desc:0 "$game_concept_travel$ is the means by which a [character|E] gets from one [location|E] to another, primarily to attend [activities|E].\n\nThere are numerous ways to plan your journey like choosing a [GetCourtPositionType('travel_leader_court_position').GetName()] to hire, selecting [travel_options|E], and customizing your route. You will meet many interesting characters along your path, but be wary of [travel_danger|E] that may lay in wait.\n\nJourneys between the [worlds|E] follow the [space_lanes|E] aboard Spacer Guild ships; the [mare_incognitum|E] beyond them cannot be crossed."
 game_concept_fleet_desc:1 "[armies|E] who move into a Sea Zone will automatically [embark|E] onto a $game_concept_fleet$. [embarking] costs a sum of [gold|E], symbolizing the procurement and construction of ships.\n\nWhile on a $game_concept_fleet$, [armies] will be able to traverse water at a rapid pace, though they will cost #V 25%#! more maintenance and will start losing [supplies|E] after #V [GetDefine('NFleet', 'ATTRITION_AFTER_DAYS')|0]#! days at sea.\n\n$game_concept_fleets$ do not engage each other in [battles|E].\n\nWhen an $game_concept_army$ disembarks, the $game_concept_fleet$ will disappear and the $game_concept_army$ will become [recently_disembarked|E].\n\nBetween the [worlds|E], $game_concept_fleets$ are Spacer Guild ships and may only sail the [space_lanes|E]; the [mare_incognitum|E] beyond them cannot be crossed."
 game_concept_embarking_desc:1 "An [army|E] will automatically $game_concept_embark$ onto a [fleet|E] when given a move order into a Sea Zone, or when there is no land path to the targeted [barony|E].\n\n$game_concept_embarking$ costs a sum of [gold|E], symbolizing the procurement and construction of ships. For every #V 100#! men Embarking, a cost of #V [GetDefine('NFleet', 'EMBARK_GOLD_COST_PER_HUNDRED')|0]#! [gold_i] is paid.\n\nTo reach another [world|E], an [army|E] must $game_concept_embark$ and follow the [space_lanes|E]."
