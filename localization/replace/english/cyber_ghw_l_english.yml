l_english:
 # Cyber Kings (2026-11-12): solar-system versions of the vanilla great-holy-war texts (vanilla event
 # events/religion_events/great_holy_war_events.txt is NOT overridden; only its loc). Custom loc:
 # common/customizable_localization/cyber_kings_ghw_custom_loc.txt. After a CK3 patch, diff these keys
 # against vanilla great_holy_war_events_l_english.yml (VANILLA_PATCH_CHECKLIST).
 great_holy_war.0011.christian.t:0 "Crusades Among the Worlds"
 great_holy_war.0011.muslim.t:0 "Jihad Among the Worlds"
 great_holy_war.0011.catholic.rome.desc:0 "Rome, the city of Saint Peter and the very seat of the Papacy itself, has fallen to infidels. In response, the Pope-in-exile, [ghw_first_sponsor.GetHerHis|U] Holiness, [ghw_first_sponsor.GetTitledFirstName], has declared [ghw_first_sponsor.GetHerHis] intention to forge an alliance of Christian lords from every world the faithful have reached, to reclaim the eternal city and the lost sanctuaries on [awakening_faith.Custom('CkGhwLostWorld')]."
 great_holy_war.0011.christian.europe.desc:0 "The very heartlands of Christendom on Earth are under siege by infidels, and the faithful who crossed the mare incognitum to [awakening_faith.Custom('CkGhwLostWorld')] live under heathen rule! Desperate Christian lords have persuaded [ghw_first_sponsor.GetHerHis|U] Holiness, [ghw_first_sponsor.GetTitledFirstName], to declare [ghw_first_sponsor.GetHerHis] intention of forging a righteous alliance to expel the heathens from Earth and the worlds beyond the sky in the name of [awakening_faith.WarGodName]."
 great_holy_war.0011.christian.byzantion.desc:0 "The eastern bulwark of Christendom on Earth is failing, and the holy places on [awakening_faith.Custom('CkGhwLostWorld')] have long been lost to unbelievers. The dire situation has convinced [ghw_first_sponsor.GetHerHis|U] Holiness, [ghw_first_sponsor.GetTitledFirstName], to accept the possibility of an outright invasion by joint Christian forces, carried along the space lanes if need be."
 great_holy_war.0011.catholic.jerusalem.desc:0 "Christian pilgrims to the Holy Land suffer all manner of abuse, and those who brave the space lanes to the holy places on [awakening_faith.Custom('CkGhwLostWorld')] fare even worse.\n\nIn order to protect the pilgrims and secure Jerusalem and the sanctuaries beyond the sky for Christ and the faithful, [ghw_first_sponsor.GetHerHis|U] Holiness, [ghw_first_sponsor.GetTitledFirstName], has accepted the possibility of an outright invasion by joint Christian forces, on Earth and across the mare incognitum."
 great_holy_war.0011.christian.fallback.desc:0 "For too long the [awakening_faith.GetAdjective] faithful have been brutalized by heretics and infidels, on Earth and on [awakening_faith.Custom('CkGhwLostWorld')] alike. We shall no longer suffer our holy sites to be ravaged by blasphemers, nor our brethren beyond the mare incognitum to be abandoned. It is time for the true followers of [awakening_faith.WarGodName] to unite and strike back against the unbelievers, wherever the space lanes may lead!"
 great_holy_war.0011.muslim.mecca.desc:0 "The unthinkable has happened! The holy city of Mecca has fallen to infidels, and the Kaaba is even now being defiled by their very presence. [ghw_first_sponsor.GetHerHis|U] Magnificence, [ghw_first_sponsor.GetTitledFirstName], has declared that an era of renewed Jihad is upon the worlds. The holy city must be retaken at all costs, and the faithful on [awakening_faith.Custom('CkGhwLostWorld')] delivered from their oppressors. All righteous Muslim faithful should prepare to join the ranks of the mujahideen for the struggles to come, on Earth and across the mare incognitum."
 great_holy_war.0011.muslim.jerusalem.desc:0 "The Holy City of Jerusalem, where the Prophet was taken up to heaven, has fallen to infidels! [ghw_first_sponsor.GetHerHis|U] Magnificence, [ghw_first_sponsor.GetTitledFirstName], will not let this stand and has declared that another era of Great Conquests is upon us, such as was the case in the days of the first Caliphs - only this time the conquests will not stop at the edge of the sky. The Dar al-Islam must be defended, on Earth and on [awakening_faith.Custom('CkGhwLostWorld')]! All righteous Muslim faithful should prepare to join the ranks of the mujahideen for the struggles to come."
 great_holy_war.0011.muslim.arabia.desc:0 "The House of Islam is under grave threat from the onslaught of [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')], in its very heartlands on Earth and on [awakening_faith.Custom('CkGhwLostWorld')], where the faithful who crossed the mare incognitum now live under infidel rule. In response, [ghw_first_sponsor.GetHerHis|U] Magnificence, [ghw_first_sponsor.GetTitledFirstName], has declared that an era of renewed Jihad is upon the worlds. The Dar al-Islam, on Earth and beyond the sky, must be retaken at all costs. All righteous Muslim faithful should prepare to join the ranks of the mujahideen for the struggles to come."
 great_holy_war.0011.muslim.africa.desc:0 "The House of Islam is under grave threat from the onslaught of [ghw_first_sponsor.Custom('GetDerogatoryNonbelieverPlural')] in Africa and on [awakening_faith.Custom('CkGhwLostWorld')]. In response, [ghw_first_sponsor.GetHerHis|U] Magnificence, [ghw_first_sponsor.GetTitledFirstName], has declared that an era of renewed Jihad is upon the worlds. The western regions of the Ummah and the lost colonies beyond the sky must be retaken at all costs. All righteous Muslim faithful should prepare to join the ranks of the mujahideen for the struggles to come."
 great_holy_war.0011.muslim.fallback.desc:0 "The House of Islam is under grave threat from infidels and apostates, on Earth and on [awakening_faith.Custom('CkGhwLostWorld')]. All righteous [awakening_faith.GetAdjective] faithful should prepare to join the ranks of the mujahideen for the struggles to come. This signals a renewed era of Islamic expansion, one that will not stop at the edge of the sky."
 great_holy_war.0011.generic.fallback.head.desc:0 "With the [awakening_faith.GetReligion.GetAdjective] faithful beset from every corner by blasphemers, from [awakening_faith.Custom('CkGhwLostWorldAny')] to the farthest outposts across the mare incognitum, [ghw_first_sponsor.GetTitledFirstName] has decided that it is time for all warriors of [awakening_faith.WarGodName] to pick up arms and defend their sacred grounds by planning a magnificent campaign of religious conquest among the worlds."
 great_holy_war.0011.generic.fallback.desc:0 "We can no longer afford to stand idly by as blasphemers beset us from every side, desecrating our holy sites on [awakening_faith.Custom('CkGhwLostWorldAny')] and brutalizing our brethren. It is time for the warriors of [awakening_faith.WarGodName] to pick up arms, united under a single purpose, and carry the war along the space lanes."
 great_holy_war.0011.generic.ending.positive:0 "\n\nThis signals the beginning of a new era of great [awakening_faith.GetReligion.GetAdjective] holy wars - the [awakening_faith.GHWNamePlural] - fought not for one land, but for whole worlds."
 great_holy_war.0011.generic.ending.negative:0 "\n\nThis could be the beginning of unprecedented [awakening_faith.GetReligion.GetAdjective] aggression, and the mare incognitum will no longer keep it from our shores."
 great_holy_war.0003.catholic.desc:1 "A Papal envoy has reached my court, bringing news from the Vatican. [ghw_sponsor.GetTitledFirstName] issued a call to arms to all righteous Christian rulers. As a [ROOT.Char.GetFaith.GetAdherentNameNoTooltip] [ROOT.Char.GetTitleAsNameNoTooltip], I am expected to prepare my men in support of this most holy cause, sponsored by the Universal Church itself.\n\nTo all those who will take the fight against the vile [target_character.Custom('GetUnbelieverNamePlural')] desecrating the holy grounds of [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')], the Holy See promises full absolution from all sins and a guaranteed place in Heaven, however far beyond the sky the fight may lead."
 great_holy_war.0003.fallback.desc:0 "Glorious news has reached my court. [ghw_sponsor.GetTitledFirstName], has decided that it is time for all righteous [ghw_sponsor.GetFaith.GetAdherentNamePluralNoTooltip] to unite under a single banner and march against the enemies of the faith in a [ghw_sponsor.GetFaith.GHWName] for [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')], for the glory of [ghw_sponsor.GetFaith.WarGodName].\n\nTo all those who will join this sacred quest, the [ghw_sponsor.GetTitleTierName] ensures a place in [ghw_sponsor.GetFaith.DivineRealm]."
 great_holy_war.0050.base.desc:0 "[the_faith.GetAdjectiveNoTooltip] rulers, invigorated by a call to arms of [ghw_sponsor.GetTitledFirstName], have started to gather a large host of zealots to wage a [the_faith.GHWName] against all enemies of the [the_faith.ReligiousSymbol] in [target_kingdom.GetBaseNameNoTierNoTooltip] [target_kingdom.Custom('CkTitleOnWorld')]. More and more fanatics are drawn in every day in what will soon be a mighty army of the [the_faith.ReligiousSymbol] assembled to bring war upon our lands."
 great_holy_war.0051.catholic.attackers.desc:0 "The time has finally come to bring [the_faith.WarGodNamePossessive] holy wrath against the vile [ghw_defender.Custom('GetUnbelieverNamePlural')] of [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')].\n\nInflamed by righteous fury and unyielding resolve, the great army of crusaders assembled by [ghw_sponsor.GetTitledFirstName] sets forth to deliver divine justice upon the wicked and earn their place in [the_faith.DivineRealm]."
 great_holy_war.0051.generic.attackers.desc:0 "The time has finally come to consecrate the grounds of [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')] with the blood of the [ghw_defender.Custom('GetUnbelieverNamePlural')] and claim this land for the glory of [the_faith.WarGodName].\n\nOur holy warriors march with the certainty that, whether they emerge victorious or die fighting against the unbelievers, their devotion will earn them a place in [the_faith.PositiveAfterLife]."
 great_holy_war.0057.crusader.desc:0 "Our armies stand poised to take part in the [the_faith.GHWName] for [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')]. [the_faith.WarGodName] willing, we will soon rise victorious, the blood of the [ROOT.Char.Custom('GetDerogatoryNonbelieverPlural')] painting the soil red."
 great_holy_war.0057.mujahid.desc:0 "Our great struggle is finally upon us. Our armies stand ready to meet the infidels in battle [target_kingdom.Custom('CkTitleOnWorld')] and, with the blessing of [the_faith.WarGodName], they will soon stand victorious on the walls of [target_kingdom.GetBaseNameNoTier]."
 great_holy_war.0057.generic.outsiders.desc:0 "Our armies stand poised to take part in the [the_faith.GHWName] for [target_kingdom.GetBaseNameNoTier] [target_kingdom.Custom('CkTitleOnWorld')]. With [the_faith.WarGodName] by our side, we are sure to prevail!"
